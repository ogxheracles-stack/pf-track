<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5, user-scalable=yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="PF//TRACK"/>
<meta name="theme-color" content="#04060a"/>
<title>PF//TRACK</title>
<style>
:root{
  /* token aliases — env engine remaps these */
  --bg:#0a0e14;
  --panel:#141b24;
  --panel2:#1a2330;
  --line:#2a3544;
  --line2:#3a4758;
  --text:#e8eef4;
  --dim:#8b9aab;
  --muted:#6b7a8c;
  --neon:#b8ff2e;
  --neon-dim:rgba(184,255,46,.18);
  --cyan:#5ec8d8;
  --hot:#ff6b8a;
  --amber:#ffb020;
  --ok:#3dff9e;
  --ok-bg:rgba(61,255,158,.12);
  --env-glow-a:rgba(94,200,216,.08);
  --env-glow-b:rgba(184,255,46,.04);
  --reactive-glow:rgba(184,255,46,.14);
  --sb-bg:rgba(10,14,20,.98);
  --hud-bg:rgba(10,14,20,.96);
  --vice-sky-top:#050a12;
  --vice-sky-mid:#120820;
  --vice-sky-bot:#020306;
  --aurora-a:rgba(255,0,170,.1);
  --aurora-b:rgba(0,229,255,.08);
  --aurora-c:rgba(184,255,46,.06);
  --grid-line:rgba(0,229,255,.16);
  --grid-opacity:.16;
  --skyline-pink:#ff00aa;
  --skyline-cyan:#00e5ff;
  --tint-wash:transparent;
  --radius:14px;
  --radius-sm:12px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --tap:52px;
  --gap:13px;
  --card-pad:19px;
  --env-fade:450ms;
}
html[data-env="day"]{
  --bg:#06120e;
  --panel:#122018;
  --panel2:#182820;
  --line:#2a3a30;
  --line2:#3a4e42;
  --text:#e8f4ec;
  --dim:#8ba898;
  --muted:#6b8a78;
  --neon:#b8ff2e;
  --neon-dim:rgba(184,255,46,.18);
  --cyan:#5ec8d8;
  --hot:#ff6b8a;
  --amber:#ffb020;
  --ok:#3dff9e;
  --ok-bg:rgba(61,255,158,.12);
  --env-glow-a:rgba(94,200,216,.14);
  --env-glow-b:rgba(80,120,220,.1);
  --reactive-glow:rgba(184,255,46,.18);
  --sb-bg:rgba(6,18,14,.98);
  --hud-bg:rgba(6,18,14,.96);
  --vice-sky-top:#04140f;
  --vice-sky-mid:#0a1c2e;
  --vice-sky-bot:#020806;
  --aurora-a:rgba(61,255,158,.13);
  --aurora-b:rgba(70,120,255,.12);
  --aurora-c:rgba(94,200,216,.11);
  --grid-line:rgba(94,200,216,.2);
  --grid-opacity:.15;
  --skyline-pink:#3dff9e;
  --skyline-cyan:#5ec8d8;
}
html[data-env="night"]{
  --bg:#050218;
  --panel:#120e1c;
  --panel2:#1a1428;
  --line:#2a2438;
  --line2:#3a3450;
  --text:#ece8f4;
  --dim:#9a8bab;
  --muted:#7a6b8c;
  --neon:#c4a0ff;
  --neon-dim:rgba(196,160,255,.2);
  --cyan:#00e5ff;
  --hot:#ff6b8a;
  --amber:#ffb020;
  --ok:#3dff9e;
  --ok-bg:rgba(61,255,158,.12);
  --env-glow-a:rgba(255,0,170,.16);
  --env-glow-b:rgba(0,229,255,.1);
  --reactive-glow:rgba(255,0,170,.18);
  --sb-bg:rgba(5,2,24,.98);
  --hud-bg:rgba(5,2,24,.96);
  --vice-sky-top:#040218;
  --vice-sky-mid:#1a0532;
  --vice-sky-bot:#010104;
  --aurora-a:rgba(255,0,170,.18);
  --aurora-b:rgba(0,229,255,.15);
  --aurora-c:rgba(61,255,158,.1);
  --grid-line:rgba(255,0,170,.28);
  --grid-opacity:.22;
  --skyline-pink:#ff00aa;
  --skyline-cyan:#00e5ff;
}
/* Camo accent overlays (cosmetic-only) */
html[data-camo="verde"]{--neon:#b8ff2e;--neon-dim:rgba(184,255,46,.2);--cyan:#6ad4a0;--reactive-glow:rgba(184,255,46,.2)}
html[data-camo="midnight"]{--neon:#c4a0ff;--neon-dim:rgba(196,160,255,.22);--cyan:#8a7cff;--reactive-glow:rgba(196,160,255,.22)}
html[data-camo="glacial"]{--neon:#9ef0ff;--neon-dim:rgba(158,240,255,.2);--cyan:#7ad4e8;--reactive-glow:rgba(158,240,255,.2)}
html[data-camo="royal"]{--neon:#ffd060;--neon-dim:rgba(255,208,96,.2);--cyan:#c4a0ff;--reactive-glow:rgba(255,208,96,.18)}
html[data-camo="emerald"]{--neon:#3dff9e;--neon-dim:rgba(61,255,158,.2);--cyan:#5ec8a0;--reactive-glow:rgba(61,255,158,.2)}
html[data-camo="afterglow"]{--neon:#ff9a6a;--neon-dim:rgba(255,154,106,.22);--cyan:#ffb020;--reactive-glow:rgba(255,154,106,.2)}
html{
  transition:background-color var(--env-fade) ease, color var(--env-fade) ease;
}
html,body{background:var(--bg)}
.btn.pri{
  transition:box-shadow var(--env-fade) ease, filter .15s ease, transform .1s ease;
}
html.reactive-hot .card{
  box-shadow:0 0 28px var(--reactive-glow);
  border-color:var(--neon);
}
html.reactive-hot .btn.pri{
  box-shadow:0 4px 28px var(--reactive-glow);
}
html.reactive-low .card{box-shadow:none}
.shopGrid{display:grid;gap:10px;margin-top:12px}
.shopItem{
  display:flex;flex-direction:column;gap:8px;padding:14px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);
}
.shopItem.eq{border-color:rgba(184,255,46,.45);box-shadow:inset 3px 0 0 var(--neon)}
.shopSwatch{
  height:36px;border-radius:10px;border:1px solid var(--line2);
  background:linear-gradient(135deg,var(--neon),var(--cyan));
}
.shopRow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.shopMeta{font-size:12px;color:var(--dim)}
.seg{
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;
}
.seg button{
  min-height:44px;border-radius:10px;border:1px solid var(--line2);
  background:var(--panel2);color:var(--dim);font:600 13px/1 var(--font);cursor:pointer;
}
.seg button.on{background:var(--neon-dim);border-color:var(--neon);color:var(--neon)}
.moreList{display:grid;gap:10px;margin-top:8px}
.moreList .btn{justify-content:flex-start;gap:12px;padding-left:16px;text-align:left}
.moreList .btn .ico{opacity:.85;width:22px;text-align:center}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  font-size:16px;
  line-height:1.45;
  overflow-x:hidden;
  position:relative;
  transition:background-color var(--env-fade) ease, color var(--env-fade) ease;
}
#app{
  position:relative;z-index:1;
  max-width:440px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  padding:0 16px calc(72px + env(safe-area-inset-bottom,0px));
}

/* Neo-Vice City global ambient — navy→magenta→black / Verde Monte day */
#envBg{
  position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
}
#envBg .envGrad{
  position:absolute;inset:0;
  background:
    linear-gradient(180deg,var(--vice-sky-top) 0%,var(--vice-sky-mid) 46%,var(--vice-sky-bot) 100%),
    radial-gradient(120% 70% at 50% -5%,var(--env-glow-a),transparent 58%),
    radial-gradient(90% 50% at 50% 110%,var(--env-glow-b),transparent 60%);
  transition:background var(--env-fade) ease, opacity var(--env-fade) ease;
}
#envBg .envAurora{
  position:absolute;inset:-12% -18%;
  background:
    radial-gradient(ellipse 52% 38% at 18% 28%,var(--aurora-a),transparent 70%),
    radial-gradient(ellipse 48% 34% at 82% 22%,var(--aurora-b),transparent 70%),
    radial-gradient(ellipse 58% 42% at 50% 88%,var(--aurora-c),transparent 72%),
    radial-gradient(ellipse 40% 30% at 50% 40%,var(--tint-wash),transparent 75%);
  opacity:.9;
  filter:blur(1.5px);
  animation:auroraDrift 32s ease-in-out infinite alternate;
}
#envBg .envGrid{
  position:absolute;left:-25%;right:-25%;bottom:-8%;height:58%;
  background-image:
    linear-gradient(to bottom,transparent 0%,transparent 94%,var(--grid-line) 95%,transparent 100%),
    linear-gradient(to right,transparent 0%,transparent 94%,var(--grid-line) 95%,transparent 100%);
  background-size:56px 56px;
  background-position:0 0;
  transform:perspective(480px) rotateX(60deg) translateY(8%);
  transform-origin:50% 100%;
  opacity:var(--grid-opacity);
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.55) 35%,rgba(0,0,0,.95) 100%);
  mask-image:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.55) 35%,rgba(0,0,0,.95) 100%);
  animation:gridCrawl 22s linear infinite;
}
#envBg .envSkyline{
  position:absolute;left:0;right:0;bottom:0;height:min(36vh,260px);
  opacity:.48;
}
#envBg .envSkyline svg{display:block;width:100%;height:100%}
#envBg .envHaze{
  position:absolute;left:0;right:0;bottom:0;height:42%;
  background:
    linear-gradient(180deg,transparent 0%,rgba(255,0,170,.06) 55%,rgba(0,229,255,.05) 100%);
  opacity:.7;
  mix-blend-mode:screen;
}
html[data-env="day"] #envBg .envHaze{
  background:linear-gradient(180deg,transparent 0%,rgba(61,255,158,.05) 50%,rgba(70,120,255,.07) 100%);
}
#envBg .envScan{
  position:absolute;inset:0;
  background:repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(0,0,0,.035) 3px,
    rgba(0,0,0,.035) 4px
  );
  opacity:.4;pointer-events:none;
}
@keyframes auroraDrift{
  from{transform:translate3d(-2%,1%,0) scale(1)}
  to{transform:translate3d(2%,-1.5%,0) scale(1.04)}
}
@keyframes gridCrawl{
  from{background-position:0 0}
  to{background-position:0 56px}
}
html.reactive-low #envBg .envAurora,
html.reactive-low #envBg .envGrid{
  animation:none;
}
html.reactive-low #envBg .envAurora{opacity:.55}
html.reactive-low #envBg .envGrid{opacity:calc(var(--grid-opacity) * .7)}
html.reactive-low #envBg .envSkyline{opacity:.38}
html[data-tint="lime"]{--tint-wash:rgba(184,255,46,.14)}
html[data-tint="amber"]{--tint-wash:rgba(255,176,32,.14)}
html[data-tint="navy"]{--tint-wash:rgba(40,70,180,.16)}
html[data-tint="cyan"]{--tint-wash:rgba(0,229,255,.1)}
html[data-tint="none"]{--tint-wash:transparent}
@media (prefers-reduced-motion: reduce){
  #envBg .envAurora,#envBg .envGrid{animation:none !important}
}
.sb{
  position:sticky;top:0;z-index:40;margin:0 -16px 16px;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;
  display:flex;justify-content:space-between;align-items:center;
  font-size:12px;font-weight:600;color:var(--dim);
  background:linear-gradient(180deg,var(--sb-bg) 70%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.sb b{color:var(--neon);font-weight:700;letter-spacing:0.02em}
.dotlive{
  display:inline-block;width:8px;height:8px;border-radius:50%;
  background:var(--neon);margin-right:8px;vertical-align:middle;
  box-shadow:0 0 6px rgba(184,255,46,.45);opacity:.9;
}
.lbl{
  font-size:12px;font-weight:600;color:var(--dim);
  letter-spacing:0.04em;margin:0;
}
h1{
  font-size:27px;line-height:1.2;margin:8px 0 10px;font-weight:700;
  color:var(--text);letter-spacing:-0.01em;
}
h2{
  font-size:15px;font-weight:700;color:var(--text);margin:0 0 12px;
  letter-spacing:0;
}
.sub{
  color:var(--dim);margin:0 0 16px;font-size:15px;line-height:1.5;
}
.stat{
  font-family:var(--mono);font-size:36px;font-weight:700;
  font-variant-numeric:tabular-nums;line-height:1.1;color:var(--text);
}
.stat small{font-size:15px;color:var(--dim);font-weight:600}
.card{
  position:relative;z-index:1;padding:var(--card-pad);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  margin-top:var(--gap);
  box-shadow:0 8px 28px rgba(0,0,0,.28);
}
.card:first-of-type{margin-top:0}
.cue{
  background:rgba(255,176,32,.08);
  border-color:rgba(255,176,32,.35);
  color:#f0c27a;
  font-size:15px;line-height:1.5;
}
.cue b{color:#ffd080;font-weight:700}
.btn{
  display:flex;align-items:center;justify-content:center;
  width:100%;min-height:48px;padding:14px 18px;
  background:var(--panel2);border:1px solid var(--line2);
  border-radius:var(--radius-sm);
  color:var(--text);font:600 15px/1.25 var(--font);
  cursor:pointer;text-align:center;
}
.btn:active{transform:scale(.98);filter:brightness(1.08)}
.btn.pri{
  min-height:56px;font-size:17px;font-weight:700;
  background:linear-gradient(180deg,#d4ff6a,#a8e820);
  color:#0a1408;border-color:#e0ff9a;
  box-shadow:0 4px 18px var(--reactive-glow);
}
.btn.ok{
  min-height:56px;font-size:17px;font-weight:700;
  background:linear-gradient(180deg,#4dffaa,#1ec878);
  color:#03180e;border-color:#8affc8;
}
.btn.dan{
  min-height:48px;
  background:rgba(255,47,110,.1);color:#ff8aab;border-color:rgba(255,47,110,.35);
}
.btn.gho{
  background:transparent;color:var(--dim);border-color:var(--line);
  min-height:48px;
}
.btn.big{min-height:56px;font-size:17px}
.btn:disabled,.btn.disabled{opacity:.4;pointer-events:none}
.stack{display:grid;gap:10px;margin-top:16px}
.bar{
  height:10px;background:#0c1218;border:1px solid var(--line);
  border-radius:6px;margin:12px 0 10px;position:relative;overflow:hidden;
}
.bar>i{
  display:block;height:100%;border-radius:5px;
  background:linear-gradient(90deg,var(--cyan),var(--neon));
}
.dots{display:flex;gap:8px;margin:14px 0 8px}
.dot{
  flex:1;height:12px;background:#0c1218;border:1px solid var(--line);
  border-radius:6px;
}
.dot.on{background:var(--neon);border-color:var(--neon)}
.pill{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:28px;padding:4px 10px;font-size:12px;font-weight:600;
  background:var(--panel2);border:1px solid var(--line2);
  border-radius:999px;color:var(--dim);white-space:nowrap;
}
.pill.on{background:var(--ok-bg);border-color:#2a7a52;color:var(--ok)}
.pill.hot{background:rgba(255,176,32,.12);border-color:#5a4018;color:var(--amber)}
.pill.today{background:var(--neon-dim);border-color:#6f9a12;color:var(--neon)}
.row{
  display:flex;justify-content:space-between;gap:12px;
  padding:14px 0;border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:0}
.row b{font-size:15px;font-weight:600;letter-spacing:0}
.row .n{font-size:13px;color:var(--dim);margin-top:4px;line-height:1.4}
.row .r{text-align:right;flex-shrink:0}
.daybtn{
  display:flex;justify-content:space-between;align-items:center;width:100%;
  min-height:64px;padding:14px 16px;margin-bottom:10px;text-align:left;
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-sm);
  color:var(--text);font-family:var(--font);cursor:pointer;gap:12px;
}
.daybtn:active{filter:brightness(1.06)}
.daybtn.is-today{
  border-color:rgba(184,255,46,.55);
  box-shadow:inset 4px 0 0 var(--neon);
  background:rgba(184,255,46,.06);
}
.daybtn .l b{display:block;font-size:16px;font-weight:700}
.daybtn .l span{display:block;font-size:13px;color:var(--dim);margin-top:4px;line-height:1.35}
.setbox{display:flex;gap:12px;margin-top:14px}
.setbox>div{
  flex:1;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:14px 10px;text-align:center;
}
.step{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.step b{
  font-family:var(--mono);font-size:28px;font-weight:700;
  min-width:48px;font-variant-numeric:tabular-nums;
}
.mini{
  width:var(--tap);height:var(--tap);min-width:var(--tap);min-height:var(--tap);
  border-radius:12px;background:var(--panel2);border:1px solid var(--line2);
  color:var(--text);font:700 24px/1 var(--font);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
  user-select:none;-webkit-user-select:none;
}
.mini:active{background:var(--neon);color:#0a1408;border-color:var(--neon)}
.ringwrap{position:relative;width:200px;height:200px;margin:12px auto}
.ring{width:200px;height:200px}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:#1a2430}
.ring .fg{
  stroke:var(--neon);transform:rotate(-90deg);transform-origin:50% 50%;
  transition:stroke-dashoffset .4s linear;
}
.ringwrap .num{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--mono);font-size:58px;font-weight:700;
  font-variant-numeric:tabular-nums;
}
.check{
  width:88px;height:88px;margin:20px auto;display:grid;place-items:center;
  font-size:40px;color:var(--neon);
  border:2px solid var(--neon);border-radius:20px;
  background:var(--neon-dim);
}
input[type=number]{
  width:100%;min-height:var(--tap);background:#0c1218;
  border:1px solid var(--line2);border-radius:var(--radius-sm);
  color:var(--text);padding:14px 16px;
  font:600 18px/1.2 var(--font);outline:none;
}
input:focus{border-color:var(--neon)}
.toggle{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  min-height:64px;padding:14px 16px;margin-top:10px;
  background:var(--panel2);border:1px solid var(--line);
  border-radius:var(--radius-sm);cursor:pointer;
}
.toggle:first-child{margin-top:0}
.toggle .sw{
  width:52px;height:32px;border-radius:16px;background:#1a2530;
  border:1px solid var(--line2);position:relative;flex-shrink:0;
}
.toggle .sw::after{
  content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;
  border-radius:50%;background:var(--muted);transition:left .15s ease,background .15s ease;
}
.toggle.on .sw{background:var(--neon-dim);border-color:var(--neon)}
.toggle.on .sw::after{left:23px;background:var(--neon)}
.toggle b{font-size:16px;font-weight:600;display:block}
.toggle span{display:block;font-size:13px;color:var(--dim);margin-top:3px;line-height:1.35}
nav.hud{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);
  width:100%;max-width:440px;z-index:45;
  display:grid;grid-template-columns:repeat(6,1fr);
  background:var(--hud-bg);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);
  padding:6px 2px calc(8px + env(safe-area-inset-bottom,0px));
  gap:2px;
}
nav.hud button{
  background:0;border:0;color:var(--dim);
  font:600 10.5px/1.15 var(--font);
  min-height:56px;min-width:44px;padding:8px 1px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;cursor:pointer;border-radius:10px;
}
nav.hud button .ico{font-size:18px;opacity:.8;line-height:1}
nav.hud button.on{color:var(--neon);background:var(--neon-dim)}
nav.hud button.on .ico{opacity:1}
.toast{
  position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);z-index:55;
  background:rgba(12,28,20,.97);border:1px solid #2c6b46;
  border-radius:12px;color:var(--ok);
  padding:14px 18px;font-size:14px;font-weight:600;
  max-width:min(390px,92vw);text-align:center;
}
.boot{padding-top:calc(48px + env(safe-area-inset-top,0px))}
.bootline{
  font-size:14px;color:var(--ok);margin:0 0 10px;opacity:0;
  animation:bootin .4s ease forwards;
}
.bootline.dim{color:var(--dim)}
@keyframes bootin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.boottitle{
  font-size:28px;font-weight:700;margin:0 0 6px;color:var(--neon);
  letter-spacing:0.02em;
}
@keyframes bootfill{from{width:0}to{width:100%}}
.center{text-align:center}
.mt{margin-top:16px}
.mb{margin-bottom:16px}
.xpdots{display:flex;gap:8px;margin:12px 0}
.xpdots i{
  flex:1;height:10px;background:#0c1218;border:1px solid var(--line);
  border-radius:5px;
}
.xpdots i.on{background:var(--cyan);border-color:var(--cyan)}
.modal-bg{
  position:fixed;inset:0;z-index:80;
  background:rgba(4,8,12,.78);
  display:flex;align-items:flex-end;justify-content:center;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));
}
.modal{
  width:100%;max-width:400px;
  background:var(--panel);border:1px solid var(--line2);
  border-radius:18px;padding:22px 18px 18px;
  box-shadow:0 -8px 40px rgba(0,0,0,.45);
}
.modal h2{margin:0 0 8px;font-size:20px}
.modal p{margin:0 0 16px;color:var(--dim);font-size:15px;line-height:1.5}
.modal .stack{margin-top:0}
.modal input[type=text],.modal textarea{
  width:100%;min-height:var(--tap);background:#0c1218;
  border:1px solid var(--line2);border-radius:var(--radius-sm);
  color:var(--text);padding:14px 16px;
  font:600 16px/1.3 var(--font);outline:none;margin-bottom:12px;
  resize:vertical;
}
.modal textarea{min-height:110px;font-weight:500}
.modal input:focus,.modal textarea:focus{border-color:var(--neon)}
.undoGhost{
  position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);z-index:54;
  background:rgba(20,27,36,.97);border:1px solid var(--line2);
  border-radius:12px;color:var(--text);
  padding:12px 16px;font-size:14px;font-weight:600;
  max-width:min(390px,92vw);display:flex;align-items:center;gap:12px;
}
.undoGhost button{
  background:var(--panel2);border:1px solid var(--line2);color:var(--neon);
  border-radius:10px;padding:8px 14px;font:700 13px/1 var(--font);cursor:pointer;
}
.pinsLine{font-size:13px;color:var(--dim);margin:0 0 12px;line-height:1.45}
.pinsLine b{color:var(--text);font-weight:600}
.foodDots{display:flex;gap:8px;margin:12px 0 4px}
.foodDots i{
  flex:1;height:12px;background:#0c1218;border:1px solid var(--line);
  border-radius:6px;
}
.foodDots i.on{background:var(--ok);border-color:var(--ok)}
.foodDots i.partial{background:var(--amber);border-color:var(--amber)}
.delta{font-size:14px;font-weight:600;margin-top:4px}
.delta.up{color:var(--hot)}.delta.down{color:var(--ok)}.delta.flat{color:var(--dim)}
.walkMark{color:var(--amber);font-size:12px;font-weight:700;margin-left:6px}

.pinCard .row{padding:12px 0}
.pinCard .pinVal{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--neon)}
.pinCard .repsVal{font-size:12px;color:var(--dim);margin-top:2px}
.pinStrip{padding:10px 14px}
.pinStrip .pinLine{
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding:5px 0;font-size:13px;line-height:1.35;border-bottom:1px solid var(--line);
}
.pinStrip .pinLine:last-child{border-bottom:0;padding-bottom:0}
.pinStrip .pinLine b{font-weight:600;color:var(--text)}
.pinStrip .pinLine .meta{font-family:var(--mono);font-size:12px;color:var(--dim);white-space:nowrap}
.pinStrip .pinLine .meta b{color:var(--neon);font-weight:700}
.pinStrip .pinLine.preSkip{opacity:.55}
.fuelBar{
  height:14px;background:#0c1218;border:1px solid var(--line);
  border-radius:8px;margin:10px 0 8px;position:relative;overflow:hidden;
}
.fuelBar>i{
  display:block;height:100%;border-radius:7px;
  background:linear-gradient(90deg,var(--cyan),var(--neon));
}
.fuelBar .mark{
  position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.25);
}
.heat{
  background:rgba(255,107,138,.1);
  border-color:rgba(255,107,138,.4);
  color:#ffb0c0;
}
.heat b{color:#ffd0da}
.heatLine{margin:8px 0 0;font-size:13px;color:var(--muted)}
.crowdTag{display:inline-block;margin-top:6px}
.chip{
  display:inline-block;font-size:11px;font-weight:600;
  padding:2px 8px;border-radius:999px;margin-left:6px;
  background:rgba(255,176,32,.12);color:var(--amber);
  border:1px solid rgba(255,176,32,.3);vertical-align:middle;
}
details.bodyFold,details.pet-cosmetics{
  margin:0;border:0;padding:0;
}
details.bodyFold > summary,details.pet-cosmetics > summary{
  cursor:pointer;list-style:none;
  font:600 14px/1.35 var(--font);color:var(--dim);
  padding:2px 0 8px;-webkit-user-select:none;user-select:none;
}
details.bodyFold > summary::-webkit-details-marker,
details.pet-cosmetics > summary::-webkit-details-marker{display:none}
details.bodyFold > summary::before,
details.pet-cosmetics > summary::before{content:"▸ ";color:var(--neon)}
details.bodyFold[open] > summary::before,
details.pet-cosmetics[open] > summary::before{content:"▾ "}
details.bodyFold .toggle{margin-top:4px}
details.pet-cosmetics{margin-top:4px}
details.pet-cosmetics > summary{margin-bottom:4px;color:var(--text)}
.preSkip{opacity:.45}
.preSkip .n{color:var(--amber)}
.shame{border-style:dashed}
.uplinkBox{
  width:100%;min-height:160px;background:#0c1218;
  border:1px solid var(--line2);border-radius:var(--radius-sm);
  color:var(--text);padding:14px 16px;
  font:500 13px/1.45 var(--mono);outline:none;resize:vertical;
}
.uplinkBox:focus{border-color:var(--neon)}


/* Companion dragon */
#pet-root{
  position:fixed;
  top:calc(8px + env(safe-area-inset-top,0px));
  right:max(12px,env(safe-area-inset-right,0px));
  left:auto;bottom:auto;
  z-index:42;width:60px;height:60px;
  border-radius:16px;border:1px solid var(--line2);
  background:rgba(20,27,36,.94);
  box-shadow:0 8px 28px rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;overflow:visible;
  -webkit-user-select:none;user-select:none;
}
#pet-root.hidden{display:none}
#pet-root .pet-badge{
  position:absolute;top:-6px;right:-6px;min-width:20px;height:18px;
  padding:0 5px;border-radius:999px;font:700 10px/18px var(--mono);
  background:var(--amber);color:#1a1004;border:1px solid #ffd080;
}
#pet-root.celebrate{
  animation:petPulse 2.4s ease;
  box-shadow:0 0 0 3px rgba(184,255,46,.35),0 8px 28px rgba(0,0,0,.4);
}
@keyframes petPulse{
  0%,100%{transform:scale(1)}
  20%{transform:scale(1.08)}
  40%{transform:scale(1.02)}
  60%{transform:scale(1.06)}
}
#pet-root svg{display:block;width:46px;height:46px}
.pet-art{
  --pet-body:#6a9e5a;--pet-belly:#a8d48a;--pet-accent:#b8ff2e;
  --pet-horn:#b8ff2e;--pet-eye:#0a0e14;--pet-wing:#4a7a3a;
}
.pet-backdrop{
  position:fixed;inset:0;z-index:70;background:rgba(4,8,12,.72);
  opacity:0;pointer-events:none;transition:opacity .2s ease;
}
.pet-backdrop.open{opacity:1;pointer-events:auto}
.pet-panel{
  position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);
  width:100%;max-width:430px;z-index:72;
  background:var(--panel);border:1px solid var(--line2);
  border-radius:20px 20px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -12px 48px rgba(0,0,0,.5);
  transition:transform .28s ease;
  max-height:min(88vh,720px);overflow:auto;
}
.pet-panel.open{transform:translate(-50%,0)}
.pet-panel .pet-hero{
  display:flex;align-items:center;gap:14px;margin-bottom:14px;
}
.pet-panel .pet-hero .art{
  width:96px;height:96px;border-radius:20px;
  background:var(--panel2);border:1px solid var(--line);
  display:grid;place-items:center;flex-shrink:0;
}
.pet-panel .pet-hero .art svg{width:80px;height:80px}
.pet-panel .pet-hero h2{margin:0 0 4px;font-size:20px}
.pet-panel .pet-hero .stage{color:var(--neon);font-weight:700;font-size:13px}
.pet-panel .contract{
  font-size:13px;color:var(--dim);line-height:1.5;margin:0 0 14px;
  padding:12px 14px;background:rgba(184,255,46,.06);
  border:1px solid rgba(184,255,46,.22);border-radius:12px;
}
.pet-panel .ember-flow{
  display:flex;justify-content:space-between;gap:10px;margin-bottom:14px;
  padding:12px 14px;background:var(--panel2);border:1px solid var(--line);
  border-radius:12px;font-size:13px;color:var(--dim);
}
.pet-panel .ember-flow b{color:var(--amber);font-family:var(--mono)}
.pet-store{display:grid;gap:8px}
.pet-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  min-height:56px;padding:12px 14px;
  background:var(--panel2);border:1px solid var(--line);
  border-radius:12px;color:var(--text);font:600 14px/1.3 var(--font);
  cursor:pointer;text-align:left;width:100%;
}
.pet-item:active{filter:brightness(1.06)}
.pet-item .meta{font-size:12px;color:var(--dim);font-weight:500;margin-top:3px}
.pet-item .cost{font-family:var(--mono);font-size:13px;color:var(--amber);white-space:nowrap}
.pet-item.owned .cost{color:var(--ok)}
.pet-item.equipped{border-color:rgba(184,255,46,.55);background:rgba(184,255,46,.08)}
.pet-item:disabled{opacity:.45;pointer-events:none}
.pet-close{
  margin-top:12px;
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:0.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.01ms !important;
  }
  .ring .fg{transition:none}
  .bootline{opacity:1;animation:none}
  .bar>i[style*="bootfill"]{width:100% !important;animation:none !important}
  #pet-root.celebrate{animation:none}
  .pet-backdrop,.pet-panel{transition:none}
}

/* Calendar */
.calHead{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0 16px;
}
.calHead .btn{min-height:48px;padding:10px 8px;font-size:14px}
.calDow{
  display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;
}
.calDow span{
  text-align:center;font-size:11px;font-weight:600;color:var(--muted);
  letter-spacing:0.02em;padding:4px 0;
}
.calGrid{
  display:grid;grid-template-columns:repeat(7,1fr);gap:6px;
}
.calCell{
  min-height:52px;padding:6px 4px 8px;
  background:var(--panel);border:1px solid var(--line);
  border-radius:12px;color:var(--text);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  gap:4px;cursor:pointer;font:600 14px/1 var(--font);
}
.calCell:active{filter:brightness(1.08)}
.calCell .n{font-variant-numeric:tabular-nums}
.calCell.today{
  border-color:rgba(184,255,46,.7);
  box-shadow:0 0 0 1px rgba(184,255,46,.35);
  background:rgba(184,255,46,.08);
}
.calCell.mute{color:var(--muted);background:transparent;border-color:transparent}
.calCell.mute .n{opacity:.55}
.calDots{display:flex;gap:3px;min-height:6px;align-items:center;justify-content:center}
.calDots i{
  width:5px;height:5px;border-radius:50%;background:transparent;display:inline-block;
}
.calDots i.lift{background:var(--neon)}
.calDots i.food{background:var(--amber)}
.calDots i.walk{background:var(--cyan)}
.calDots i.note{background:var(--dim)}


/* Command hub v4.1 + neon city + macro rings */
.hubWrap{position:relative;margin:0 -16px 8px;padding:0 16px 28px;overflow:hidden}
.hubArt{
  position:absolute;left:0;right:0;bottom:0;height:140px;pointer-events:none;z-index:0;
  opacity:.55;
}
.hubArt svg{display:block;width:100%;height:100%}
.hubGlow{
  position:absolute;inset:auto -20% -40px -20%;height:180px;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 50% 60% at 30% 80%,rgba(255,0,170,.28),transparent 70%),
    radial-gradient(ellipse 45% 55% at 70% 85%,rgba(0,229,255,.24),transparent 70%),
    radial-gradient(ellipse 40% 50% at 50% 100%,rgba(61,255,158,.12),transparent 70%);
}
html[data-env="day"] .hubGlow{
  background:
    radial-gradient(ellipse 50% 60% at 28% 80%,rgba(61,255,158,.2),transparent 70%),
    radial-gradient(ellipse 45% 55% at 72% 85%,rgba(70,120,255,.18),transparent 70%),
    radial-gradient(ellipse 40% 50% at 50% 100%,rgba(94,200,216,.12),transparent 70%);
}
html.reactive-low .hubGlow,html.reactive-low .hubArt{opacity:.34}
.hubContent{position:relative;z-index:1}
.hubGreet{font-size:28px;font-weight:700;letter-spacing:-0.02em;margin:4px 0 4px;color:var(--text)}
.hubTag{font-size:14px;color:var(--dim);margin:0 0 14px;font-weight:500}
.hubMetrics{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 14px;
}
.hubMetric{
  background:rgba(20,27,36,.72);border:1px solid var(--line);border-radius:14px;
  padding:12px 10px;text-align:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.hubMetric .lbl{margin-bottom:4px}
.hubMetric .val{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--neon);line-height:1.1}
.hubMetric .val small{font-size:11px;color:var(--dim);font-weight:600;margin-left:2px}
.hubTiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 10px}
.hubTile{
  display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;
  min-height:108px;padding:16px;border-radius:18px;border:1px solid var(--line2);
  background:
    linear-gradient(145deg,rgba(94,200,216,.12),transparent 55%),
    var(--panel);
  color:var(--text);font-family:var(--font);cursor:pointer;text-align:left;
  box-shadow:inset 0 0 0 1px rgba(255,0,170,.06),0 8px 24px rgba(0,0,0,.22);
}
.hubTile.nut{
  background:
    linear-gradient(145deg,rgba(255,0,170,.12),transparent 55%),
    var(--panel);
}
.hubTile .tico{font-size:22px;color:var(--cyan);margin-bottom:8px;text-shadow:0 0 14px rgba(0,229,255,.35)}
.hubTile.nut .tico{color:#ff4ec8;text-shadow:0 0 14px rgba(255,0,170,.35)}
.hubTile .tlabel{font-size:17px;font-weight:700}
.hubTile .tnote{font-size:12px;color:var(--dim);margin-top:4px;font-weight:500}
.hubTile:active{filter:brightness(1.1)}
.hubMini{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 12px;
}
.hubMini .hubTile{
  min-height:72px;padding:12px;border-radius:14px;
  background:var(--panel);
  box-shadow:none;
}
.hubMini .tico{font-size:16px;margin-bottom:4px}
.hubMini .tlabel{font-size:13px}
.hubMini .tnote{display:none}
.bubbleSection.hubBubbles{margin-top:10px}
.bubbleSection.hubBubbles .bubbleMap{gap:8px}
.bubbleSection.hubBubbles .bubble{
  min-height:56px;aspect-ratio:auto;border-radius:16px;padding:8px 4px;gap:4px;
}
.bubbleSection.hubBubbles .bubble .bico{font-size:16px}
.bubbleSection.hubBubbles .bubble .blabel{font-size:11px}
.macroRings{
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 14px;
}
.macroRing{
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.macroRing .mdisc{
  width:64px;height:64px;border-radius:50%;
  display:grid;place-items:center;
  background:conic-gradient(var(--mcolor) calc(var(--mpct) * 1%), rgba(255,255,255,.08) 0);
  position:relative;
}
.macroRing .mdisc::before{
  content:"";position:absolute;inset:8px;border-radius:50%;background:var(--panel);
  border:1px solid var(--line);
}
.macroRing .mval{
  position:relative;z-index:1;font-family:var(--mono);font-size:11px;font-weight:700;color:var(--text);
  text-align:center;line-height:1.1;
}
.macroRing .mlbl{font-size:11px;font-weight:600;color:var(--dim);letter-spacing:0.04em}
.macroTargets{display:grid;gap:4px}
.macroRow{
  display:grid;grid-template-columns:1fr;gap:6px;
  padding:10px 0;border-bottom:1px solid var(--line);
}
.macroRow:last-child{border-bottom:0}
.macroRow > b{font-size:13px;font-weight:700}
.macroRow .macroSteps{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.macroRow .step{justify-content:space-between}
.macroRow .step b{min-width:44px;text-align:center;font-size:14px}
.bootArt{position:relative}
.bootArt .hubArt{opacity:.4;height:100px;bottom:auto;top:auto;position:relative;margin-top:18px}
@media (prefers-reduced-motion: reduce){
  .hubGlow{opacity:.35}
  .hubArt{opacity:.4}
}

/* Home bubble map v3.7 */
.bubbleSection{margin-top:18px}
.bubbleSection > .lbl{margin-bottom:10px}
.bubbleMap{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}
.bubble{
  aspect-ratio:1;
  min-width:0;
  min-height:72px;
  width:100%;
  border-radius:50%;
  border:1px solid var(--line2);
  background:radial-gradient(circle at 35% 28%,rgba(94,200,216,.16),transparent 55%),var(--panel);
  color:var(--text);
  font-family:var(--font);
  cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:10px 6px;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  touch-action:manipulation;
  box-shadow:inset 0 0 0 1px rgba(94,200,216,.08);
}
.bubble:active{filter:brightness(1.1);border-color:rgba(94,200,216,.55)}
.bubble .bico{
  font-size:22px;line-height:1;color:var(--cyan);
  text-shadow:0 0 12px rgba(94,200,216,.35);
}
.bubble .blabel{
  font-size:12px;font-weight:700;letter-spacing:0.02em;
  color:var(--text);line-height:1.1;
}
.bubbleNote{
  position:fixed;z-index:60;
  max-width:min(280px,78vw);
  padding:12px 14px;
  background:rgba(14,20,28,.97);
  border:1px solid rgba(94,200,216,.45);
  border-radius:14px;
  color:var(--text);
  font:600 14px/1.4 var(--font);
  box-shadow:0 10px 28px rgba(0,0,0,.45),0 0 0 1px rgba(184,255,46,.08);
  pointer-events:none;
}
.bubbleNote::after{
  content:"";position:absolute;left:50%;bottom:-6px;
  width:10px;height:10px;transform:translateX(-50%) rotate(45deg);
  background:rgba(14,20,28,.97);
  border-right:1px solid rgba(94,200,216,.45);
  border-bottom:1px solid rgba(94,200,216,.45);
}
.bubbleNote.below::after{
  bottom:auto;top:-6px;
  border:0;
  border-left:1px solid rgba(94,200,216,.45);
  border-top:1px solid rgba(94,200,216,.45);
}


/* v4.4 — diary, remaining macros, path, goal ring */
.mleft{font-size:11px;font-weight:600;color:var(--dim);text-align:center;line-height:1.2;min-height:14px}
.plateGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.plateBtn{
  min-height:64px;padding:12px;text-align:left;

  color:var(--text);font:600 14px/1.25 var(--font);cursor:pointer;
}
.plateBtn small{display:block;font-weight:500;color:var(--dim);font-size:12px;margin-top:4px}
.plateBtn:active{border-color:var(--neon);background:var(--neon-dim)}
.recentRow{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;-webkit-overflow-scrolling:touch}
.recentRow button{
  flex:0 0 auto;min-height:48px;padding:10px 14px;border-radius:999px;
  border:1px solid var(--line2);background:var(--panel);color:var(--text);
  font:600 14px/1 var(--font);cursor:pointer;
}
.diaryItem{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 0;border-bottom:1px solid var(--line);
}
.diaryItem:last-child{border-bottom:0}
.diaryItem button{
  min-height:44px;min-width:76px;border-radius:10px;
  border:1px solid var(--line2);background:var(--panel2);color:var(--dim);

<script>

const STORAGE_KEY = "pftrack_v3";
const LIVE_KEY = "pftrack_live";
const APP_VERSION = "4.7";
const LIVE_TTL_MS = 10 * 60 * 60 * 1000;
const CIRC = 2 * Math.PI * 52;
const COMPOUND = {press:1, lat:1, row:1, lpress:1, chest:1};
const ISOLATION = {raise:1, rear:1, tri:1, curlbi:1, abd:1, ext:1, curl:1, calf:1};
const WEEK_ORDER = [6, 0, 1, 2, 3, 4, 5];

const EMBER_PER_SESSION = 10;
const EMBER_FULL_WEEK_BONUS = 25;
const PET_STAGES = [
  {id:"hatchling", label:"Hatchling", min:1, max:2},
  {id:"whelp", label:"Whelp", min:3, max:5},
  {id:"drake", label:"Drake", min:6, max:9},
  {id:"wyrm", label:"Wyrm", min:10, max:999}
];
const PET_ITEMS = [
  {id:"scale_moss", slot:"scale", name:"Moss Scales", cost:0, palette:{"--pet-body":"#6a9e5a","--pet-belly":"#a8d48a","--pet-accent":"#b8ff2e","--pet-wing":"#4a7a3a"}},
  {id:"scale_ember", slot:"scale", name:"Ember Scales", cost:50, palette:{"--pet-body":"#c45a2e","--pet-belly":"#f0a060","--pet-accent":"#ffb020","--pet-wing":"#8a3a18"}},
  {id:"scale_void", slot:"scale", name:"Void Scales", cost:100, palette:{"--pet-body":"#3a2a5a","--pet-belly":"#6a5a8a","--pet-accent":"#a88cff","--pet-wing":"#2a1a40"}},
  {id:"horn_neon", slot:"horn", name:"Neon Horns", cost:0, palette:{"--pet-horn":"#b8ff2e"}},
  {id:"horn_bone", slot:"horn", name:"Bone Horns", cost:75, palette:{"--pet-horn":"#e8e0d0"}},
  {id:"horn_crystal", slot:"horn", name:"Crystal Horns", cost:120, palette:{"--pet-horn":"#5ec8d8"}},
  {id:"extra_hoard", slot:"extra", name:"Ember Hoard", cost:40},
  {id:"extra_wisps", slot:"extra", name:"Spirit Wisps", cost:60},
  {id:"extra_crown", slot:"extra", name:"Wyrm Crown", cost:150}
];

const CAMO_ITEMS = [
  {id:"default", name:"Default", price:0, free:true, swatch:"linear-gradient(135deg,#b8ff2e,#5ec8d8)", blurb:"Stock operator look"},
  {id:"verde", name:"Verde Monte", price:0, free:true, swatch:"linear-gradient(135deg,#b8ff2e,#3dff9e)", blurb:"Day-leaning green"},
  {id:"midnight", name:"Midnight Violet", price:120, free:false, swatch:"linear-gradient(135deg,#c4a0ff,#8a7cff)", blurb:"Night violet accents"},
  {id:"glacial", name:"Glacial", price:150, free:false, swatch:"linear-gradient(135deg,#9ef0ff,#7ad4e8)", blurb:"Ice cyan accents"},
  {id:"royal", name:"Royal", price:180, free:false, swatch:"linear-gradient(135deg,#ffd060,#c4a0ff)", blurb:"Gold + violet"},
  {id:"emerald", name:"Emerald", price:160, free:false, swatch:"linear-gradient(135deg,#3dff9e,#5ec8a0)", blurb:"Deep emerald neon"},
  {id:"afterglow", name:"Afterglow", price:200, free:false, swatch:"linear-gradient(135deg,#ff9a6a,#ffb020)", blurb:"Warm dusk accents"}
];

let batteryLevel = 1;
let batteryWatching = false;

function normalizeCosmetics(raw) {
  const d = defaults().cosmetics;
  const c = (raw && typeof raw === "object") ? raw : {};
  const pref = c.environmentPreference;
  const out = {
    environmentPreference: (pref === "day" || pref === "night" || pref === "auto") ? pref : "auto",
    camo: typeof c.camo === "string" ? c.camo : "default",
    reactive: typeof c.reactive === "boolean" ? c.reactive : true,
    owned: Array.isArray(c.owned) ? c.owned.slice() : d.owned.slice(),
    equipped: (c.equipped && typeof c.equipped === "object") ? Object.assign({}, d.equipped, c.equipped) : Object.assign({}, d.equipped),
    earned: (c.earned && typeof c.earned === "object") ? Object.assign({}, c.earned) : {}
  };
  // Offline personalization: grant all listed camos as owned (prices = future reference)
  CAMO_ITEMS.forEach(function(it) {
    if (out.owned.indexOf(it.id) < 0) out.owned.push(it.id);
  });
  if (out.owned.indexOf("default") < 0) out.owned.unshift("default");
  if (!out.camo || out.owned.indexOf(out.camo) < 0) out.camo = "default";
  if (!out.equipped.camo) out.equipped.camo = out.camo;
  return out;
}

function ensureCosmetics() {
  if (!state) return defaults().cosmetics;
  state.cosmetics = normalizeCosmetics(state.cosmetics);
  return state.cosmetics;
}

function resolveEnvironment() {
  const c = ensureCosmetics();
  const pref = c.environmentPreference || "auto";
  if (pref === "day" || pref === "night") return pref;
  const h = new Date().getHours();
  return (h >= 7 && h < 18) ? "day" : "night";
}

function prefersReducedMotion() {
  try {
    return !!(typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches);
  } catch (e) { return false; }
}

function applyDayTint() {
  // Light wash from todayPlan() — Sat lime / Fri amber / Thu navy; else none
  let tint = "none";
  try {
    const plan = todayPlan();
    if (plan) {
      if (plan.d === 6) tint = "lime";
      else if (plan.d === 5) tint = "amber";
      else if (plan.d === 4) tint = "navy";
      else if (plan.key) tint = "cyan";
    }
  } catch (e) {}
  try {
    document.documentElement.setAttribute("data-tint", tint);
  } catch (e) {}
  return tint;
}

function applyEnvironment() {
  const env = resolveEnvironment();
  try {
    document.documentElement.setAttribute("data-env", env);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) {
      meta.setAttribute("content", env === "day" ? "#06120e" : "#050218");
    }
  } catch (e) {}
  applyDayTint();
  applyCamoClass();
  applyReactiveClass();
  return env;
}

function applyCamoClass() {
  const c = ensureCosmetics();
  const camo = c.camo || "default";
  try {
    if (camo && camo !== "default") document.documentElement.setAttribute("data-camo", camo);
    else document.documentElement.removeAttribute("data-camo");
  } catch (e) {}
}

function reactiveAllowed() {
  const c = ensureCosmetics();
  if (!c.reactive) return false;
  if (prefersReducedMotion()) return false;
  if (batteryLevel < 0.2) return false;
  return true;
}

function applyReactiveClass() {
  const root = document.documentElement;
  root.classList.remove("reactive-hot", "reactive-low");
  if (!reactiveAllowed()) {
    root.classList.add("reactive-low");
    return;
  }
  const hot = (view === "lift") || !!(state && state.live);
  if (hot) root.classList.add("reactive-hot");
}

function watchBattery() {
  if (batteryWatching) return;
  batteryWatching = true;
  try {
    if (navigator.getBattery) {
      navigator.getBattery().then(function(b) {
        batteryLevel = typeof b.level === "number" ? b.level : 1;
        applyReactiveClass();
        b.addEventListener("levelchange", function() {
          batteryLevel = typeof b.level === "number" ? b.level : 1;
          applyReactiveClass();
        });
      }).catch(function() {});
    }
  } catch (e) {}
}

/* Apple Health bridge — real when WKWebView injects PFHealth / pfHealth; null on Safari */
var healthSummaryCache = null;
var healthSummaryAt = 0;
var healthAuthAsked = false;

function hasHealthBridge() {
  try {
    if (window.PFHealth && window.PFHealth.available) return true;
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.pfHealth) return true;
  } catch (e) {}
  return false;
}

function healthPost(action, payload) {
  if (!hasHealthBridge()) {
    return Promise.resolve(null);
  }
  try {
    if (window.PFHealth && typeof window.PFHealth.post === "function") {
      return window.PFHealth.post(action, payload || {}).catch(function() { return null; });
    }
  } catch (e) {}
  return Promise.resolve(null);
}

function requestHealthAuth() {
  return healthPost("health.requestAuth", {}).then(function(r) {
    healthAuthAsked = true;
    if (r && r.ok) {
      try { state.healthConnected = true; persist(); } catch (e) {}
    }
    return r;
  });
}

function refreshHealthSummary(force) {
  if (!hasHealthBridge()) return Promise.resolve(null);
  var age = Date.now() - (healthSummaryAt || 0);
  if (!force && healthSummaryCache && age < 60000) return Promise.resolve(healthSummaryCache);
  return healthPost("health.getSummary", {}).then(function(r) {
    if (r && r.ok !== false) {
      healthSummaryCache = r;
      healthSummaryAt = Date.now();
      if (r.sleepHours != null && state.sleepHours == null) {
        state.sleepHours = Number(r.sleepHours);
        try { persist(); } catch (e) {}
      }
    }
    return healthSummaryCache;
  });
}

function writeWeightToHealth(lb, iso) {
  if (!hasHealthBridge()) return Promise.resolve(null);
  if (!state || !state.healthWriteWeight) return Promise.resolve(null);
  var n = Number(lb);
  if (!n || n < 50 || n > 600) return Promise.resolve(null);
  return healthPost("health.writeWeight", { lb: n, date: iso || null }).then(function(r) {
    return r;
  }).catch(function() { return null; });
}

function getHeartRate() {
  return healthSummaryCache && healthSummaryCache.heartRate != null ? healthSummaryCache.heartRate : null;
}
function getRestingHR() {
  return healthSummaryCache && healthSummaryCache.restingHR != null ? healthSummaryCache.restingHR : null;
}
function getHRV() {
  return healthSummaryCache && healthSummaryCache.hrv != null ? healthSummaryCache.hrv : null;
}
function getSleepSample() {
  if (healthSummaryCache && healthSummaryCache.sleepHours != null) return healthSummaryCache.sleepHours;
  return null;
}
function getStepsSample() {
  return healthSummaryCache && healthSummaryCache.steps != null ? healthSummaryCache.steps : null;
}
function getHealthMetric(key) {
  if (!healthSummaryCache) return null;
  return healthSummaryCache[key] != null ? healthSummaryCache[key] : null;
}

function healthMetricsCardHtml() {
  if (!hasHealthBridge() && !healthSummaryCache) return "";
  var hr = getHeartRate();
  var rhr = getRestingHR();
  var hrv = getHRV();
  var sleep = getSleepSample();
  var steps = getStepsSample();
  var energy = getHealthMetric("activeEnergy");
  var bits = [];
  if (hr != null) bits.push('<div><div class="lbl">HR</div><b>' + hr + '</b><small> bpm</small></div>');
  if (rhr != null) bits.push('<div><div class="lbl">Resting</div><b>' + rhr + '</b><small> bpm</small></div>');
  if (hrv != null) bits.push('<div><div class="lbl">HRV</div><b>' + hrv + '</b><small> ms</small></div>');
  if (sleep != null) bits.push('<div><div class="lbl">Sleep</div><b>' + sleep + '</b><small> h</small></div>');
  if (steps != null) bits.push('<div><div class="lbl">Steps</div><b>' + steps + '</b></div>');
  if (energy != null) bits.push('<div><div class="lbl">Active</div><b>' + energy + '</b><small> kcal</small></div>');
  if (!bits.length) {
    return '<div class="card mt"><div class="lbl">Apple Health</div><p class="sub" style="margin:0">Connected · pull summary or wait for samples.</p></div>';
  }
  return '<div class="card mt"><div class="lbl">Apple Health</div><div class="row" style="border:0;padding:8px 0 0;flex-wrap:wrap;gap:14px">' + bits.join("") + "</div></div>";
}

function healthConnectHtml() {
  var bridged = hasHealthBridge();
  var connected = !!(state && state.healthConnected);
  var html = '<div class="card mt">';
  html += '<div class="lbl">Apple Health</div>';
  if (bridged) {
    html += '<p class="sub" style="margin-top:0">On-device only · no Face ID · no upload. Reads HR, HRV, sleep, steps, energy, weight.</p>';
    html += '<div class="stack" style="margin-top:10px">';
    html += '<button class="btn pri" id="healthConnectBtn">' + (connected ? "Refresh Health" : "Connect Apple Health") + "</button>";
    html += '</div>';
  } else {
    html += '<p class="sub" style="margin:0">Requires PF//TRACK iOS app. Safari cannot reach HealthKit — manual cues stay available.</p>';
  }
  html += "</div>";
  return html;
}

function setEnvironmentPreference(pref) {
  const c = ensureCosmetics();
  if (pref !== "auto" && pref !== "day" && pref !== "night") return;
  c.environmentPreference = pref;
  persist();
  applyEnvironment();
}

function setReactive(on) {
  const c = ensureCosmetics();
  c.reactive = !!on;
  persist();
  applyReactiveClass();
}

function equipCamo(id) {
  const c = ensureCosmetics();
  const item = CAMO_ITEMS.find(function(x) { return x.id === id; });
  if (!item) return;
  if (c.owned.indexOf(id) < 0) c.owned.push(id);
  c.camo = id;
  c.equipped.camo = id;
  persist();
  applyCamoClass();
  toast("Equipped · " + item.name + " · cosmetic only · no IAP yet");
}

function maybeEarnWeekCamo() {
  const c = ensureCosmetics();
  const ws = weekStartISO();
  if (liftKeysClearedThisWeek() < 4) return;
  if (c.earned && c.earned.week4 === ws) return;
  c.earned = c.earned || {};
  c.earned.week4 = ws;
  // Milestone stub: afterglow flagged as earned (already owned offline)
  if (c.owned.indexOf("afterglow") < 0) c.owned.push("afterglow");
  toast("Milestone · 4/4 week · Afterglow unlocked");
}



const PROGRAMS = {
  "upper-a": {
    name: "Upper A — V + Delts",
    why: "Width day. Press + laterals + pulldown build the triangle.",

function defaultMacrosFromLbm() {
  const lbm = Number(state && state.stats && state.stats.lbm) || 175;
  const proteinTarget = Math.round(lbm); // lower end of LBM range
  const fatTarget = Math.max(40, Math.round(lbm * 0.35));
  const calTarget = Math.round(lbm * 12);
  const carbsTarget = Math.max(50, Math.round((calTarget - proteinTarget * 4 - fatTarget * 9) / 4));
  return {
    calTarget: calTarget,
    proteinTarget: proteinTarget,
    carbsTarget: carbsTarget,
    fatTarget: fatTarget,
    cal: 0,
    protein: 0,
    carbs: 0,
    fat: 0
  };
}

function ensureMacros() {
  const base = defaultMacrosFromLbm();
  if (!state.macros || typeof state.macros !== "object") {
    state.macros = base;
  } else {
    const m = state.macros;
    ["calTarget","proteinTarget","carbsTarget","fatTarget","cal","protein","carbs","fat"].forEach(function(k) {
      if (m[k] == null || isNaN(Number(m[k]))) m[k] = base[k];
      else m[k] = Number(m[k]);
    });
    if (typeof m.date !== "string" || !m.date) m.date = todayISO();
  }
  return state.macros;
}

function activityStreak() {
  // Consecutive calendar days (ending today or yesterday) with a session or walk.
  const days = {};
  (state.sessions || []).forEach(function(s) {
    if (s && s.date) days[s.date] = 1;
  });
  (state.walks || []).forEach(function(w) {
    if (w && w.date) days[w.date] = 1;
  });
  let streak = 0;
  const cursor = new Date();
  // Allow streak to start from yesterday if today empty
  const today = todayISO();
  if (!days[today]) {
    cursor.setDate(cursor.getDate() - 1);
  }
  for (let i = 0; i < 365; i++) {
    const iso = isoFromDate(cursor);
    if (!days[iso]) {
      if (state.shield && state.shield.covered === iso) {
        streak++;
        cursor.setDate(cursor.getDate() - 1);
        continue;
      }
      break;
    }
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}

function loadLive() {
  try {
    const raw = sessionStorage.getItem(LIVE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || !parsed.live || !parsed.savedAt) return null;
    if (Date.now() - parsed.savedAt > LIVE_TTL_MS) {
      clearLiveStorage();
      return null;
    }
    return parsed.live;
  } catch (e) {
    return null;
  }

function blip(freq, dur, type, vol) {
  if (!state || !state.sound) return;
  const ctx = audio();
  if (!ctx) return;
  try {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type || "square";
    o.frequency.value = freq;
    g.gain.value = vol != null ? vol : 0.04;
    o.connect(g); g.connect(ctx.destination);
    const t = ctx.currentTime;
    g.gain.setValueAtTime(g.gain.value, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.1));
    o.start(t); o.stop(t + (dur || 0.1) + 0.02);
  } catch (e) {}
}

function todayISO() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}

function weekStart() {
  const d = new Date();
  const day = d.getDay();
  const satOffset = (day + 1) % 7;
  d.setDate(d.getDate() - satOffset);
  d.setHours(0, 0, 0, 0);
  return d;
}

function parseLocalDate(iso) {
  const parts = String(iso || "").split("-");
  if (parts.length < 3) return new Date(NaN);
  return new Date(+parts[0], +parts[1] - 1, +parts[2]);
}

function isoFromDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}

function addMonths(date, n) {
  const d = new Date(date.getFullYear(), date.getMonth(), 1);
  d.setMonth(d.getMonth() + n);
  return d;
}

function planForISO(iso) {
  const dt = parseLocalDate(iso);
  if (isNaN(dt.getTime())) return null;
  const day = dt.getDay();
  return WEEK.find(function(w) { return w.d === day; }) || null;
}

function ensureFoodFor(iso) {
  if (!iso) return ensureFood();
  if (!Array.isArray(state.foodHistory)) state.foodHistory = [];
  let entry = state.foodHistory.find(function(f) { return f.date === iso; });
  if (!entry) {
    entry = {date: iso, work: false, home: false, after: false, rice: false, items: [], waterOz: 0};
    state.foodHistory.unshift(entry);
  }
  if (entry.rice == null) entry.rice = false;
  if (!Array.isArray(entry.items)) entry.items = [];
  if (entry.waterOz == null || isNaN(Number(entry.waterOz))) entry.waterOz = 0;
  state.foodHistory = state.foodHistory
    .sort(function(a, b) { return a.date < b.date ? 1 : -1; })
    .slice(0, 120);
  if (iso === todayISO()) state.food = entry;
  return entry;
}

function sessionsForISO(iso) {
  return (state.sessions || []).filter(function(s) { return s.date === iso; });
}

function bodyweightForISO(iso) {
  return (state.bodyweights || []).find(function(w) { return w.date === iso; }) || null;
}

function foodForISO(iso) {
  return (state.foodHistory || []).find(function(f) { return f.date === iso; }) || null;
}

function dayMarks(iso) {
  const sessions = sessionsForISO(iso);
  const lift = sessions.some(function(s) {
    return s.key && PROGRAMS[s.key];
  });
  const food = foodForISO(iso);
  const foodN = food ? ((food.work ? 1 : 0) + (food.home ? 1 : 0) + (food.after ? 1 : 0)) : 0;
  const walk = !!walkForDate(iso);
  const note = !!(state.dayNotes && state.dayNotes[iso] && String(state.dayNotes[iso]).trim());
  return {lift: lift, foodN: foodN, walk: walk, note: note};
}

function isFutureISO(iso) {
  return iso > todayISO();
}

function isoInCurrentWeek(iso) {
  const start = weekStart();
  const dt = parseLocalDate(iso);
  if (isNaN(dt.getTime())) return false;
  const end = new Date(start);
  end.setDate(start.getDate() + 7);
  return dt >= start && dt < end;
}

function sessionsThisWeek() {
  const start = weekStart();
  return state.sessions.filter(function(s) {
    const dt = parseLocalDate(s.date);
    return dt >= start;
  });
}

function didKeyThisWeek(key) {
  return sessionsThisWeek().some(function(s) { return s.key === key; });
}

function liftKeysClearedThisWeek() {
  const keys = ["upper-a", "lower-a", "upper-b", "lower-b"];
  return keys.filter(function(k) { return didKeyThisWeek(k); }).length;
}

function walkThisWeekForDay(d) {
  const start = weekStart();
  const target = new Date(start);
  const orderIdx = WEEK_ORDER.indexOf(d);
  target.setDate(start.getDate() + (orderIdx < 0 ? 0 : orderIdx));
  const y = target.getFullYear();
  const m = String(target.getMonth() + 1).padStart(2, "0");

};

function resolveMovementId(raw) {
  const k = String(raw || "").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  if (!k) return null;
  if (MOVEMENT_ALIASES[k]) return MOVEMENT_ALIASES[k];
  // try without accents already stripped
  const keys = Object.keys(MOVEMENT_ALIASES);
  for (let i = 0; i < keys.length; i++) {
    const ak = keys[i].normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    if (ak === k) return MOVEMENT_ALIASES[keys[i]];
  }
  // known program ids
  const ids = ["press","lat","row","raise","rear","tri","curlbi","chest","lpress","abd","ext","curl","calf"];
  if (ids.indexOf(k) >= 0) return k;
  return null;
}

function formatPFTRACK(session) {
  if (!session) return "";
  let lines = ["PFTRACK"];
  if (session.key) lines.push("key: " + session.key);
  (session.work || []).forEach(function(w) {
    const sets = (w.sets || []).filter(function(x) { return x.done && !x.skipped; });
    if (!sets.length) return;
    lines.push(w.id + " " + sets.map(function(s) { return s.w + "x" + s.r; }).join(" "));
  });
  if (session.diff != null) lines.push("diff: " + session.diff);
  if (session.sore != null) lines.push("sore: " + session.sore);
  if (session.feet != null) lines.push("feet: " + session.feet);
  return lines.join("\n");
}

function parsePFTRACK(text) {
  const raw = String(text || "").trim();
  if (!raw) return {ok: false, error: "Empty"};
  const lines = raw.split(/\r?\n/).map(function(l) { return l.trim(); }).filter(Boolean);
  let start = 0;
  if (/^pftrack$/i.test(lines[0])) start = 1;
  const pins = {};
  let key = null;
  let log = false;
  let meta = {};
  for (let i = start; i < lines.length; i++) {
    const line = lines[i];
    const metaM = line.match(/^(key|diff|sore|feet|log)\s*:\s*(.+)$/i);
    if (metaM) {
      const mk = metaM[1].toLowerCase();
      const mv = metaM[2].trim();
      if (mk === "key") key = mv.toLowerCase();
      else if (mk === "log") log = /^(1|true|yes|y)$/i.test(mv);
      else meta[mk] = mv;
      continue;
    }
    const m = line.match(/^(.+?)\s+((?:\d+(?:\.\d+)?[xX×]\d+)(?:\s+\d+(?:\.\d+)?[xX×]\d+)*)$/);
    if (!m) continue;
    const id = resolveMovementId(m[1]);
    if (!id) continue;
    const pairs = m[2].split(/\s+/).map(function(p) {
      const parts = p.split(/[xX×]/);
      return {w: parseFloat(parts[0]), r: parseInt(parts[1], 10)};
    }).filter(function(p) { return p.w > 0 && p.r > 0; });
    if (!pairs.length) continue;
    pins[id] = pairs;
  }
  return {ok: true, key: key, pins: pins, log: log, meta: meta};
}

function applyPFTRACK(parsed) {
  if (!parsed || !parsed.ok) return {updated: 0};
  let updated = 0;
  const work = [];
  Object.keys(parsed.pins).forEach(function(id) {
    const pairs = parsed.pins[id];
    const last = pairs[pairs.length - 1];
    state.lastWeights[id] = last.w;
    updated++;
    // readyUp if both sets 15+
    if (pairs.length >= 2 && pairs[0].r >= 15 && pairs[1].r >= 15 && pairs[0].w === pairs[1].w) {
      // leave readyUp detection to next complete session; pins only here
    }
    work.push({
      id: id,
      name: id,
      sets: pairs.map(function(p) { return {w: p.w, r: p.r, done: true, skipped: false}; })
    });
  });
  if (parsed.log && work.length) {
    const key = parsed.key && PROGRAMS[parsed.key] ? parsed.key : null;
    const name = key ? PROGRAMS[key].name : "Uplink session";
    // enrich names from program if possible
    if (key) {
      work.forEach(function(w) {
        const ex = PROGRAMS[key].items.find(function(x) { return x.id === w.id; });
        if (ex) w.name = ex.name;
      });
    } else {
      Object.keys(PROGRAMS).forEach(function(k) {
        PROGRAMS[k].items.forEach(function(ex) {
          work.forEach(function(w) { if (w.id === ex.id && w.name === w.id) w.name = ex.name; });
        });
      });
    }
    state.sessions.unshift({
      date: todayISO(),
      key: key || "uplink",
      name: name,
      minutes: 1,
      reason: "uplink",
      work: work,
      diff: parsed.meta.diff,
      sore: parsed.meta.sore,
      feet: parsed.meta.feet
    });
    if (state.sessions.length > 60) state.sessions.length = 60;
  }
  persist();
  return {updated: updated, logged: !!parsed.log};
}


function xp() {
  return state.sessions.reduce(function(n, s) {
    const done = (s.work || []).reduce(function(a, w) {
      return a + (w.sets || []).filter(function(x) { return x.done && !x.skipped; }).length;
    }, 0);
    return n + done * 5 + 10;
  }, 0);
}

function level() {
  return Math.floor(xp() / 40) + 1;
}

function xpInto() {
  return xp() % 40;
}

function todayPlan() {

function defaultPet() {
  return {
    ember: 0,
    owned: ["scale_moss", "horn_neon"],
    equipped: {scale: "scale_moss", horn: "horn_neon", extras: []},
    lastSeenLevel: 1,
    celebrateUntil: 0,
    fullWeekAwarded: ""
  };
}

function normalizePet(raw) {
  const d = defaultPet();
  if (!raw || typeof raw !== "object") return d;
  const p = Object.assign({}, d, raw);
  if (!Array.isArray(p.owned)) p.owned = d.owned.slice();
  ["scale_moss", "horn_neon"].forEach(function(id) {
    if (p.owned.indexOf(id) < 0) p.owned.push(id);
  });
  if (!p.equipped || typeof p.equipped !== "object") p.equipped = Object.assign({}, d.equipped);
  if (!p.equipped.scale) p.equipped.scale = "scale_moss";
  if (!p.equipped.horn) p.equipped.horn = "horn_neon";
  if (!Array.isArray(p.equipped.extras)) p.equipped.extras = [];
  p.ember = Math.max(0, Number(p.ember) || 0);
  p.lastSeenLevel = Math.max(1, Number(p.lastSeenLevel) || 1);
  p.celebrateUntil = Number(p.celebrateUntil) || 0;
  p.fullWeekAwarded = typeof p.fullWeekAwarded === "string" ? p.fullWeekAwarded : "";
  // Old builds stored a Date → JSON UTC string; never equals local weekStartISO()
  if (p.fullWeekAwarded.indexOf("T") >= 0) p.fullWeekAwarded = "";
  return p;
}

  html += '<div class="ember-flow"><span>Session <b>+' + EMBER_PER_SESSION + "</b></span><span>Full week <b>+" + EMBER_FULL_WEEK_BONUS + "</b></span><span>Week <b>" + liftKeysClearedThisWeek() + "/4</b></span></div>";
  html += '<details class="pet-cosmetics"><summary>Cosmetics</summary><div class="pet-store">';
  PET_ITEMS.forEach(function(it) {
    const owned = pet.owned.indexOf(it.id) >= 0;
    let equipped = false;
    if (it.slot === "extra") equipped = pet.equipped.extras.indexOf(it.id) >= 0;
    else equipped = pet.equipped[it.slot] === it.id;
    let cls = "pet-item";
    if (owned) cls += " owned";
    if (equipped) cls += " equipped";
    const canBuy = !owned && pet.ember >= it.cost;
    const disabled = !owned && !canBuy;
    let action = owned ? (equipped && it.slot !== "extra" ? "equipped" : "equip") : "buy";
    let costLabel = owned ? (equipped ? "ON" : "EQUIP") : (it.cost === 0 ? "FREE" : it.cost + "✦");
    html += '<button type="button" class="' + cls + '" data-pet-item="' + it.id + '" data-pet-act="' + action + '"' + (disabled ? " disabled" : "") + ">";
    html += "<div><b>" + esc(it.name) + "</b><div class=\"meta\">" + esc(it.slot) + (equipped ? " · equipped" : owned ? " · owned" : "") + "</div></div>";
    html += '<span class="cost">' + costLabel + "</span></button>";
  });
  html += '</div></details><button type="button" class="btn gho pet-close" id="petClose">Close</button>';
  return html;
}

function buyOrEquipPet(id) {
  const pet = ensurePet();
  const it = petItem(id);
  if (!it) return;
  const owned = pet.owned.indexOf(id) >= 0;
  if (!owned) {
    if (pet.ember < it.cost) { toast("Need more embers"); return; }
    pet.ember -= it.cost;
    pet.owned.push(id);
    if (it.slot === "extra") {
      if (pet.equipped.extras.indexOf(id) < 0) pet.equipped.extras.push(id);
    } else {
      pet.equipped[it.slot] = id;
    }
    sfxConfirm();
    buzz(30);
    toast("Unlocked · " + it.name);
  } else if (it.slot === "extra") {
    const idx = pet.equipped.extras.indexOf(id);
    if (idx >= 0) pet.equipped.extras.splice(idx, 1);
    else pet.equipped.extras.push(id);
    sfxTap();
  } else {
    pet.equipped[it.slot] = id;
    sfxTap();
  }
  persist();
  renderPetWidget();
  const panel = document.getElementById("pet-panel");
  if (panel && !panel.hidden) {
    panel.innerHTML = petPanelHtml();
    applyPetPalette(document.getElementById("petHeroArt"));
    bindPetPanel();
  }

function restRemaining() {
  if (!state.live || !state.live.restUntil) return 0;
  return Math.max(0, Math.ceil((state.live.restUntil - Date.now()) / 1000));
}

function restTotal() {
  if (state.live && state.live.restSpan) return state.live.restSpan;
  if (!state.live) return 75;
  const ex = PROGRAMS[state.live.key].items[state.live.i];
  return restSecFor(ex.id);
}

function stopRestTick() {
  if (restTickHandle) { clearInterval(restTickHandle); restTickHandle = null; }
}

function patchRestUI() {
  const rem = restRemaining();
  const num = document.querySelector(".ringwrap .num");
  const fg = document.querySelector(".ring circle.fg");
  if (!num || !fg) return false;
  if (rem <= 0) return false;
  num.textContent = String(rem);
  const totalRest = restTotal();
  const off = CIRC * (1 - rem / Math.max(1, totalRest));
  fg.setAttribute("stroke-dashoffset", off.toFixed(1));
  return true;
}

function ensureRestTick() {
  stopRestTick();
  if (!state.live || !state.live.restUntil) return;
  if (document.visibilityState !== "visible") return;
  restTickHandle = setInterval(function() {
    if (!state.live || !state.live.restUntil) {
      stopRestTick();
      return;
    }
    const rem = restRemaining();
    if (rem <= 0) {
      state.live.restUntil = 0;
      saveLive();
      stopRestTick();
      blip(1046, 0.13, "triangle", 0.05);
      setTimeout(function() { blip(1568, 0.16, "triangle", 0.05); }, 150);
      buzz([40, 60, 40]);
      if (view === "lift") render();
      return;
    }
    // Patch ring in place — no full render / no pet SVG rebuild while resting
    if (view === "lift" && !patchRestUI()) render();
  }, 250);
}

function startRest() {
  if (!state.live) return;
  const ex = PROGRAMS[state.live.key].items[state.live.i];
  const sec = restSecFor(ex.id);
  state.live.restSpan = sec;
  state.live.restUntil = Date.now() + sec * 1000;
  saveLive();
  ensureRestTick();
  render();
}

function clearRest() {
  if (state.live) state.live.restUntil = 0;
  stopRestTick();
}

function applyReadyUp(items) {
  return items.map(function(ex) {
    let w = state.lastWeights[ex.id] != null ? state.lastWeights[ex.id] : 10;
    // Apply +5 to live sets only; consume readyUp flag on first completed set
    if (state.readyUp && state.readyUp[ex.id]) {
      w = w + 5;
    }
    return [
      {w: w, r: 12, done: false, skipped: false},
      {w: w, r: 12, done: false, skipped: false}
    ];
  });
}

function doStartWorkout(key) {
  const p = PROGRAMS[key];
  if (!p) return;
  clearUndo();
  const sets = applyReadyUp(p.items);
  if (key === "lower-b") {
    p.items.forEach(function(ex, idx) {
      if (ex.id === "calf" && isFeetCooked()) {
        sets[idx].forEach(function(s) { s.skipped = true; s.done = false; });
      }
      if (ex.id === "curl" && isHamWeird()) {
        sets[idx].forEach(function(s) { s.skipped = true; s.done = false; });
      }
    });
  }
  state.live = {
    key: key,
    date: todayISO(),
    i: 0,
    set: 0,
    restUntil: 0,
    restSpan: 0,
    combo: 0,
    started: Date.now(),
    sets: sets
  };
  advancePastPreSkipped();
  if (state.live.i >= p.items.length) {
    // everything pre-skipped — still open empty? finish as partial
    state.exitReason = "";
    persist();
    finishWorkout("partial");
    return;
  }
  state.exitReason = "";
  persist();
  sfxConfirm();
  buzz(25);
  go("lift");
}

function bump(kind, dir, step) {
  if (!state.live) return;
  const live = state.live;
  const s = live.sets[live.i][live.set];
  const st = step || 1;
  if (kind === "w") {
    s.w = Math.max(5, s.w + dir * 5 * st);
  } else {
    s.r = Math.max(1, Math.min(30, s.r + dir * st));
  }
  sfxTap();
  saveLive();
  // In-place update so long-press isn't destroyed by full re-render
  const box = document.querySelectorAll(".setbox b");
  if (box && box.length >= 2) {
    box[0].textContent = s.w;
    box[1].textContent = s.r;
  } else {
    render();
  }
}

function bindLongPress(btn, kind, dir) {
  let holdTimeout = null;
  let holdInterval = null;
  let armed = false;
  function fire(step) {
    if (step > 1) longPressFired = true;
    bump(kind, dir, step);
  }
  function clearLP() {
    if (holdTimeout) { clearTimeout(holdTimeout); holdTimeout = null; }
    if (holdInterval) { clearInterval(holdInterval); holdInterval = null; }
  }
  btn.addEventListener("pointerdown", function(e) {
    e.preventDefault();
    longPressFired = false;
    armed = true;
    clearLP();
    holdTimeout = setTimeout(function() {
      holdTimeout = null;
      fire(2);
      holdInterval = setInterval(function() { fire(2); }, 220);
    }, 420);
  });
  function end(e) {
    const wasLong = longPressFired;
    const wasArmed = armed;
    armed = false;
    clearLP();
    if (wasArmed && !wasLong && e.type !== "pointercancel") fire(1);
    longPressFired = false;
  }
  btn.addEventListener("pointerup", end);
  btn.addEventListener("pointerleave", function() {
    armed = false;
    clearLP();
    longPressFired = false;
  });
  btn.addEventListener("pointercancel", end);
}

function checkProgression(session) {
  (session.work || []).forEach(function(w) {
    const sets = (w.sets || []).filter(function(x) { return x.done && !x.skipped; });
    if (sets.length < 2) return;
    if (!(countsAsClean(sets[0]) && countsAsClean(sets[1]))) return;
    const pin = sets[0].w;
    if (sets[1].w !== pin) return;
    let found = null;
    for (let i = 1; i < state.sessions.length; i++) {
      const s = state.sessions[i];
      if (!s.work) continue;
      for (let j = 0; j < s.work.length; j++) {
        const ww = s.work[j];
        if (ww.id !== w.id) continue;
        const ss = (ww.sets || []).filter(function(x) { return x.done && !x.skipped; });
        if (ss.length >= 2) { found = ss.slice(0, 2); break; }
      }
      if (found) break;
    }
    if (!found) return;
    if (found[0].w !== pin || found[1].w !== pin) return;
    if (!(countsAsClean(found[0]) && countsAsClean(found[1]))) return;
    state.readyUp[w.id] = true;
    toast(w.name + " · ready to up one hole");
  });
}

function completeSet() {
  if (tapLock) return;
  tapLock = true;
  setTimeout(function() { tapLock = false; }, 380);
  const live = state.live;
  if (!live) return;
  const ex = PROGRAMS[live.key].items[live.i];
  const readyPending = !!(state.readyUp && state.readyUp[ex.id]);
  undoSnapshot = {
    i: live.i,
    set: live.set,
    restUntil: live.restUntil || 0,
    setData: Object.assign({}, live.sets[live.i][live.set]),
    lastW: state.lastWeights[ex.id],
    readyUpId: readyPending ? ex.id : null,
    combo: live.combo || 0
  };
  live.sets[live.i][live.set].clean = effectiveClean(live.sets[live.i][live.set]);
  live.sets[live.i][live.set].done = true;
  live.combo = (live.combo || 0) + 1;
  live.sets[live.i][live.set].skipped = false;
  state.lastWeights[ex.id] = live.sets[live.i][live.set].w;
  if (readyPending) {
    delete state.readyUp[ex.id];
    toast(ex.name + " · pin +5");
  }
  sfxConfirm();
  buzz(30);
  if (undoTimer) clearTimeout(undoTimer);
  undoTimer = setTimeout(function() {
    clearUndo();
  }, 8000);
  if (live.set === 0) {
    live.set = 1;
    startRest();
    showUndoGhost();
  } else {
    clearRest();
    if (live.i < PROGRAMS[live.key].items.length - 1) {
      live.i += 1;
      live.set = 0;
      advancePastPreSkipped();
      if (live.i >= PROGRAMS[live.key].items.length) {
        clearUndo();
        finishWorkout("complete");
      } else {
        saveLive();
        render();
        showUndoGhost();
      }
    } else {
      clearUndo();
      finishWorkout("complete");
    }
  }
}

function undoLastSet() {
  if (!undoSnapshot || !state.live) return;
  const live = state.live;
  const snap = undoSnapshot;
  const ex = PROGRAMS[live.key].items[snap.i];
  live.i = snap.i;
  live.set = snap.set;
  live.restUntil = 0;
  live.sets[snap.i][snap.set] = Object.assign({}, snap.setData, {done: false, skipped: false});
  if (snap.lastW == null) delete state.lastWeights[ex.id];
  else state.lastWeights[ex.id] = snap.lastW;
  if (snap.readyUpId) state.readyUp[snap.readyUpId] = true;
  live.combo = snap.combo || 0;
  clearUndo();
  stopRestTick();
  saveLive();
  sfxTap();
  toast("Set undone");
  render();
}

function skipMovement() {
  const live = state.live;
  if (!live) return;
  clearUndo();
  clearRest();
  live.combo = 0;
  const sets = live.sets[live.i];
  for (let i = live.set; i < sets.length; i++) {
    if (!sets[i].done) {
      sets[i].done = false;
      sets[i].skipped = true;
    }
  }
  if (live.i < PROGRAMS[live.key].items.length - 1) {
    live.i += 1;
    live.set = 0;
    advancePastPreSkipped();
    if (live.i >= PROGRAMS[live.key].items.length) {
      finishWorkout("partial");
    } else {
      saveLive();
      render();
    }
  } else {
    finishWorkout("partial");
  }
}

function finishWorkout(reason) {
  clearUndo();
  clearRest();
  const live = state.live;
  if (!live) return;
  const p = PROGRAMS[live.key];
  const session = {
    date: live.date,
    key: live.key,
    name: p.name,
    minutes: Math.max(1, Math.round((Date.now() - live.started) / 60000)),
    reason: reason || "complete",
    work: p.items.map(function(ex, i) {
      return {id: ex.id, name: ex.name, sets: live.sets[i]};
    })
  };
  state.sessions.unshift(session);
  if (state.sessions.length > 60) state.sessions.length = 60;
  if (reason === "complete") checkProgression(session);
  state.live = null;
  state.exitReason = reason || "complete";
  clearLiveStorage();
  const doneSets = (session.work || []).reduce(function(a, w) {
    return a + (w.sets || []).filter(function(x) { return x.done && !x.skipped; }).length;
  }, 0);
  let emberAward = {gained: 0, bonus: 0, total: ensurePet().ember, shield: false};
  if (doneSets > 0) {
    emberAward = awardSessionEmbers();
  }
  lastAward = emberAward;
  lastAward.xp = doneSets * 5 + 10;
  if (reason === "complete") sfxDone();
  else sfxWarn();
  buzz(60);
  persist();
  updateAppBadge();
  go("done");
  if (doneSets > 0) {
    let emberMsg = "+" + emberAward.gained + " embers";
    if (emberAward.bonus) emberMsg += " · +" + emberAward.bonus + " week bonus";
    toast(emberMsg);
  }
}

  if (!Array.isArray(entry.items)) entry.items = [];

    const d = new Date();
    d.setDate(d.getDate() - i);

function weightDeltaHtml() {
  const list = state.bodyweights || [];
  if (!list.length) return "";
  if (list.length < 2) return '<p class="delta flat">One weigh-in so far.</p>';
  const latest = list[0];
  const t0 = parseLocalDate(latest.date).getTime();
  const oldest = list[list.length - 1];
  const oldestDays = (t0 - parseLocalDate(oldest.date).getTime()) / 86400000;
  let row = oldest;
  let phrase = "the oldest log";
  if (oldestDays >= 21) {
    let best = Infinity;
    for (let i = 1; i < list.length; i++) {
      const days = (t0 - parseLocalDate(list[i].date).getTime()) / 86400000;
      const dist = Math.abs(days - 28);
      if (dist < best) { best = dist; row = list[i]; }
    }
    const d = Math.round((t0 - parseLocalDate(row.date).getTime()) / 86400000);
    phrase = (d >= 24 && d <= 34) ? "about 4 weeks ago" : (d + " days ago");
  }
  const delta = Math.round((Number(latest.lb) - Number(row.lb)) * 10) / 10;
  const sign = delta > 0 ? "+" : "";
  return '<p class="delta flat">' + sign + delta + " lb vs " + phrase + ".</p>";
}

function todayGoal() {
  const plan = todayPlan();
  if (plan && plan.key) {
    const logged = sessionsForISO(todayISO()).some(function(s) { return s.key === plan.key; });
    if (logged) return {pct: 100, title: plan.short, note: "Logged", board: ""};
    if (state.live && state.live.key === plan.key) {
      const prog = PROGRAMS[plan.key];
      const total = prog.items.length * 2;
      let done = 0;
      (state.live.sets || []).forEach(function(sets) {
        (sets || []).forEach(function(s) { if (s.done && !s.skipped) done++; });
      });
      const pct = Math.max(4, Math.min(96, Math.round(done / Math.max(1, total) * 100)));
      return {pct: pct, title: plan.short, note: "In session", board: plan.short + " is on the board."};
    }
    return {pct: 0, title: plan.short, note: "Open", board: plan.short + " is on the board."};
  }
  if (plan && isWorkDay(plan.d)) {
    const w = walkForDate(todayISO());
    const mins = w ? Number(w.minutes) || 0 : 0;
    const pct = Math.max(0, Math.min(100, Math.round(mins / 20 * 100)));
    return {pct: pct, title: "Walk", note: mins ? (mins + " / 20 min") : "Open", board: "Walk is on the board."};
  }
  const food = foodForISO(todayISO());
  const ate = !!(food && (food.home || food.work));
  return {pct: ate ? 100 : 0, title: plan ? plan.short : "Rest", note: ate ? "Plate logged" : "Gym off", board: "Rest day. Plate when you eat."};
}

function addPlate(plate, iso, opts) {
  opts = opts || {};
  if (!plate) return false;
  iso = iso || todayISO();
  if (isFutureISO(iso)) { toast("Future · plan only"); return false; }
  rollMacrosIfNewDay();
  const entry = ensureFoodFor(iso);
  entry.items.push({
    id: plate.id,
    name: plate.name,
    qty: 1,
    baseCal: plate.cal,
    baseProtein: plate.protein,
    baseCarbs: plate.carbs,
    baseFat: plate.fat,
    cal: plate.cal,
    protein: plate.protein,
    carbs: plate.carbs,
    fat: plate.fat
  });
  if (!entry.dayMacros) entry.dayMacros = {cal: 0, protein: 0, carbs: 0, fat: 0};
  entry.dayMacros.cal += plate.cal;
  entry.dayMacros.protein += plate.protein;
  entry.dayMacros.carbs += plate.carbs;
  entry.dayMacros.fat += plate.fat;
  if (iso === todayISO()) {
    const m = ensureMacros();
    m.cal += plate.cal;
    m.protein += plate.protein;
    m.carbs += plate.carbs;
    m.fat += plate.fat;
    entry.dayMacros = {cal: m.cal, protein: m.protein, carbs: m.carbs, fat: m.fat};
  }
  const slot = (state.plateSlot === "work" || state.plateSlot === "after") ? state.plateSlot : "home";
  entry[slot] = true;
  state.recentPlates = [plate.id].concat((state.recentPlates || []).filter(function(id) { return id !== plate.id; })).slice(0, 6);
  if (!opts.silent) {
    sfxConfirm();
    toast(plate.name + " · logged");
    armPlateUndo(iso);
  }
  if (!opts.deferPersist) persist();
  return true;
}

function removePlateAt(iso, idx, opts) {
  opts = opts || {};
  if (isFutureISO(iso)) return;
  const entry = ensureFoodFor(iso);
  if (!entry.items || !entry.items[idx]) return;
  const it = entry.items[idx];
  entry.items.splice(idx, 1);
  if (iso === todayISO()) {
    const m = ensureMacros();
    m.cal = Math.max(0, m.cal - (Number(it.cal) || 0));
    m.protein = Math.max(0, m.protein - (Number(it.protein) || 0));
    m.carbs = Math.max(0, m.carbs - (Number(it.carbs) || 0));
    m.fat = Math.max(0, m.fat - (Number(it.fat) || 0));
    entry.dayMacros = {cal: m.cal, protein: m.protein, carbs: m.carbs, fat: m.fat};
  } else if (entry.dayMacros) {
    entry.dayMacros.cal = Math.max(0, (entry.dayMacros.cal || 0) - (Number(it.cal) || 0));
    entry.dayMacros.protein = Math.max(0, (entry.dayMacros.protein || 0) - (Number(it.protein) || 0));
    entry.dayMacros.carbs = Math.max(0, (entry.dayMacros.carbs || 0) - (Number(it.carbs) || 0));
    entry.dayMacros.fat = Math.max(0, (entry.dayMacros.fat || 0) - (Number(it.fat) || 0));

  if (!opts.silent) {
    sfxTap();
    toast("Removed");
  }
  persist();
}
