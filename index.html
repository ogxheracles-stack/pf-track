<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="PF//TRACK"/>
<meta name="theme-color" content="#0a0e14"/>
<title>PF//TRACK · Marathon</title>
<style>
:root{
  --bg:#0a0e14;
  --panel:#141b24;
  --panel2:#1a2330;
  --line:#2a3544;
  --line2:#3a4758;
  --text:#e8eef4;
  --dim:#8b9aab;
  --muted:#6b7a8c;
  --neon:#b8ff2e;
  --neon-dim:rgba(184,255,46,.18);
  --cyan:#5ec8d8;
  --hot:#ff6b8a;
  --amber:#ffb020;
  --ok:#3dff9e;
  --ok-bg:rgba(61,255,158,.12);
  --radius:14px;
  --radius-sm:12px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --tap:52px;
  --gap:13px;
  --card-pad:19px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  font-size:16px;
  line-height:1.45;
  overflow-x:hidden;
  background-image:
    radial-gradient(100% 55% at 50% -8%,rgba(94,200,216,.08),transparent 55%),
    radial-gradient(80% 45% at 50% 105%,rgba(184,255,46,.04),transparent 55%);
  background-attachment:fixed;
}
#app{
  max-width:430px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  padding:0 16px calc(72px + env(safe-area-inset-bottom,0px));
}
.sb{
  position:sticky;top:0;z-index:40;margin:0 -16px 16px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 12px;
  display:flex;justify-content:space-between;align-items:center;
  font-size:12px;font-weight:600;color:var(--dim);
  background:linear-gradient(180deg,rgba(10,14,20,.98) 70%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.sb b{color:var(--neon);font-weight:700;letter-spacing:0.02em}
.dotlive{
  display:inline-block;width:8px;height:8px;border-radius:50%;
  background:var(--neon);margin-right:8px;vertical-align:middle;
  box-shadow:0 0 6px rgba(184,255,46,.45);opacity:.9;
}
.lbl{
  font-size:12px;font-weight:600;color:var(--dim);
  letter-spacing:0.04em;margin:0;
}
h1{
  font-size:27px;line-height:1.2;margin:8px 0 10px;font-weight:700;
  color:var(--text);letter-spacing:-0.01em;
}
h2{
  font-size:15px;font-weight:700;color:var(--text);margin:0 0 12px;
  letter-spacing:0;
}
.sub{
  color:var(--dim);margin:0 0 16px;font-size:15px;line-height:1.5;
}
.stat{
  font-family:var(--mono);font-size:36px;font-weight:700;
  font-variant-numeric:tabular-nums;line-height:1.1;color:var(--text);
}
.stat small{font-size:15px;color:var(--dim);font-weight:600}
.card{
  position:relative;padding:var(--card-pad);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  margin-top:var(--gap);
}
.card:first-of-type{margin-top:0}
.cue{
  background:rgba(255,176,32,.08);
  border-color:rgba(255,176,32,.35);
  color:#f0c27a;
  font-size:15px;line-height:1.5;
}
.cue b{color:#ffd080;font-weight:700}
.btn{
  display:flex;align-items:center;justify-content:center;
  width:100%;min-height:48px;padding:14px 18px;
  background:var(--panel2);border:1px solid var(--line2);
  border-radius:var(--radius-sm);
  color:var(--text);font:600 15px/1.25 var(--font);
  cursor:pointer;text-align:center;
}
.btn:active{transform:scale(.98);filter:brightness(1.08)}
.btn.pri{
  min-height:56px;font-size:17px;font-weight:700;
  background:linear-gradient(180deg,#d4ff6a,#a8e820);
  color:#0a1408;border-color:#e0ff9a;
  box-shadow:0 4px 20px rgba(184,255,46,.25);
}
.btn.ok{
  min-height:56px;font-size:17px;font-weight:700;
  background:linear-gradient(180deg,#4dffaa,#1ec878);
  color:#03180e;border-color:#8affc8;
}
.btn.dan{
  min-height:48px;
  background:rgba(255,47,110,.1);color:#ff8aab;border-color:rgba(255,47,110,.35);
}
.btn.gho{
  background:transparent;color:var(--dim);border-color:var(--line);
  min-height:48px;
}
.btn.big{min-height:56px;font-size:17px}
.btn:disabled,.btn.disabled{opacity:.4;pointer-events:none}
.stack{display:grid;gap:10px;margin-top:16px}
.bar{
  height:10px;background:#0c1218;border:1px solid var(--line);
  border-radius:6px;margin:12px 0 10px;position:relative;overflow:hidden;
}
.bar>i{
  display:block;height:100%;border-radius:5px;
  background:linear-gradient(90deg,var(--cyan),var(--neon));
}
.dots{display:flex;gap:8px;margin:14px 0 8px}
.dot{
  flex:1;height:12px;background:#0c1218;border:1px solid var(--line);
  border-radius:6px;
}
.dot.on{background:var(--neon);border-color:var(--neon)}
.pill{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:28px;padding:4px 10px;font-size:12px;font-weight:600;
  background:var(--panel2);border:1px solid var(--line2);
  border-radius:999px;color:var(--dim);white-space:nowrap;
}
.pill.on{background:var(--ok-bg);border-color:#2a7a52;color:var(--ok)}
.pill.hot{background:rgba(255,176,32,.12);border-color:#5a4018;color:var(--amber)}
.pill.today{background:var(--neon-dim);border-color:#6f9a12;color:var(--neon)}
.row{
  display:flex;justify-content:space-between;gap:12px;
  padding:14px 0;border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:0}
.row b{font-size:15px;font-weight:600;letter-spacing:0}
.row .n{font-size:13px;color:var(--dim);margin-top:4px;line-height:1.4}
.row .r{text-align:right;flex-shrink:0}
.daybtn{
  display:flex;justify-content:space-between;align-items:center;width:100%;
  min-height:64px;padding:14px 16px;margin-bottom:10px;text-align:left;
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-sm);
  color:var(--text);font-family:var(--font);cursor:pointer;gap:12px;
}
.daybtn:active{filter:brightness(1.06)}
.daybtn.is-today{
  border-color:rgba(184,255,46,.55);
  box-shadow:inset 4px 0 0 var(--neon);
  background:rgba(184,255,46,.06);
}
.daybtn .l b{display:block;font-size:16px;font-weight:700}
.daybtn .l span{display:block;font-size:13px;color:var(--dim);margin-top:4px;line-height:1.35}
.setbox{display:flex;gap:12px;margin-top:14px}
.setbox>div{
  flex:1;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:14px 10px;text-align:center;
}
.step{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.step b{
  font-family:var(--mono);font-size:28px;font-weight:700;
  min-width:48px;font-variant-numeric:tabular-nums;
}
.mini{
  width:var(--tap);height:var(--tap);min-width:var(--tap);min-height:var(--tap);
  border-radius:12px;background:var(--panel2);border:1px solid var(--line2);
  color:var(--text);font:700 24px/1 var(--font);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
  user-select:none;-webkit-user-select:none;
}
.mini:active{background:var(--neon);color:#0a1408;border-color:var(--neon)}
.ringwrap{position:relative;width:200px;height:200px;margin:12px auto}
.ring{width:200px;height:200px}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:#1a2430}
.ring .fg{
  stroke:var(--neon);transform:rotate(-90deg);transform-origin:50% 50%;
  transition:stroke-dashoffset .4s linear;
}
.ringwrap .num{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--mono);font-size:58px;font-weight:700;
  font-variant-numeric:tabular-nums;
}
.check{
  width:88px;height:88px;margin:20px auto;display:grid;place-items:center;
  font-size:40px;color:var(--neon);
  border:2px solid var(--neon);border-radius:20px;
  background:var(--neon-dim);
}
input[type=number]{
  width:100%;min-height:var(--tap);background:#0c1218;
  border:1px solid var(--line2);border-radius:var(--radius-sm);
  color:var(--text);padding:14px 16px;
  font:600 18px/1.2 var(--font);outline:none;
}
input:focus{border-color:var(--neon)}
.toggle{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  min-height:64px;padding:14px 16px;margin-top:10px;
  background:var(--panel2);border:1px solid var(--line);
  border-radius:var(--radius-sm);cursor:pointer;
}
.toggle:first-child{margin-top:0}
.toggle .sw{
  width:52px;height:32px;border-radius:16px;background:#1a2530;
  border:1px solid var(--line2);position:relative;flex-shrink:0;
}
.toggle .sw::after{
  content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;
  border-radius:50%;background:var(--muted);transition:left .15s ease,background .15s ease;
}
.toggle.on .sw{background:var(--neon-dim);border-color:var(--neon)}
.toggle.on .sw::after{left:23px;background:var(--neon)}
.toggle b{font-size:16px;font-weight:600;display:block}
.toggle span{display:block;font-size:13px;color:var(--dim);margin-top:3px;line-height:1.35}
nav.hud{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);
  width:100%;max-width:430px;z-index:45;
  display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(10,14,20,.96);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);
  padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px));
  gap:4px;
}
nav.hud button{
  background:0;border:0;color:var(--dim);
  font:600 11px/1.2 var(--font);
  min-height:56px;padding:8px 4px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;cursor:pointer;border-radius:10px;
}
nav.hud button .ico{font-size:18px;opacity:.8;line-height:1}
nav.hud button.on{color:var(--neon);background:var(--neon-dim)}
nav.hud button.on .ico{opacity:1}
.toast{
  position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);z-index:55;
  background:rgba(12,28,20,.97);border:1px solid #2c6b46;
  border-radius:12px;color:var(--ok);
  padding:14px 18px;font-size:14px;font-weight:600;
  max-width:min(390px,92vw);text-align:center;
}
.boot{padding-top:calc(48px + env(safe-area-inset-top,0px))}
.bootline{
  font-size:14px;color:var(--ok);margin:0 0 10px;opacity:0;
  animation:bootin .4s ease forwards;
}
.bootline.dim{color:var(--dim)}
@keyframes bootin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.boottitle{
  font-size:28px;font-weight:700;margin:0 0 6px;color:var(--neon);
  letter-spacing:0.02em;
}
@keyframes bootfill{from{width:0}to{width:100%}}
.center{text-align:center}
.mt{margin-top:16px}
.mb{margin-bottom:16px}
.xpdots{display:flex;gap:8px;margin:12px 0}
.xpdots i{
  flex:1;height:10px;background:#0c1218;border:1px solid var(--line);
  border-radius:5px;
}
.xpdots i.on{background:var(--cyan);border-color:var(--cyan)}
.modal-bg{
  position:fixed;inset:0;z-index:80;
  background:rgba(4,8,12,.78);
  display:flex;align-items:flex-end;justify-content:center;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));
}
.modal{
  width:100%;max-width:400px;
  background:var(--panel);border:1px solid var(--line2);
  border-radius:18px;padding:22px 18px 18px;
  box-shadow:0 -8px 40px rgba(0,0,0,.45);
}
.modal h2{margin:0 0 8px;font-size:20px}
.modal p{margin:0 0 16px;color:var(--dim);font-size:15px;line-height:1.5}
.modal .stack{margin-top:0}
.modal input[type=text],.modal textarea{
  width:100%;min-height:var(--tap);background:#0c1218;
  border:1px solid var(--line2);border-radius:var(--radius-sm);
  color:var(--text);padding:14px 16px;
  font:600 16px/1.3 var(--font);outline:none;margin-bottom:12px;
  resize:vertical;
}
.modal textarea{min-height:110px;font-weight:500}
.modal input:focus,.modal textarea:focus{border-color:var(--neon)}
.undoGhost{
  position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);z-index:54;
  background:rgba(20,27,36,.97);border:1px solid var(--line2);
  border-radius:12px;color:var(--text);
  padding:12px 16px;font-size:14px;font-weight:600;
  max-width:min(390px,92vw);display:flex;align-items:center;gap:12px;
}
.undoGhost button{
  background:var(--panel2);border:1px solid var(--line2);color:var(--neon);
  border-radius:10px;padding:8px 14px;font:700 13px/1 var(--font);cursor:pointer;
}
.pinsLine{font-size:13px;color:var(--dim);margin:0 0 12px;line-height:1.45}
.pinsLine b{color:var(--text);font-weight:600}
.foodDots{display:flex;gap:8px;margin:12px 0 4px}
.foodDots i{
  flex:1;height:12px;background:#0c1218;border:1px solid var(--line);
  border-radius:6px;
}
.foodDots i.on{background:var(--ok);border-color:var(--ok)}
.foodDots i.partial{background:var(--amber);border-color:var(--amber)}
.delta{font-size:14px;font-weight:600;margin-top:4px}
.delta.up{color:var(--hot)}.delta.down{color:var(--ok)}.delta.flat{color:var(--dim)}
.walkMark{color:var(--amber);font-size:12px;font-weight:700;margin-left:6px}

/* Companion dragon */
#pet-root{
  position:fixed;left:max(12px,env(safe-area-inset-left,0px));
  bottom:calc(78px + env(safe-area-inset-bottom,0px));
  z-index:42;width:72px;height:72px;
  border-radius:18px;border:1px solid var(--line2);
  background:rgba(20,27,36,.94);
  box-shadow:0 8px 28px rgba(0,0,0,.4);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;padding:0;overflow:visible;
  -webkit-user-select:none;user-select:none;
}
#pet-root.hidden{display:none}
#pet-root .pet-badge{
  position:absolute;top:-6px;right:-6px;min-width:22px;height:20px;
  padding:0 6px;border-radius:999px;font:700 11px/20px var(--mono);
  background:var(--amber);color:#1a1004;border:1px solid #ffd080;
}
#pet-root.celebrate{
  animation:petPulse 2.4s ease;
  box-shadow:0 0 0 3px rgba(184,255,46,.35),0 8px 28px rgba(0,0,0,.4);
}
@keyframes petPulse{
  0%,100%{transform:scale(1)}
  20%{transform:scale(1.08)}
  40%{transform:scale(1.02)}
  60%{transform:scale(1.06)}
}
#pet-root svg{display:block;width:56px;height:56px}
.pet-art{
  --pet-body:#6a9e5a;--pet-belly:#a8d48a;--pet-accent:#b8ff2e;
  --pet-horn:#b8ff2e;--pet-eye:#0a0e14;--pet-wing:#4a7a3a;
}
.pet-backdrop{
  position:fixed;inset:0;z-index:70;background:rgba(4,8,12,.72);
  opacity:0;pointer-events:none;transition:opacity .2s ease;
}
.pet-backdrop.open{opacity:1;pointer-events:auto}
.pet-panel{
  position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);
  width:100%;max-width:430px;z-index:72;
  background:var(--panel);border:1px solid var(--line2);
  border-radius:20px 20px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -12px 48px rgba(0,0,0,.5);
  transition:transform .28s ease;
  max-height:min(88vh,720px);overflow:auto;
}
.pet-panel.open{transform:translate(-50%,0)}
.pet-panel .pet-hero{
  display:flex;align-items:center;gap:14px;margin-bottom:14px;
}
.pet-panel .pet-hero .art{
  width:96px;height:96px;border-radius:20px;
  background:var(--panel2);border:1px solid var(--line);
  display:grid;place-items:center;flex-shrink:0;
}
.pet-panel .pet-hero .art svg{width:80px;height:80px}
.pet-panel .pet-hero h2{margin:0 0 4px;font-size:20px}
.pet-panel .pet-hero .stage{color:var(--neon);font-weight:700;font-size:13px}
.pet-panel .contract{
  font-size:13px;color:var(--dim);line-height:1.5;margin:0 0 14px;
  padding:12px 14px;background:rgba(184,255,46,.06);
  border:1px solid rgba(184,255,46,.22);border-radius:12px;
}
.pet-panel .ember-flow{
  display:flex;justify-content:space-between;gap:10px;margin-bottom:14px;
  padding:12px 14px;background:var(--panel2);border:1px solid var(--line);
  border-radius:12px;font-size:13px;color:var(--dim);
}
.pet-panel .ember-flow b{color:var(--amber);font-family:var(--mono)}
.pet-store{display:grid;gap:8px}
.pet-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  min-height:56px;padding:12px 14px;
  background:var(--panel2);border:1px solid var(--line);
  border-radius:12px;color:var(--text);font:600 14px/1.3 var(--font);
  cursor:pointer;text-align:left;width:100%;
}
.pet-item:active{filter:brightness(1.06)}
.pet-item .meta{font-size:12px;color:var(--dim);font-weight:500;margin-top:3px}
.pet-item .cost{font-family:var(--mono);font-size:13px;color:var(--amber);white-space:nowrap}
.pet-item.owned .cost{color:var(--ok)}
.pet-item.equipped{border-color:rgba(184,255,46,.55);background:rgba(184,255,46,.08)}
.pet-item:disabled{opacity:.45;pointer-events:none}
.pet-close{
  margin-top:12px;
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:0.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.01ms !important;
  }
  .ring .fg{transition:none}
  .bootline{opacity:1;animation:none}
  .bar>i[style*="bootfill"]{width:100% !important;animation:none !important}
  #pet-root.celebrate{animation:none}
  .pet-backdrop,.pet-panel{transition:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="pet-root" class="hidden" aria-label="Companion" role="button" tabindex="0"></div>
<div id="pet-backdrop" class="pet-backdrop" hidden></div>
<div id="pet-panel" class="pet-panel" hidden></div>
<script>

const STORAGE_KEY = "pftrack_v3";
const LIVE_KEY = "pftrack_live";
const APP_VERSION = "3.1";
const LIVE_TTL_MS = 10 * 60 * 60 * 1000;
const CIRC = 2 * Math.PI * 52;
const COMPOUND = {press:1, lat:1, row:1, lpress:1, chest:1};
const ISOLATION = {raise:1, rear:1, tri:1, curlbi:1, abd:1, ext:1, curl:1, calf:1};
const WEEK_ORDER = [6, 0, 1, 2, 3, 4, 5];

const EMBER_PER_SESSION = 10;
const EMBER_FULL_WEEK_BONUS = 25;
const PET_STAGES = [
  {id:"hatchling", label:"Hatchling", min:1, max:2},
  {id:"whelp", label:"Whelp", min:3, max:5},
  {id:"drake", label:"Drake", min:6, max:9},
  {id:"wyrm", label:"Wyrm", min:10, max:999}
];
const PET_ITEMS = [
  {id:"scale_moss", slot:"scale", name:"Moss Scales", cost:0, palette:{"--pet-body":"#6a9e5a","--pet-belly":"#a8d48a","--pet-accent":"#b8ff2e","--pet-wing":"#4a7a3a"}},
  {id:"scale_ember", slot:"scale", name:"Ember Scales", cost:50, palette:{"--pet-body":"#c45a2e","--pet-belly":"#f0a060","--pet-accent":"#ffb020","--pet-wing":"#8a3a18"}},
  {id:"scale_void", slot:"scale", name:"Void Scales", cost:100, palette:{"--pet-body":"#3a2a5a","--pet-belly":"#6a5a8a","--pet-accent":"#a88cff","--pet-wing":"#2a1a40"}},
  {id:"horn_neon", slot:"horn", name:"Neon Horns", cost:0, palette:{"--pet-horn":"#b8ff2e"}},

function clearLiveStorage() {
  try { sessionStorage.removeItem(LIVE_KEY); } catch (e) {}
}

function saveLive() {
  if (!state || !state.live) {
    clearLiveStorage();
    return;
  }
  try {
    sessionStorage.setItem(LIVE_KEY, JSON.stringify({
      savedAt: Date.now(),
      live: state.live
    }));
  } catch (e) {}
}

function loadLive() {
  try {
    const raw = sessionStorage.getItem(LIVE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || !parsed.live || !parsed.savedAt) return null;
    if (Date.now() - parsed.savedAt > LIVE_TTL_MS) {
      clearLiveStorage();
      return null;
    }
    return parsed.live;
  } catch (e) {
    return null;
  }
}

function load() {
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) {}
  let data = defaults();
  if (raw) {
    try {
      const parsed = JSON.parse(raw);
      data = Object.assign(defaults(), parsed);
      if (!data.stats) data.stats = defaults().stats;
      if (data.stats.lbm == null) data.stats.lbm = 175;
      if (!data.lastWeights) data.lastWeights = {};
      if (!Array.isArray(data.sessions)) data.sessions = [];
      if (!Array.isArray(data.bodyweights)) data.bodyweights = [];
      if (!data.readyUp || typeof data.readyUp !== "object") data.readyUp = {};
      if (!Array.isArray(data.walks)) data.walks = [];
      if (typeof data.haptics !== "boolean") data.haptics = true;
      if (typeof data.sound !== "boolean") data.sound = true;
      if (!Array.isArray(data.foodHistory)) data.foodHistory = [];
      if (data.food && data.food.date && !data.foodHistory.some(function(f){ return f.date === data.food.date; })) {
        data.foodHistory.unshift({
          date: data.food.date,
          work: !!data.food.work,
          home: !!data.food.home,
          after: !!data.food.after
        });
      }
      data.foodHistory = data.foodHistory.slice(0, 7);
      data.pet = normalizePet(data.pet);
    } catch (e) {}
  }
  data.pet = normalizePet(data.pet);
  data.live = null;
  state = data;
  const resumed = loadLive();
  if (resumed && resumed.key && PROGRAMS[resumed.key] && Array.isArray(resumed.sets)) {
    state.live = resumed;
  }
  return state;
}

function persist() {
  const copy = Object.assign({}, state);
  copy.live = null;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(copy)); } catch (e) {}
  saveLive();
}

function audio() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (AC && AC.state === "suspended") AC.resume();
  return AC;
}

function blip(freq, dur, type, vol) {
  if (!state || !state.sound) return;
  const ctx = audio();
  if (!ctx) return;
  try {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type || "square";
    o.frequency.value = freq;
    g.gain.value = vol != null ? vol : 0.04;
    o.connect(g); g.connect(ctx.destination);
    const t = ctx.currentTime;
    g.gain.setValueAtTime(g.gain.value, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.1));
    o.start(t); o.stop(t + (dur || 0.1) + 0.02);
  } catch (e) {}
}

function todayISO() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}

function weekStart() {
  const d = new Date();
  const day = d.getDay();
  const satOffset = (day + 1) % 7;
  d.setDate(d.getDate() - satOffset);
  d.setHours(0, 0, 0, 0);
  return d;
}

function parseLocalDate(iso) {
  const parts = String(iso || "").split("-");
  if (parts.length < 3) return new Date(NaN);
  return new Date(+parts[0], +parts[1] - 1, +parts[2]);
}

function sessionsThisWeek() {
  const start = weekStart();
  return state.sessions.filter(function(s) {
    const dt = parseLocalDate(s.date);
    return dt >= start;
  });
}

function didKeyThisWeek(key) {
  return sessionsThisWeek().some(function(s) { return s.key === key; });
}

function liftKeysClearedThisWeek() {
  const keys = ["upper-a", "lower-a", "upper-b", "lower-b"];
  return keys.filter(function(k) { return didKeyThisWeek(k); }).length;
}

function walkForDate(iso) {
  return (state.walks || []).find(function(w) { return w.date === iso; });
}

function walkThisWeekForDay(d) {
  const start = weekStart();
  const target = new Date(start);
  const orderIdx = WEEK_ORDER.indexOf(d);
  target.setDate(start.getDate() + (orderIdx < 0 ? 0 : orderIdx));
  const y = target.getFullYear();
  const m = String(target.getMonth() + 1).padStart(2, "0");
  const day = String(target.getDate()).padStart(2, "0");
  return walkForDate(y + "-" + m + "-" + day);
}

function xp() {
  return state.sessions.reduce(function(n, s) {
    const done = (s.work || []).reduce(function(a, w) {
      return a + (w.sets || []).filter(function(x) { return x.done && !x.skipped; }).length;
    }, 0);
    return n + done * 5 + 10;
  }, 0);
}

function level() {
  return Math.floor(xp() / 40) + 1;
}

function xpInto() {
  return xp() % 40;
}

function todayPlan() {
  const d = new Date().getDay();
  return WEEK.find(function(w) { return w.d === d; });
}

function normalizePet(raw) {
  const d = defaultPet();
  if (!raw || typeof raw !== "object") return d;
  const p = Object.assign({}, d, raw);
  if (!Array.isArray(p.owned)) p.owned = d.owned.slice();
  ["scale_moss", "horn_neon"].forEach(function(id) {
    if (p.owned.indexOf(id) < 0) p.owned.push(id);
  });
  if (!p.equipped || typeof p.equipped !== "object") p.equipped = Object.assign({}, d.equipped);
  if (!p.equipped.scale) p.equipped.scale = "scale_moss";
  if (!p.equipped.horn) p.equipped.horn = "horn_neon";
  if (!Array.isArray(p.equipped.extras)) p.equipped.extras = [];
  p.ember = Math.max(0, Number(p.ember) || 0);
  p.lastSeenLevel = Math.max(1, Number(p.lastSeenLevel) || 1);
  p.celebrateUntil = Number(p.celebrateUntil) || 0;
  p.fullWeekAwarded = typeof p.fullWeekAwarded === "string" ? p.fullWeekAwarded : "";
  return p;
}

function ensurePet() {
  if (!state.pet) state.pet = defaultPet();
  else state.pet = normalizePet(state.pet);
  return state.pet;
}

function petStage() {
  const lv = level();
  for (let i = 0; i < PET_STAGES.length; i++) {
    const s = PET_STAGES[i];
    if (lv >= s.min && lv <= s.max) return s;
  }
  return PET_STAGES[PET_STAGES.length - 1];
}

function maybeFlagCelebration() {
  const pet = ensurePet();
  const lv = level();
  if (lv > pet.lastSeenLevel) {
    pet.celebrateUntil = Date.now() + 2400;
    pet.lastSeenLevel = lv;
    return true;
  }
  pet.lastSeenLevel = Math.max(pet.lastSeenLevel, lv);
  return false;
}

function awardSessionEmbers() {
  const pet = ensurePet();
  let gained = EMBER_PER_SESSION;
  let bonus = 0;
  const ws = weekStart();
  if (liftKeysClearedThisWeek() >= 4 && pet.fullWeekAwarded !== ws) {
    bonus = EMBER_FULL_WEEK_BONUS;
    pet.fullWeekAwarded = ws;
  }
  pet.ember += gained + bonus;
  maybeFlagCelebration();
  return {gained: gained, bonus: bonus, total: pet.ember};
}

  const owned = pet.owned.indexOf(id) >= 0;
  if (!owned) {
    if (pet.ember < it.cost) { toast("Need more embers"); return; }
    pet.ember -= it.cost;
    pet.owned.push(id);
    if (it.slot === "extra") {
      if (pet.equipped.extras.indexOf(id) < 0) pet.equipped.extras.push(id);
    } else {
      pet.equipped[it.slot] = id;
    }
    sfxConfirm();
    buzz(30);
    toast("Unlocked · " + it.name);
  } else if (it.slot === "extra") {
    const idx = pet.equipped.extras.indexOf(id);
    if (idx >= 0) pet.equipped.extras.splice(idx, 1);
    else pet.equipped.extras.push(id);
    sfxTap();
  } else {
    pet.equipped[it.slot] = id;
    sfxTap();
  }
  persist();
  renderPetWidget();
  const panel = document.getElementById("pet-panel");
  if (panel && !panel.hidden) {
    panel.innerHTML = petPanelHtml();
    applyPetPalette(document.getElementById("petHeroArt"));
    bindPetPanel();
  }
}

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function restRemaining() {
  if (!state.live || !state.live.restUntil) return 0;
  return Math.max(0, Math.ceil((state.live.restUntil - Date.now()) / 1000));
}

function restTotal() {
  if (!state.live) return 75;
  const ex = PROGRAMS[state.live.key].items[state.live.i];
  return restSecFor(ex.id);
}

function stopRestTick() {
  if (restTickHandle) { clearInterval(restTickHandle); restTickHandle = null; }
}

function ensureRestTick() {
  stopRestTick();
  if (!state.live || !state.live.restUntil) return;
  if (document.visibilityState !== "visible") return;
  restTickHandle = setInterval(function() {
    if (!state.live || !state.live.restUntil) {
      stopRestTick();
      return;
    }
    const rem = restRemaining();
    if (rem <= 0) {
      state.live.restUntil = 0;
      saveLive();
      stopRestTick();
      blip(1046, 0.13, "triangle", 0.05);
      setTimeout(function() { blip(1568, 0.16, "triangle", 0.05); }, 150);
      buzz([40, 60, 40]);
    }
    if (view === "lift") render();
  }, 250);
}

function startRest() {
  if (!state.live) return;
  const ex = PROGRAMS[state.live.key].items[state.live.i];
  const sec = restSecFor(ex.id);
  state.live.restUntil = Date.now() + sec * 1000;
  saveLive();
  ensureRestTick();
  render();
}

function clearRest() {
  if (state.live) state.live.restUntil = 0;
  stopRestTick();
}

function bump(kind, dir, step) {
  if (!state.live) return;
  const live = state.live;
  const s = live.sets[live.i][live.set];
  const st = step || 1;
  if (kind === "w") {
    s.w = Math.max(5, s.w + dir * 5 * st);
  } else {
    s.r = Math.max(1, Math.min(30, s.r + dir * st));
  }
  sfxTap();
  saveLive();
  // In-place update so long-press isn't destroyed by full re-render
  const box = document.querySelectorAll(".setbox b");
  if (box && box.length >= 2) {
    box[0].textContent = s.w;
    box[1].textContent = s.r;
  } else {
    render();
  }
}

function bindLongPress(btn, kind, dir) {
  let holdTimeout = null;
  let holdInterval = null;
  let armed = false;
  function fire(step) {
    if (step > 1) longPressFired = true;
    bump(kind, dir, step);
  }
  function clearLP() {
    if (holdTimeout) { clearTimeout(holdTimeout); holdTimeout = null; }
    if (holdInterval) { clearInterval(holdInterval); holdInterval = null; }
  }
  btn.addEventListener("pointerdown", function(e) {
    e.preventDefault();
    longPressFired = false;
    armed = true;
    clearLP();
    holdTimeout = setTimeout(function() {
      holdTimeout = null;
      fire(2);
      holdInterval = setInterval(function() { fire(2); }, 220);
    }, 420);
  });
  function end(e) {
    const wasLong = longPressFired;
    const wasArmed = armed;
    armed = false;
    clearLP();
    if (wasArmed && !wasLong && e.type !== "pointercancel") fire(1);
    longPressFired = false;
  }
  btn.addEventListener("pointerup", end);
  btn.addEventListener("pointerleave", function() {
    armed = false;
    clearLP();
    longPressFired = false;
  });
  btn.addEventListener("pointercancel", end);
}

function checkProgression(session) {
  (session.work || []).forEach(function(w) {
    const sets = (w.sets || []).filter(function(x) { return x.done && !x.skipped; });
    if (sets.length < 2) return;
    if (!(sets[0].r >= 15 && sets[1].r >= 15)) return;
    const pin = sets[0].w;
    if (sets[1].w !== pin) return;
    let found = null;
    for (let i = 1; i < state.sessions.length; i++) {
      const s = state.sessions[i];
      if (!s.work) continue;
      for (let j = 0; j < s.work.length; j++) {
        const ww = s.work[j];
        if (ww.id !== w.id) continue;
        const ss = (ww.sets || []).filter(function(x) { return x.done && !x.skipped; });
        if (ss.length >= 2) { found = ss.slice(0, 2); break; }
      }
      if (found) break;
    }
    if (!found) return;
    if (found[0].w !== pin || found[1].w !== pin) return;
    if (!(found[0].r >= 15 && found[1].r >= 15)) return;
    state.readyUp[w.id] = true;
    toast(w.name + " · ready to up one hole");
  });
}

function completeSet() {
  if (tapLock) return;
  tapLock = true;
  setTimeout(function() { tapLock = false; }, 380);
  const live = state.live;
  if (!live) return;
  const ex = PROGRAMS[live.key].items[live.i];
  undoSnapshot = {
    i: live.i,
    set: live.set,
    restUntil: live.restUntil || 0,
    setData: Object.assign({}, live.sets[live.i][live.set]),
    lastW: state.lastWeights[ex.id]
  };
  live.sets[live.i][live.set].done = true;
  live.sets[live.i][live.set].skipped = false;
  state.lastWeights[ex.id] = live.sets[live.i][live.set].w;
  sfxConfirm();
  buzz(30);
  if (undoTimer) clearTimeout(undoTimer);
  undoTimer = setTimeout(function() {
    clearUndo();
  }, 8000);
  if (live.set === 0) {
    live.set = 1;
    startRest();
    showUndoGhost();
  } else {
    clearRest();
    if (live.i < PROGRAMS[live.key].items.length - 1) {
      live.i += 1;
      live.set = 0;
      saveLive();
      render();
      showUndoGhost();
    } else {
      clearUndo();
      finishWorkout("complete");
    }
  }
}

function undoLastSet() {
  if (!undoSnapshot || !state.live) return;
  const live = state.live;
  const snap = undoSnapshot;
  const ex = PROGRAMS[live.key].items[snap.i];
  live.i = snap.i;
  live.set = snap.set;
  live.restUntil = 0;
  live.sets[snap.i][snap.set] = Object.assign({}, snap.setData, {done: false, skipped: false});
  if (snap.lastW == null) delete state.lastWeights[ex.id];
  else state.lastWeights[ex.id] = snap.lastW;
  clearUndo();
  stopRestTick();
  saveLive();
  sfxTap();
  toast("Set undone");
  render();
}

function skipMovement() {
  const live = state.live;
  if (!live) return;
  clearUndo();
  clearRest();
  const sets = live.sets[live.i];
  for (let i = live.set; i < sets.length; i++) {
    if (!sets[i].done) {
      sets[i].done = false;
      sets[i].skipped = true;
    }
  }
  if (live.i < PROGRAMS[live.key].items.length - 1) {
    live.i += 1;
    live.set = 0;
    saveLive();
    render();
  } else {
    finishWorkout("partial");
  }
}

function finishWorkout(reason) {
  clearUndo();
  clearRest();
  const live = state.live;
  if (!live) return;
  const p = PROGRAMS[live.key];
  const session = {
    date: live.date,
    key: live.key,
    name: p.name,
    minutes: Math.max(1, Math.round((Date.now() - live.started) / 60000)),
    reason: reason || "complete",
    work: p.items.map(function(ex, i) {
      return {id: ex.id, name: ex.name, sets: live.sets[i]};
    })
  };
  state.sessions.unshift(session);
  if (state.sessions.length > 60) state.sessions.length = 60;
  if (reason === "complete") checkProgression(session);
  state.live = null;
  state.exitReason = reason || "complete";
  clearLiveStorage();
  const emberAward = awardSessionEmbers();
  if (reason === "complete") sfxDone();
  else sfxWarn();
  buzz(60);
  persist();
  go("done");
  let emberMsg = "+" + emberAward.gained + " embers";
  if (emberAward.bonus) emberMsg += " · +" + emberAward.bonus + " week bonus";
  toast(emberMsg);
}

function weightDeltaHtml() {
  const list = state.bodyweights || [];
  if (!list.length) return "";
  const latest = list[0];
  const latestDt = parseLocalDate(latest.date).getTime();
  let older = null;
  for (let i = 1; i < list.length; i++) {
    const dt = parseLocalDate(list[i].date).getTime();
    const days = (latestDt - dt) / 86400000;
    if (days >= 5 && days <= 10) { older = list[i]; break; }
  }
  if (!older && list.length > 1) older = list[list.length - 1];
  if (!older) return '<div class="delta flat">trend · need ~7d prior</div>';
  const delta = Math.round((latest.lb - older.lb) * 10) / 10;
  const cls = delta > 0 ? "up" : (delta < 0 ? "down" : "flat");
  const sign = delta > 0 ? "+" : "";
  return '<div class="delta ' + cls + '">trend ' + sign + delta + " lb vs ~7d</div>";
}

function render() {
  const app = document.getElementById("app");
  if (!app) return;
  let html = "";
  if (view === "boot") html = screenBoot();
  else if (view === "home") html = screenHome();
  else if (view === "week") html = screenWeek();
  else if (view === "day") html = screenDay();
  else if (view === "lift") html = screenLift();
  else if (view === "done") html = screenDone();
  else if (view === "fuel") html = screenFuel();
  else if (view === "log") html = screenLog();
  else if (view === "session") html = screenSession();
  else html = screenHome();
  app.innerHTML = html;
  if (undoSnapshot && view === "lift") showUndoGhost();
  bind();
  bindPetChrome();
  renderPetWidget();
  if (view === "lift" && restRemaining() > 0) ensureRestTick();
  else if (!(state.live && state.live.restUntil && restRemaining() > 0)) stopRestTick();
}

function $(id) { return document.getElementById(id); }

function bindWalkControls() {
  if ($("walkMinus")) $("walkMinus").onclick = function() {
    walkMinutes = Math.max(5, walkMinutes - 5);
    sfxTap();
    render();
  };
  if ($("walkPlus")) $("walkPlus").onclick = function() {
    walkMinutes = Math.min(180, walkMinutes + 5);
    sfxTap();
    render();
  };
  if ($("walkLog")) $("walkLog").onclick = function() {
    const t = todayISO();
    const existing = (state.walks || []).findIndex(function(w) { return w.date === t; });
    const entry = {date: t, minutes: walkMinutes};
    if (existing >= 0) state.walks[existing] = entry;
    else {
      state.walks.unshift(entry);
      if (state.walks.length > 60) state.walks.length = 60;
    }
    sfxConfirm();
    buzz(25);
    persist();
    toast("Walk logged · " + walkMinutes + " min");
    render();
  };
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(function() { return true; }).catch(function() { return false; });
  }
  return Promise.resolve(false).then(function() {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove();
    return ok;
  });
}

function wipeAll() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  try { sessionStorage.removeItem("pftrack_booted"); } catch (e) {}
  clearLiveStorage();
  clearUndo();
  clearRest();
  state = defaults();
  sfxWarn();
  toast("Data wiped");
  go("home");
}

function bind() {
  document.querySelectorAll("[data-nav]").forEach(function(btn) {
    btn.onclick = function() {
      sfxTap();
      const v = btn.getAttribute("data-nav");
      if (v === "home") go("home");
      else if (v === "week") go("week");
      else if (v === "fuel") go("fuel");
      else if (v === "log") go("log");
    };
  });
  document.querySelectorAll("[data-go]").forEach(function(btn) {
    btn.onclick = function() {
      const g = btn.getAttribute("data-go");
      if (g.indexOf("start:") === 0) {
        startWorkout(g.slice(6));
        return;
      }
      sfxTap();
      go(g);
    };
  });
  document.querySelectorAll("[data-day]").forEach(function(btn) {
    btn.onclick = function() {
      sfxTap();
      openDay = +btn.getAttribute("data-day");
      go("day");
    };
  });
  document.querySelectorAll("[data-sess]").forEach(function(btn) {
    btn.onclick = function() {
      sfxTap();
      openSession = +btn.getAttribute("data-sess");
      go("session");
    };
  });
  document.querySelectorAll("[data-act]").forEach(function(btn) {
    const a = btn.getAttribute("data-act");
    let kind = "r", dir = 1;
    if (a === "w+") { kind = "w"; dir = 1; }
    else if (a === "w-") { kind = "w"; dir = -1; }
    else if (a === "r+") { kind = "r"; dir = 1; }
    else if (a === "r-") { kind = "r"; dir = -1; }
    if (kind === "w") bindLongPress(btn, "w", dir);
    else {
      btn.onclick = function() { bump("r", dir, 1); };
    }
  });
  document.querySelectorAll("[data-food]").forEach(function(el) {
    el.onclick = function() {
      const food = ensureFood();
      const k = el.getAttribute("data-food");
      food[k] = !food[k];
      sfxTap();
      persist();
      render();
    };
  });
  bindWalkControls();
  if ($("did")) $("did").onclick = function() { completeSet(); };
  if ($("skipRest")) $("skipRest").onclick = function() {
    clearRest();
    saveLive();
    sfxTap();
    render();
  };
  if ($("cramp")) $("cramp").onclick = function() {
    showModal({
      title: "Cramp abort",
      body: "Leave the floor now? Session saves as cramp.",
      okLabel: "Abort & leave",
      danger: true,
      onOk: function() { finishWorkout("cramp"); }
    });
  };
  if ($("quit")) $("quit").onclick = function() {
    showModal({
      title: "End & save",
      body: "Save current progress and exit?",
      okLabel: "End & save",
      onOk: function() { finishWorkout("quit"); }
    });
  };
  if ($("skipEx")) $("skipEx").onclick = function() {
    sfxTap();
    skipMovement();
  };
  if ($("bwSave")) $("bwSave").onclick = function() {
    const inp = $("bwInput");
    const v = parseFloat(inp && inp.value);
    if (!v || v < 50 || v > 600) { toast("Enter a valid weight"); return; }
    state.bodyweights.unshift({date: todayISO(), lb: Math.round(v * 10) / 10});
    if (state.bodyweights.length > 90) state.bodyweights.length = 90;
    state.stats.wt = state.bodyweights[0].lb;
    sfxConfirm();
    persist();
    toast("Scale logged · " + state.bodyweights[0].lb + " LB");
    render();
  };
  if ($("soundToggle")) $("soundToggle").onclick = function() {
    state.sound = !state.sound;
    if (state.sound) sfxTap();
    persist();
    render();
  };
  if ($("hapticsToggle")) $("hapticsToggle").onclick = function() {
    state.haptics = !state.haptics;
    if (state.haptics) buzz(20);

  };
  if ($("dumpLog")) $("dumpLog").onclick = function() {
    let raw = "";
    try { raw = localStorage.getItem(STORAGE_KEY) || "{}"; } catch (e) { raw = "{}"; }
    copyText(raw).then(function(ok) {
      if (ok) toast("Dump copied");
      else {
        showModal({
          title: "Dump log",
          body: "Copy this JSON manually.",
          textarea: true,
          placeholder: "",
          okLabel: "Done",
          onOk: function() {}
        });
        setTimeout(function() {
          const ta = document.getElementById("modalTextarea");
          if (ta) { ta.value = raw; ta.select(); }
        }, 60);
      }
    });
  };
  if ($("loadDump")) $("loadDump").onclick = function() {
    showModal({
      title: "Load dump",
      body: "Paste a PF//TRACK JSON dump. This replaces local storage.",
      textarea: true,
      placeholder: '{ "sessions": [] … }',
      okLabel: "Preview…",
      onOk: function(val) {
        let parsed = null;
        try { parsed = JSON.parse(val); } catch (e) { toast("Invalid JSON"); return; }
        if (!parsed || typeof parsed !== "object") { toast("Invalid dump"); return; }
        showModal({
          title: "Replace storage?",
          body: "This overwrites " + STORAGE_KEY + " and reloads state.",
          okLabel: "Replace & reload",
          danger: true,
          onOk: function() {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed)); } catch (e) {}
            clearLiveStorage();
            load();
            toast("Dump loaded · v" + APP_VERSION);
            go("home");
          }
        });
      }
    });
  };
  if ($("wipeData")) $("wipeData").onclick = function() {
    showModal({
      title: "Wipe local data",
      body: "Clears " + STORAGE_KEY + ", live session, and boot flag. Cannot be undone.",
      okLabel: "Wipe everything",
      danger: true,
      onOk: function() {
        showModal({
          title: "Really wipe?",
          body: "Last chance. All sessions, walks, and food history go.",
          okLabel: "Yes, wipe",
          danger: true,
          onOk: function() { wipeAll(); }
        });
      }
    });
  };
  if ($("installHint")) $("installHint").onclick = function() {
    state.installHint = false;
    persist();
    render();
  };
  if ($("openPetFromLog")) $("openPetFromLog").onclick = function() {
    openPetPanel();
  };
}

function tickClock() {
  if (document.visibilityState !== "visible") return;
  const el = document.getElementById("sbClock");
  if (!el || view === "boot") return;
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, "0");
  const mm = String(now.getMinutes()).padStart(2, "0");
  const ss = String(now.getSeconds()).padStart(2, "0");
  const live = state.live ? '<span class="dotlive"></span>LIVE' : "OFFLINE";
  el.innerHTML = live + " · " + hh + ":" + mm + ":" + ss;
}

function startClock() {
  if (clockHandle) clearInterval(clockHandle);
  clockHandle = null;
  if (document.visibilityState !== "visible") return;
  clockHandle = setInterval(tickClock, 1000);
  tickClock();
}

function setupPwaChrome() {
  try {
    const c = document.createElement("canvas");
    c.width = 180; c.height = 180;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#0a0e14";
    ctx.fillRect(0, 0, 180, 180);
    ctx.fillStyle = "#b8ff2e";
    if (ctx.roundRect) {
      ctx.beginPath();
      ctx.roundRect(28, 28, 124, 124, 28);
      ctx.fill();
    } else {
      ctx.fillRect(28, 28, 124, 124);
    }
    ctx.fillStyle = "#0a1408";
    ctx.font = "bold 52px system-ui,sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("PF", 90, 88);
    ctx.font = "bold 18px system-ui,sans-serif";
    ctx.fillText("TRACK", 90, 122);
    const iconUrl = c.toDataURL("image/png");
    let link = document.querySelector('link[rel="apple-touch-icon"]');
    if (!link) {
      link = document.createElement("link");
      link.rel = "apple-touch-icon";
      document.head.appendChild(link);
    }
    link.href = iconUrl;
    let icon = document.querySelector('link[rel="icon"]');
    if (!icon) {
      icon = document.createElement("link");
      icon.rel = "icon";
      document.head.appendChild(icon);
    }
    icon.href = iconUrl;
    const manifest = {
      name: "PF//TRACK",
      short_name: "PF//TRACK",
      display: "standalone",
      orientation: "portrait",
      background_color: "#0a0e14",
      theme_color: "#0a0e14",
      start_url: "./",
      icons: [{src: iconUrl, sizes: "180x180", type: "image/png"}]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type: "application/json"});
    const murl = URL.createObjectURL(blob);
    let ml = document.querySelector('link[rel="manifest"]');
    if (!ml) {
      ml = document.createElement("link");
      ml.rel = "manifest";
      document.head.appendChild(ml);
    }
    ml.href = murl;
  } catch (e) {}
}

function onVisibility() {
  if (document.visibilityState === "visible") {
    startClock();
    if (state && state.live && state.live.restUntil) {
      if (restRemaining() <= 0) {
        state.live.restUntil = 0;
        saveLive();
      }
      ensureRestTick();
      if (view === "lift") render();
    }
  } else {
    if (clockHandle) { clearInterval(clockHandle); clockHandle = null; }
    stopRestTick();
  }
}

function bootSequence() {
  load();
  setupPwaChrome();
  let skip = false;
  try { skip = sessionStorage.getItem("pftrack_booted") === "1"; } catch (e) {}
  if (skip) {
    booted = true;
    view = state.live ? "lift" : "home";
    render();
    startClock();
    return;
  }
  view = "boot";
  render();
  setTimeout(function() {
    try { sessionStorage.setItem("pftrack_booted", "1"); } catch (e) {}
    booted = true;
    view = state.live ? "lift" : "home";
    sfxDone();
    render();
    startClock();
  }, 1600);
}

document.addEventListener("visibilitychange", onVisibility);
bootSequence();

</script>
</body>
</html>
