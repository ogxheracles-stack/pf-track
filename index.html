function bump(kind, dir, step) {
  if (!state.live) return;
  const live = state.live;
  const s = live.sets[live.i][live.set];
  const st = step || 1;
  if (kind === "w") {
    s.w = Math.max(5, s.w + dir * 5 * st);
  } else {
    s.r = Math.max(1, Math.min(30, s.r + dir * st));
  }
  sfxTap();
  saveLive();
  // In-place update so long-press isn't destroyed by full re-render
  const box = document.querySelectorAll(".setbox b");
  if (box && box.length >= 2) {
    box[0].textContent = s.w;
    box[1].textContent = s.r;
  } else {
    render();
  }
}

function bindLongPress(btn, kind, dir) {
  let holdTimeout = null;
  let holdInterval = null;
  let armed = false;
  function fire(step) {
    if (step > 1) longPressFired = true;
    bump(kind, dir, step);
  }
  function clearLP() {
    if (holdTimeout) { clearTimeout(holdTimeout); holdTimeout = null; }
    if (holdInterval) { clearInterval(holdInterval); holdInterval = null; }
  }
  btn.addEventListener("pointerdown", function(e) {
    e.preventDefault();
    longPressFired = false;
    armed = true;
    clearLP();
    holdTimeout = setTimeout(function() {
      holdTimeout = null;
      fire(2);
      holdInterval = setInterval(function() { fire(2); }, 220);
    }, 420);
  });
  function end(e) {
    const wasLong = longPressFired;
    const wasArmed = armed;
    armed = false;
    clearLP();
    if (wasArmed && !wasLong && e.type !== "pointercancel") fire(1);
    longPressFired = false;
  }
  btn.addEventListener("pointerup", end);
  btn.addEventListener("pointerleave", function() {
    armed = false;
    clearLP();
    longPressFired = false;
  });
  btn.addEventListener("pointercancel", end);
}

function checkProgression(session) {
  (session.work || []).forEach(function(w) {
    const sets = (w.sets || []).filter(function(x) { return x.done && !x.skipped; });
    if (sets.length < 2) return;
    if (!(countsAsClean(sets[0]) && countsAsClean(sets[1]))) return;
    const pin = sets[0].w;
    if (sets[1].w !== pin) return;
    let found = null;
    for (let i = 1; i < state.sessions.length; i++) {
      const s = state.sessions[i];
      if (!s.work) continue;
      for (let j = 0; j < s.work.length; j++) {
        const ww = s.work[j];
        if (ww.id !== w.id) continue;
        const ss = (ww.sets || []).filter(function(x) { return x.done && !x.skipped; });
        if (ss.length >= 2) { found = ss.slice(0, 2); break; }
      }
      if (found) break;
    }
    if (!found) return;
    if (found[0].w !== pin || found[1].w !== pin) return;
    if (!(countsAsClean(found[0]) && countsAsClean(found[1]))) return;
    state.readyUp[w.id] = true;
    toast(w.name + " · ready to up one hole");
  });
}

function completeSet() {
  if (tapLock) return;
  tapLock = true;
  setTimeout(function() { tapLock = false; }, 380);
  const live = state.live;
  if (!live) return;
  const ex = PROGRAMS[live.key].items[live.i];
  const readyPending = !!(state.readyUp && state.readyUp[ex.id]);
  undoSnapshot = {
    i: live.i,
    set: live.set,
    restUntil: live.restUntil || 0,
    setData: Object.assign({}, live.sets[live.i][live.set]),
    lastW: state.lastWeights[ex.id],
    readyUpId: readyPending ? ex.id : null,
    combo: live.combo || 0
  };
  live.sets[live.i][live.set].clean = effectiveClean(live.sets[live.i][live.set]);
  live.sets[live.i][live.set].done = true;
  live.combo = (live.combo || 0) + 1;
  live.sets[live.i][live.set].skipped = false;
  state.lastWeights[ex.id] = live.sets[live.i][live.set].w;
  if (readyPending) {
    delete state.readyUp[ex.id];
    toast(ex.name + " · pin +5");
  }
  sfxConfirm();
  buzz(30);
  if (undoTimer) clearTimeout(undoTimer);
  undoTimer = setTimeout(function() {
    clearUndo();
  }, 8000);
  if (live.set === 0) {
    live.set = 1;
    startRest();
    showUndoGhost();
  } else {
    clearRest();
    if (live.i < PROGRAMS[live.key].items.length - 1) {
      live.i += 1;
      live.set = 0;
      advancePastPreSkipped();
      if (live.i >= PROGRAMS[live.key].items.length) {
        clearUndo();
        finishWorkout("complete");
      } else {
        saveLive();
        render();
        showUndoGhost();
      }
    } else {
      clearUndo();
      finishWorkout("complete");
    }
  }
}

function undoLastSet() {
  if (!undoSnapshot || !state.live) return;
  const live = state.live;
  const snap = undoSnapshot;
  const ex = PROGRAMS[live.key].items[snap.i];
  live.i = snap.i;
  live.set = snap.set;
  live.restUntil = 0;
  live.sets[snap.i][snap.set] = Object.assign({}, snap.setData, {done: false, skipped: false});
  if (snap.lastW == null) delete state.lastWeights[ex.id];
  else state.lastWeights[ex.id] = snap.lastW;
  if (snap.readyUpId) state.readyUp[snap.readyUpId] = true;
  live.combo = snap.combo || 0;
  clearUndo();
  stopRestTick();
  saveLive();
  sfxTap();
  toast("Set undone");
  render();
}

function skipMovement() {
  const live = state.live;
  if (!live) return;
  clearUndo();
  clearRest();
  live.combo = 0;
  const sets = live.sets[live.i];
  for (let i = live.set; i < sets.length; i++) {
    if (!sets[i].done) {
      sets[i].done = false;
      sets[i].skipped = true;
    }
  }
  if (live.i < PROGRAMS[live.key].items.length - 1) {
    live.i += 1;
    live.set = 0;
    advancePastPreSkipped();
    if (live.i >= PROGRAMS[live.key].items.length) {
      finishWorkout("partial");
    } else {
      saveLive();
      render();
    }
  } else {
    finishWorkout("partial");
  }
}

function finishWorkout(reason) {
  clearUndo();
  clearRest();
  const live = state.live;
  if (!live) return;
  const p = PROGRAMS[live.key];
  const session = {
    date: live.date,
    key: live.key,
    name: p.name,
    minutes: Math.max(1, Math.round((Date.now() - live.started) / 60000)),
    reason: reason || "complete",
    work: p.items.map(function(ex, i) {
      return {id: ex.id, name: ex.name, sets: live.sets[i]};
    })
  };
  state.sessions.unshift(session);
  if (state.sessions.length > 60) state.sessions.length = 60;
  if (reason === "complete") checkProgression(session);
  state.live = null;
  state.exitReason = reason || "complete";
  clearLiveStorage();
  const doneSets = (session.work || []).reduce(function(a, w) {
    return a + (w.sets || []).filter(function(x) { return x.done && !x.skipped; }).length;
  }, 0);
  let emberAward = {gained: 0, bonus: 0, total: ensurePet().ember, shield: false};
  if (doneSets > 0) {
    emberAward = awardSessionEmbers();
  }
  lastAward = emberAward;
  lastAward.xp = doneSets * 5 + 10;
  if (reason === "complete") sfxDone();
  else sfxWarn();
  buzz(60);
  persist();
  updateAppBadge();
  go("done");
  if (doneSets > 0) {
    let emberMsg = "+" + emberAward.gained + " embers";
    if (emberAward.bonus) emberMsg += " · +" + emberAward.bonus + " week bonus";
    toast(emberMsg);
  }
}

function ensureFood() {
  const t = todayISO();
  let entry = (state.foodHistory || []).find(function(f) { return f.date === t; });
  if (!entry) {
    entry = {date: t, work: false, home: false, after: false, rice: false, items: [], waterOz: 0};
    state.foodHistory.unshift(entry);
  }
  if (!Array.isArray(entry.items)) entry.items = [];
  if (entry.waterOz == null || isNaN(Number(entry.waterOz))) entry.waterOz = 0;
  state.foodHistory = state.foodHistory
    .sort(function(a, b) { return a.date < b.date ? 1 : -1; })
    .slice(0, 120);
  state.food = entry;
  return entry;
}

function foodDotsHtml() {
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    days.push(y + "-" + m + "-" + day);
  }
  return '<div class="foodDots">' + days.map(function(iso) {
    const f = (state.foodHistory || []).find(function(x) { return x.date === iso; });
    if (!f) return "<i></i>";
    const n = (f.work ? 1 : 0) + (f.home ? 1 : 0) + (f.after ? 1 : 0); // rice shame ignored
    if (n >= 2) return '<i class="on"></i>';
    if (n === 1) return '<i class="partial"></i>';
    return "<i></i>";
  }).join("") + "</div>";
}

function weightDeltaHtml() {
  const list = state.bodyweights || [];
  if (!list.length) return "";
  if (list.length < 2) return '<p class="delta flat">One weigh-in so far.</p>';
  const latest = list[0];
  const t0 = parseLocalDate(latest.date).getTime();
  const oldest = list[list.length - 1];
  const oldestDays = (t0 - parseLocalDate(oldest.date).getTime()) / 86400000;
  let row = oldest;
  let phrase = "the oldest log";
  if (oldestDays >= 21) {
    let best = Infinity;
    for (let i = 1; i < list.length; i++) {
      const days = (t0 - parseLocalDate(list[i].date).getTime()) / 86400000;
      const dist = Math.abs(days - 28);
      if (dist < best) { best = dist; row = list[i]; }
    }
    const d = Math.round((t0 - parseLocalDate(row.date).getTime()) / 86400000);
    phrase = (d >= 24 && d <= 34) ? "about 4 weeks ago" : (d + " days ago");
  }
  const delta = Math.round((Number(latest.lb) - Number(row.lb)) * 10) / 10;
  const sign = delta > 0 ? "+" : "";
  return '<p class="delta flat">' + sign + delta + " lb vs " + phrase + ".</p>";
}

function isStandalone() {
  return !!(window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || !!navigator.standalone;

function installHintHtml() {
  if (!state.installHint) return "";

  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const isAndroid = /Android/i.test(ua);
  let copy = "";
  if (isIOS) copy = "Share (□↑) → Add to Home Screen → turn ON \"Open as Web App\" → Add.";
  else if (isAndroid) copy = "Browser menu → Install app / Add to Home screen.";
  else return "";
  return '<p class="sub" id="installHint">' + copy + ' <span class="hintDismiss">Dismiss</span></p>';
}

}

function isPrFood(p) {
  return !!(p && typeof p.id === "string" && p.id.indexOf("pr_") === 0);
}

function normText(s) {
  let t = String(s || "");
  try { t = t.normalize("NFD"); } catch (e) {}
  return t.replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
}

function plateHay(p) {
  if (!p._hay) p._hay = " " + normText([p.name, p.en || "", p.al || "", p.code || ""].join(" ")) + " ";
  return p._hay;
}

function tokenHit(hay, t) {
  if (hay.indexOf(t) >= 0) return true;
  if (t.length > 4 && /es$/.test(t) && hay.indexOf(t.slice(0, -2)) >= 0) return true;
  if (t.length > 3 && /s$/.test(t) && hay.indexOf(t.slice(0, -1)) >= 0) return true;
  return false;
}

function plateById(id) {
  return PLATES.find(function(p) { return p.id === id; }) || null;
}

function plateByQuery(raw) {
  const q = String(raw || "").trim();
  if (!q) return null;
  const up = q.toUpperCase();
  const byCode = PLATES.find(function(p) { return p.code && p.code === up; });
  if (byCode) return byCode;
  const low = normText(q);
  if (!low) return null;
  const byName = PLATES.find(function(p) { const n = normText(p.name); return n === low || n.indexOf(low) === 0; });
  if (byName) return byName;
  const hits = PLATES.filter(function(p) { return plateMatchesQuery(p, q); });
  return hits.length === 1 ? hits[0] : null;
}

function yesterdayISO() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return isoFromDate(d);
}

function rollMacrosIfNewDay() {
  if (!state) return false;
  const m = ensureMacros();
  const t = todayISO();
  if (!m.date) { m.date = t; return false; }
  if (m.date === t) return false;
  const entry = ensureFoodFor(m.date);
  entry.dayMacros = {cal: m.cal, protein: m.protein, carbs: m.carbs, fat: m.fat};
  m.cal = 0;
  m.protein = 0;
  m.carbs = 0;
  m.fat = 0;
  m.date = t;
  persist();
  return true;
}

function reconcileShield() {
  if (!state) return;
  if (!state.shield || typeof state.shield !== "object") state.shield = {held: 0, covered: ""};
  const iso = yesterdayISO();
  if (sessionsForISO(iso).length || walkForDate(iso)) return;
  if (state.shield.covered === iso) return;
  if (!state.shield.held) return;
  state.shield.held = 0;
  state.shield.covered = iso;
  try { persist(); } catch (e) {}
}

function macroRemainSentence() {

  bits.push(pLeft > 0 ? (pLeft + "g protein left") : "Protein met");
  bits.push(cLeft > 0 ? (cLeft + " cal left") : "Calories met");
  return bits.join(" · ");
}

function todayGoal() {
  const plan = todayPlan();
  if (plan && plan.key) {
    const logged = sessionsForISO(todayISO()).some(function(s) { return s.key === plan.key; });
    if (logged) return {pct: 100, title: plan.short, note: "Logged", board: ""};
    if (state.live && state.live.key === plan.key) {
      const prog = PROGRAMS[plan.key];
      const total = prog.items.length * 2;
      let done = 0;
      (state.live.sets || []).forEach(function(sets) {
        (sets || []).forEach(function(s) { if (s.done && !s.skipped) done++; });
      });
      const pct = Math.max(4, Math.min(96, Math.round(done / Math.max(1, total) * 100)));
      return {pct: pct, title: plan.short, note: "In session", board: plan.short + " is on the board."};
    }
    return {pct: 0, title: plan.short, note: "Open", board: plan.short + " is on the board."};
  }
  if (plan && isWorkDay(plan.d)) {
    const w = walkForDate(todayISO());
    const mins = w ? Number(w.minutes) || 0 : 0;
    const pct = Math.max(0, Math.min(100, Math.round(mins / 20 * 100)));
    return {pct: pct, title: "Walk", note: mins ? (mins + " / 20 min") : "Open", board: "Walk is on the board."};
  }
  const food = foodForISO(todayISO());
  const ate = !!(food && (food.home || food.work));
  return {pct: ate ? 100 : 0, title: plan ? plan.short : "Rest", note: ate ? "Plate logged" : "Gym off", board: "Rest day. Plate when you eat."};
}

function addPlate(plate, iso, opts) {
  opts = opts || {};
  if (!plate) return false;
  iso = iso || todayISO();
  if (isFutureISO(iso)) { toast("Future · plan only"); return false; }
  rollMacrosIfNewDay();
  const qty = opts.qty != null ? Math.max(0.5, Math.min(2, Number(opts.qty) || 1)) : 1;
  const cal = Math.round((Number(plate.cal) || 0) * qty);
  const protein = Math.round((Number(plate.protein) || 0) * qty);
  const carbs = Math.round((Number(plate.carbs) || 0) * qty);
  const fat = Math.round((Number(plate.fat) || 0) * qty);
  const entry = ensureFoodFor(iso);
  const row = {
    id: plate.id,
    name: plate.name,
    qty: qty,
    baseCal: Number(plate.cal) || 0,
    baseProtein: Number(plate.protein) || 0,
    baseCarbs: Number(plate.carbs) || 0,
    baseFat: Number(plate.fat) || 0,
    cal: cal,
    protein: protein,
    carbs: carbs,
    fat: fat
  };
  if (iso === todayISO()) row.at = new Date().getHours();
  if (opts.plate) row.plate = opts.plate;
  entry.items.push(row);
  if (!entry.dayMacros) entry.dayMacros = {cal: 0, protein: 0, carbs: 0, fat: 0};
  entry.dayMacros.cal += cal;
  entry.dayMacros.protein += protein;
  entry.dayMacros.carbs += carbs;
  entry.dayMacros.fat += fat;
  if (iso === todayISO()) {
    const m = ensureMacros();
    m.cal += cal;
    m.protein += protein;
    m.carbs += carbs;
    m.fat += fat;
    entry.dayMacros = {cal: m.cal, protein: m.protein, carbs: m.carbs, fat: m.fat};
  }
  const slot = (state.plateSlot === "work" || state.plateSlot === "after") ? state.plateSlot : "home";
  entry[slot] = true;
  state.recentPlates = [plate.id].concat((state.recentPlates || []).filter(function(id) { return id !== plate.id; })).slice(0, 8);
  if (!opts.silent) {
    sfxConfirm();
    toast(plate.name + " · logged");
    armPlateUndo(iso, 1);
  }
  if (!opts.deferPersist) persist();
  return true;
}

function removePlateAt(iso, idx, opts) {
  opts = opts || {};
  if (isFutureISO(iso)) return;
  const entry = ensureFoodFor(iso);
  if (!entry.items || !entry.items[idx]) return;
  const it = entry.items[idx];
  entry.items.splice(idx, 1);
  if (iso === todayISO()) {
    const m = ensureMacros();
    m.cal = Math.max(0, m.cal - (Number(it.cal) || 0));
    m.protein = Math.max(0, m.protein - (Number(it.protein) || 0));
    m.carbs = Math.max(0, m.carbs - (Number(it.carbs) || 0));
    m.fat = Math.max(0, m.fat - (Number(it.fat) || 0));
    entry.dayMacros = {cal: m.cal, protein: m.protein, carbs: m.carbs, fat: m.fat};
  } else if (entry.dayMacros) {
    entry.dayMacros.cal = Math.max(0, (entry.dayMacros.cal || 0) - (Number(it.cal) || 0));
    entry.dayMacros.protein = Math.max(0, (entry.dayMacros.protein || 0) - (Number(it.protein) || 0));
    entry.dayMacros.carbs = Math.max(0, (entry.dayMacros.carbs || 0) - (Number(it.carbs) || 0));
    entry.dayMacros.fat = Math.max(0, (entry.dayMacros.fat || 0) - (Number(it.fat) || 0));
  }
  if (!opts.silent) {
    sfxTap();
    toast("Removed");
  }
  persist();
}

function copyYesterdayPlates() {

  if (!prev || !prev.items || !prev.items.length) { toast("Nothing logged yesterday"); return; }

    const plate = {id: it.id || "custom", name: it.name, cal: Number(it.cal) || 0, protein: Number(it.protein) || 0, carbs: Number(it.carbs) || 0, fat: Number(it.fat) || 0};
    if (addPlate(plate, todayISO(), {silent: true, deferPersist: true})) n++;
  });
  persist();
  sfxConfirm();
  toast(n ? ("Copied " + n + " from yesterday") : "Nothing to copy");
}

function bumpWater(iso, delta) {
  if (isFutureISO(iso)) { toast("Future · plan only"); return; }
  const entry = ensureFoodFor(iso);
  entry.waterOz = Math.max(0, Math.min(200, (Number(entry.waterOz) || 0) + delta));
  sfxTap();
  persist();
}

function dayMacrosFor(iso) {
  if (iso === todayISO()) {
    const m = ensureMacros();
    return {cal: m.cal, protein: m.protein, carbs: m.carbs, fat: m.fat};
  }
  const f = foodForISO(iso);
  if (f && f.dayMacros) return f.dayMacros;
  return {cal: 0, protein: 0, carbs: 0, fat: 0};
}

function weekNutritionHtml() {
  const m = ensureMacros();
  let calSum = 0, proHits = 0, water = 0, locks = 0, withFood = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const iso = isoFromDate(d);
    const dm = dayMacrosFor(iso);
    const f = (iso === todayISO()) ? ensureFood() : foodForISO(iso);
    calSum += Number(dm.cal) || 0;
    if ((Number(dm.protein) || 0) >= m.proteinTarget) proHits++;
    if ((Number(dm.cal) || 0) > 0 || (f && f.items && f.items.length)) withFood++;
    if (f) {
      water += Number(f.waterOz) || 0;
      locks += (f.work ? 1 : 0) + (f.home ? 1 : 0) + (f.after ? 1 : 0);
    }
  }
  const avg = Math.round(calSum / 7);
  let html = '<div class="card mt"><div class="lbl">This week</div>';
  html += '<div class="sumGrid">';

  {k: "pan", label: "Desayuno y panadería"},

const CRIOLLA_ORDER = {
  am: ["pr_cafe", "pr_avena", "pr_pansobao", "pr_mallorca", "pr_quesito", "pr_arroz", "pr_habichuelas", "pr_polloguisado"],
  mid: ["pr_arroz", "pr_habichuelas", "pr_polloguisado", "pr_pernil", "pr_chuleta", "pr_tostones", "pr_amarillos", "pr_carneguisada"],
  late: ["pr_arroz", "pr_habichuelas", "pr_polloguisado", "pr_tostones", "pr_alcapurria", "pr_bacalaito", "pr_empanadilla", "pr_pernil"]
};

function criollaSlot(hour) {
  if (hour >= 4 && hour < 11) return "am";
  if (hour >= 11 && hour < 16) return "mid";
  return "late";
}

function criollaGoTos(hour) {
  const score = {};
  (state.foodHistory || []).slice(0, 30).forEach(function(f) {
    (f.items || []).forEach(function(it) {
      if (!it || typeof it.id !== "string" || it.id.indexOf("pr_") !== 0) return;
      const at = Number(it.at);
      if (it.at == null || isNaN(at)) return;
      let d = Math.abs(at - hour);
      d = Math.min(d, 24 - d);
      if (d <= 2) score[it.id] = (score[it.id] || 0) + (d === 0 ? 2 : 1);
    });
  });
  return Object.keys(score).filter(function(id) { return score[id] >= 2 && plateById(id); })
    .sort(function(a, b) { return score[b] - score[a]; });
}

function criollaNow() {
  const hour = new Date().getHours();
  const out = [];
  criollaGoTos(hour).slice(0, 4).forEach(function(id) { if (out.indexOf(id) < 0) out.push(id); });
  CRIOLLA_ORDER[criollaSlot(hour)].forEach(function(id) { if (out.length < 8 && out.indexOf(id) < 0) out.push(id); });
  return out.map(plateById).filter(Boolean);
}

function weightSparkHtml() {
  const pts = (state.bodyweights || []).slice().reverse();
  if (pts.length < 2) return '<p class="sub" style="margin:8px 0 0">Two weigh-ins draw a trend. No target.</p>';
  const vals = pts.map(function(p) { return Number(p.lb) || 0; });
  const min = Math.min.apply(null, vals);
  const max = Math.max.apply(null, vals);
  const span = Math.max(0.4, max - min);
  const w = 300, h = 56, pad = 8;
  const r = vals.length > 28 ? 2.4 : 3.4;
  let marks = "";
  vals.forEach(function(v, i) {
    const x = pad + (vals.length === 1 ? 0 : (i / (vals.length - 1)) * (w - pad * 2));
    const y = pad + (1 - (v - min) / span) * (h - pad * 2);
    marks += '<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r + '" fill="currentColor"/>';
  });
  return '<svg class="spark" viewBox="0 0 ' + w + " " + h + '" aria-hidden="true">' + marks + "</svg>" +
    '<p class="sub" style="margin:6px 0 0">' + pts.length + " weigh-ins.</p>";
}

function priorLiftLine(id) {

      if (work[j].id !== id) continue;
      const sets = (work[j].sets || []).filter(function(x) { return x.done && !x.skipped; });
      if (!sets.length) continue;
      const reps = sets.map(function(x) { return x.r; }).join("/");
      return "Last time · " + sets[0].w + " lb · " + reps;

  return "";
}

function historyPlateHits(q) {
  const low = normText(q);
  if (low.length < 2) return [];
  const cat = {};
  PLATES.forEach(function(p) {
    if (plateMatchesQuery(p, low)) cat[p.name.toLowerCase()] = 1;
  });
  const seen = {};
  const out = [];
  (state.foodHistory || []).forEach(function(f) {
    (f.items || []).forEach(function(it) {
      const name = String(it.name || "").trim();
      if (!name) return;
      const key = name.toLowerCase();
      if (seen[key] || cat[key]) return;
      if (normText(name).indexOf(low) < 0) return;
      seen[key] = 1;
      const qty = Number(it.qty) || 1;
      out.push({
        id: it.id || "custom",
        name: name,
        cal: it.baseCal != null ? Number(it.baseCal) : Math.round((Number(it.cal) || 0) / qty),
        protein: it.baseProtein != null ? Number(it.baseProtein) : Math.round((Number(it.protein) || 0) / qty),
        carbs: it.baseCarbs != null ? Number(it.baseCarbs) : Math.round((Number(it.carbs) || 0) / qty),
        fat: it.baseFat != null ? Number(it.baseFat) : Math.round((Number(it.fat) || 0) / qty)

    });
  });
  return out.slice(0, 6);
}

function plateFromFreeText(raw) {
  const m = String(raw || "").trim().match(/^(.+?)\s+(\d{2,4})(?:\s+(\d{1,3}))?\s*$/);

  const name = m[1].replace(/[,\s]+$/g, "").trim();
  if (name.length < 2) return null;
  const cal = parseInt(m[2], 10);
  const protein = m[3] ? parseInt(m[3], 10) : 0;
  if (cal < 10 || cal > 2500) return null;
  if (protein < 0 || protein > 250) return null;
  return {id: "custom", name: name, cal: cal, protein: protein, carbs: 0, fat: 0};

function applyMacroDelta(iso, d) {

    entry.dayMacros = {cal: m.cal, protein: m.protein, carbs: m.carbs, fat: m.fat};
  } else {
    if (!entry.dayMacros) entry.dayMacros = {cal: 0, protein: 0, carbs: 0, fat: 0};
    entry.dayMacros.cal = Math.max(0, (Number(entry.dayMacros.cal) || 0) + (d.cal || 0));
    entry.dayMacros.protein = Math.max(0, (Number(entry.dayMacros.protein) || 0) + (d.protein || 0));

function setItemQty(iso, idx, dir) {
  if (isFutureISO(iso)) return;
  const entry = ensureFoodFor(iso);
  const it = entry.items && entry.items[idx];
  if (!it) return;
  ensureItemBase(it);
  const cur = Number(it.qty) || 1;
  const next = Math.max(0.5, Math.min(2, Math.round((cur + dir * 0.5) * 2) / 2));
  if (next === cur) return;
  const prev = {
    cal: Number(it.cal) || 0,
    protein: Number(it.protein) || 0,
    carbs: Number(it.carbs) || 0,
    fat: Number(it.fat) || 0
  };
  it.qty = next;
  it.cal = Math.round(it.baseCal * next);
  it.protein = Math.round(it.baseProtein * next);
  it.carbs = Math.round(it.baseCarbs * next);
  it.fat = Math.round(it.baseFat * next);
  applyMacroDelta(iso, {
    cal: it.cal - prev.cal,
    protein: it.protein - prev.protein,
    carbs: it.carbs - prev.carbs,
    fat: it.fat - prev.fat
  });
  sfxTap();
  persist();
}

function dismissBubbleNote() {
  const n = document.getElementById("bubbleNote");
  if (n) n.remove();
}

function showBubbleNote(btn, text) {
  dismissBubbleNote();
  if (!text) return;
  const note = document.createElement("div");
  note.id = "bubbleNote";
  note.className = "bubbleNote";
  note.setAttribute("role", "tooltip");
  note.textContent = text;
  document.body.appendChild(note);
  const r = btn.getBoundingClientRect();
  const nw = note.offsetWidth;
  const nh = note.offsetHeight;
  let left = r.left + r.width / 2 - nw / 2;
  left = Math.max(12, Math.min(left, window.innerWidth - nw - 12));
  let top = r.top - nh - 12;
  let below = false;
  if (top < 10) {
    top = r.bottom + 12;
    below = true;
  }
  if (below) note.classList.add("below");
  note.style.left = Math.round(left) + "px";
  note.style.top = Math.round(top) + "px";
}

function bindBubblePress(btn) {
  let holdTimer = null;
  let noteShown = false;
  function clearHold() {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
  }
  function onDown(e) {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    noteShown = false;
    longPressFired = false;
    clearHold();
    holdTimer = setTimeout(function() {
      holdTimer = null;
      noteShown = true;
      longPressFired = true;
      showBubbleNote(btn, btn.getAttribute("data-note") || "");
      try { if (state.haptics && navigator.vibrate) navigator.vibrate(10); } catch (err) {}
    }, 450);
  }
  function onUp() {
    clearHold();
  }
  function onCancel() {
    clearHold();
    noteShown = false;
    longPressFired = false;
  }
  btn.addEventListener("pointerdown", onDown);
  btn.addEventListener("pointerup", onUp);
  btn.addEventListener("pointercancel", onCancel);
  btn.addEventListener("pointerleave", function() { clearHold(); });
  btn.addEventListener("contextmenu", function(e) { e.preventDefault(); });
  btn.addEventListener("click", function(e) {
    if (noteShown || longPressFired) {
      e.preventDefault();
      e.stopImmediatePropagation();
      noteShown = false;
      longPressFired = false;
      return;
    }
    dismissBubbleNote();
    const g = btn.getAttribute("data-bubble");
    sfxTap();
    if (g === "pet") { openPetPanel(); return; }
    go(g);
  });
}

function screenCal() {
  ensureCalCursor();
  const title = formatCalTitle(calCursor);
  const today = todayISO();
  const year = calCursor.getFullYear();
  const month = calCursor.getMonth();
  const first = new Date(year, month, 1);
  const firstDow = first.getDay(); // 0=Sun
  // Grid starts Saturday (WEEK_ORDER[0]=6)
  const lead = (firstDow + 1) % 7; // Sat=0
  const start = new Date(year, month, 1 - lead);
  let html = statusbar();
  html += '<div class="lbl">Calendar</div><h1>' + esc(title) + "</h1>";
  html += '<div class="calHead">';
  html += '<button class="btn gho" id="calPrev">Prev</button>';
  html += '<button class="btn pri" id="calToday">Today</button>';
  html += '<button class="btn gho" id="calNext">Next</button>';
  html += "</div>";
  html += '<div class="calDow">';
  WEEK_ORDER.forEach(function(di) {
    const w = WEEK.find(function(x) { return x.d === di; });
    html += "<span>" + esc(w ? w.short : "") + "</span>";
  });
  html += "</div>";
  html += '<div class="calGrid">';
  for (let i = 0; i < 42; i++) {
    const cell = new Date(start);
    cell.setDate(start.getDate() + i);
    const iso = isoFromDate(cell);
    const inMonth = cell.getMonth() === month;
    const marks = dayMarks(iso);
    const cls = ["calCell"];
    if (!inMonth) cls.push("mute");
    if (marks.lift || marks.foodN || marks.walk || marks.note) cls.push("filled");
    if (iso === today) cls.push("today");
    html += '<button type="button" class="' + cls.join(" ") + '" data-cal-iso="' + iso + '">';
    html += '<span class="n">' + cell.getDate() + "</span>";
    html += '<span class="calDots">';
    let dots = 0;
    if (marks.lift && dots < 3) { html += '<i class="lift"></i>'; dots++; }
    if (marks.foodN > 0 && dots < 3) { html += '<i class="food"></i>'; dots++; }
    if (marks.walk && dots < 3) { html += '<i class="walk"></i>'; dots++; }
    html += "</span></button>";
  }
  html += "</div>";
  html += '<p class="sub mt onArt">Tap a day to edit lifts, food, walk.</p>';
  html += '<div class="stack"><button class="btn pri" data-go="backfill">Backfill notes</button></div>';
  html += nav("recovery");
  return html;
}

  html += '<div class="toggle shame ' + (food.rice ? "on" : "") + '" data-food="rice" data-food-iso="' + iso + '"' + (future ? ' style="opacity:.45;pointer-events:none"' : "") + ">";
  html += "<div><b>Second rice mountain</b><span>Shame toggle only — not a lock</span></div>";
  html += '<div class="sw"></div></div></div>';

  // C. Walk (work days only)
  if (plan && isWorkDay(plan.d)) {
    const mins = walkMinutes;
    html += '<div class="card mt"><h2>Walk</h2>';
    if (future) {
      html += '<p class="sub" style="margin:0">Walk log unlocks on this day.</p>';
    } else {

      html += '<div class="stack" style="margin-top:12px"><button class="btn pri" id="walkLog" data-walk-iso="' + iso + '">' + (walk ? "Update walk" : "Log walk") + "</button></div>";
      if (walk) html += '<div class="lbl" style="margin-top:10px;color:var(--amber)">Walk marked · ' + walk.minutes + " min" + (walk.feetCooked ? " · feet cooked" : "") + "</div>";
    }
    html += "</div>";
  }

  // D. Scale
  html += '<div class="card mt"><h2>Scale</h2>';
  html += '<div class="stat" style="font-size:28px;margin:6px 0">' + (bw ? bw.lb + "<small> LB</small>" : "—") + "</div>";
  if (bw) html += '<div class="lbl">' + bw.date + "</div>";
  if (!future) {
    html += '<div class="stack" style="margin-top:10px"><input type="number" id="bwInput" placeholder="Weight (lb)" min="100" max="500" step="0.1"/>';
    html += '<button class="btn pri" id="bwSave" data-bw-iso="' + iso + '">Save scale</button></div>';
    if (hasHealthBridge()) {
      html += '<div class="toggle ' + (state.healthWriteWeight ? "on" : "") + '" id="healthWriteWeightToggle" style="margin-top:12px"><div><b>Write weight to Apple Health</b><span>On-device when you save</span></div><div class="sw"></div></div>';
    }
  }
  html += "</div>";

  // E. Day note
  html += '<div class="card mt"><h2>Day note</h2>';
  html += '<textarea id="calDayNote" placeholder="What mattered today — pins, feet, plate, mood." style="min-height:110px">' + esc(note) + "</textarea>";
  html += '<div class="stack"><button class="btn pri" id="calNoteSave">Save note</button></div></div>';

  // Doctrine (bottom)
  html += '<div class="card mt"><div class="lbl">Doctrine</div><p class="sub" style="margin:0">' + esc(plan ? plan.note : "") + "</p></div>";

  html += nav("recovery");
  return html;
}

let lastScreenView = null;
let screenInTimer = 0;
function render() {
  const app = document.getElementById("app");
  if (!app) return;
  try { rollMacrosIfNewDay(); } catch (e) {}
  applyEnvironment();
  let html = "";
  if (view === "boot") html = screenBoot();
  else if (view === "home") html = screenHome();
  else if (view === "week") html = screenWeek();
  else if (view === "day") html = screenDay();
  else if (view === "cal") html = screenCal();
  else if (view === "calday") html = screenCalDay();
  else if (view === "lift") html = screenLift();
  else if (view === "done") html = screenDone();
  else if (view === "fuel") html = screenFuel();
  else if (view === "link") html = screenLink();
  else if (view === "log") html = screenLog();
  else if (view === "session") html = screenSession();
  else if (view === "recovery") html = screenRecovery();
  else if (view === "sleep") html = screenSleep();
  else if (view === "shop") html = screenShop();
  else if (view === "more") html = screenMore();
  else if (view === "backfill") html = screenBackfill();
  else html = screenHome();
  app.innerHTML = html;
  if (view !== lastScreenView) {
    app.classList.remove("screenIn");
    if (lastScreenView !== null) {
      void app.offsetWidth; app.classList.add("screenIn");
      clearTimeout(screenInTimer);
      screenInTimer = setTimeout(function() { app.classList.remove("screenIn"); }, 320);
    }
    lastScreenView = view;
  } else {
    clearTimeout(screenInTimer);
    app.classList.remove("screenIn");
  }
  if (undoSnapshot && view === "lift") showUndoGhost();
  if (plateUndo) showPlateUndo();
  bind();
  bindPetChrome();
  renderPetWidget();
  if (view === "lift" && restRemaining() > 0) ensureRestTick();
  else if (!(state.live && state.live.restUntil && restRemaining() > 0)) stopRestTick();
  syncWakeLock();
  applyReactiveClass();
  if (hasHealthBridge() && (view === "recovery" || view === "more") && state.healthConnected) {
    var before = healthSummaryAt || 0;
    refreshHealthSummary(false).then(function(r) {
      if (!r || !healthSummaryCache) return;
      if ((healthSummaryAt || 0) === before) return; /* cache hit — skip */
      if (view === "recovery" || view === "more") render();
    }).catch(function() {});
  }
}

function bindWalkControls() {
  if ($("walkMinus")) $("walkMinus").onclick = function() {
    walkMinutes = Math.max(5, walkMinutes - 5);
    sfxTap();
    render();
  };
  if ($("walkPlus")) $("walkPlus").onclick = function() {
    walkMinutes = Math.min(180, walkMinutes + 5);
    sfxTap();
    render();
  };
  if ($("feetCookedToggle")) $("feetCookedToggle").onclick = function() {
    const iso = $("feetCookedToggle").getAttribute("data-walk-iso") || todayISO();
    const w = walkForDate(iso);
    const currentlyOn = !!(w && w.feetCooked) || (isoInCurrentWeek(iso) && isFeetCooked());
    const on = !currentlyOn;
    if (isoInCurrentWeek(iso)) setFeetCooked(on);
    if (w) w.feetCooked = on;
    else if (on) {
      // mark intent on a stub walk only if one exists; otherwise wait for log
    }
    sfxTap();
    persist();
    render();
  };
  if ($("walkLog")) $("walkLog").onclick = function() {
    const t = $("walkLog").getAttribute("data-walk-iso") || todayISO();
    if (isFutureISO(t)) { toast("Future · plan only"); return; }
    const existing = (state.walks || []).findIndex(function(w) { return w.date === t; });
    let cooked = false;
    if ($("feetCookedToggle") && $("feetCookedToggle").classList.contains("on")) cooked = true;
    else if (existing >= 0 && state.walks[existing].feetCooked) cooked = true;
    else if (isoInCurrentWeek(t) && isFeetCooked()) cooked = true;
    const entry = {date: t, minutes: walkMinutes, feetCooked: !!cooked};
    if (cooked && isoInCurrentWeek(t)) setFeetCooked(true);
    if (existing >= 0) state.walks[existing] = entry;
    else {
      state.walks.unshift(entry);
      if (state.walks.length > 120) state.walks.length = 120;
    }
    sfxConfirm();
    buzz(25);
    persist();
    toast("Walk logged · " + walkMinutes + " min" + (cooked ? " · feet cooked" : ""));
    render();
  };
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(function() { return true; }).catch(function() { return false; });
  }
  return Promise.resolve(false).then(function() {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove();
    return ok;
  });
}

function importBackup() {

    body: "Paste a PF//TRACK JSON backup. This replaces local storage.",
    textarea: true,
    placeholder: '{ "sessions": [] … }',
    okLabel: "Preview…",
    onOk: function(val) {
      let parsed = null;
      try { parsed = JSON.parse(val); } catch (e) { toast("Invalid JSON"); return; }

      showModal({
        title: "Replace storage?",

        okLabel: "Replace & reload",

          go("home");
        }
      });
    }
  });

function tickClock() {
  if (document.visibilityState !== "visible") return;
  const el = document.getElementById("sbClock");
  if (!el || view === "boot") return;
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, "0");
  const mm = String(now.getMinutes()).padStart(2, "0");
  const ss = String(now.getSeconds()).padStart(2, "0");
  const live = state.live ? '<span class="dotlive"></span>LIVE' : "OFFLINE";
  el.innerHTML = live + " · " + hh + ":" + mm + ":" + ss;
  const elap = document.getElementById("elapsedMin");
  if (elap && state.live && state.live.started && view === "lift") {
    elap.textContent = Math.max(0, Math.round((Date.now() - state.live.started) / 60000)) + " min in";
  }
  // Re-apply env when auto crosses day/night boundary
  try {
    const want = resolveEnvironment();
    const have = document.documentElement.getAttribute("data-env");
    if (want !== have) applyEnvironment();
    else applyReactiveClass();
  } catch (e) {}
}

function startClock() {
  if (clockHandle) clearInterval(clockHandle);
  clockHandle = null;
  if (document.visibilityState !== "visible") return;
  clockHandle = setInterval(tickClock, 1000);
  tickClock();
}

function makeNeonIcon(size) {
  const c = document.createElement("canvas");
  c.width = size; c.height = size;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#04060a";
  ctx.fillRect(0, 0, size, size);
  const pad = Math.round(size * 0.155);
  const box = size - pad * 2;
  const rad = Math.round(size * 0.155);
  ctx.fillStyle = "#b8ff2e";
  if (ctx.roundRect) {
    ctx.beginPath();
    ctx.roundRect(pad, pad, box, box, rad);
    ctx.fill();
  } else {
    ctx.fillRect(pad, pad, box, box);
  }
  ctx.fillStyle = "#0a1408";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "bold " + Math.round(size * 0.29) + "px system-ui,sans-serif";
  ctx.fillText("PF", size / 2, size * 0.49);
  ctx.font = "bold " + Math.round(size * 0.1) + "px system-ui,sans-serif";
  ctx.fillText("TRACK", size / 2, size * 0.68);
  return c.toDataURL("image/png");
}

function setupPwaChrome() {
  try {
    const icon180 = makeNeonIcon(180);
    const icon192 = makeNeonIcon(192);
    let link = document.querySelector('link[rel="apple-touch-icon"]');
    if (!link) {
      link = document.createElement("link");
      link.rel = "apple-touch-icon";
      document.head.appendChild(link);
    }
    link.href = icon180;
    let icon = document.querySelector('link[rel="icon"]');
    if (!icon) {
      icon = document.createElement("link");
      icon.rel = "icon";
      document.head.appendChild(icon);
    }
    icon.href = icon180;
    const startUrl = (location.href || "./").split("#")[0] || "./";
    const manifest = {
      name: "PF//TRACK",
      short_name: "PF//TRACK",
      display: "standalone",
      orientation: "portrait",
      background_color: "#04060a",
      theme_color: "#04060a",
      start_url: startUrl,
      icons: [
        {src: icon180, sizes: "180x180", type: "image/png"},
        {src: icon192, sizes: "192x192", type: "image/png"}
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type: "application/json"});
    const murl = URL.createObjectURL(blob);
    let ml = document.querySelector('link[rel="manifest"]');
    if (!ml) {
      ml = document.createElement("link");
      ml.rel = "manifest";
      document.head.appendChild(ml);
    }
    ml.href = murl;
  } catch (e) {}
}

function isHttps() {
  return location.protocol === "https:";
}

async function requestWakeLock() {
  if (!isHttps()) return;
  if (!navigator.wakeLock || !navigator.wakeLock.request) return;
  if (document.visibilityState !== "visible") return;
  if (!(view === "lift" && state && state.live)) return;
  try {
    if (wakeLockSentinel) {
      try { await wakeLockSentinel.release(); } catch (e) {}
      wakeLockSentinel = null;
    }
    wakeLockSentinel = await navigator.wakeLock.request("screen");
    wakeLockSentinel.addEventListener("release", function() {
      wakeLockSentinel = null;
    });
  } catch (e) {}
}

async function releaseWakeLock() {
  try {
    if (wakeLockSentinel) {
      await wakeLockSentinel.release();
      wakeLockSentinel = null;
    }
  } catch (e) {
    wakeLockSentinel = null;
  }
}

function syncWakeLock() {
  if (view === "lift" && state && state.live && document.visibilityState === "visible") {
    requestWakeLock();
  } else {
    releaseWakeLock();
  }
}

function updateAppBadge() {
  if (!isHttps()) return;
  if (!navigator.setAppBadge && !navigator.clearAppBadge) return;
  try {
    const plan = todayPlan();
    const liftDay = !!(plan && plan.key);
    let logged = false;
    if (liftDay) {
      logged = sessionsThisWeek().some(function(s) { return s.key === plan.key; }) ||
        state.sessions.some(function(s) { return s.date === todayISO() && s.key === plan.key; });
    }
    if (liftDay && !logged) {
      if (navigator.setAppBadge) navigator.setAppBadge(1).catch(function(){});
    } else if (navigator.clearAppBadge) {
      navigator.clearAppBadge().catch(function(){});
    }
  } catch (e) {}
}

function askPersistOnce() {
  if (persistAsked) return;
  persistAsked = true;
  if (!isHttps()) return;
  try {
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(function(){});
    }
  } catch (e) {}
}

function registerOfflineSW() {
  if (!isHttps()) return;
  if (!("serviceWorker" in navigator)) return;
  try {
    const pageUrl = (location.href || "./").split("#")[0];
    const swCode = [
      "const PAGE = " + JSON.stringify(pageUrl) + ";",
      "const CACHE = 'pftrack-v45';",
      "self.addEventListener('install', function(e) {",
      "  e.waitUntil(caches.open(CACHE).then(function(c) { return c.addAll([PAGE, './']).catch(function(){}); }).then(function(){ return self.skipWaiting(); }));",
      "});",
      "self.addEventListener('activate', function(e) { e.waitUntil(self.clients.claim()); });",
      "self.addEventListener('fetch', function(e) {",
      "  if (e.request.method !== 'GET') return;",
      "  e.respondWith(caches.match(e.request).then(function(hit) {",
      "    return hit || fetch(e.request).then(function(res) {",
      "      try { var copy = res.clone(); caches.open(CACHE).then(function(c){ c.put(e.request, copy); }); } catch (err) {}",
      "      return res;",
      "    }).catch(function(){ return hit || Response.error(); });",
      "  }));",
      "});"
    ].join("\n");
    const blob = new Blob([swCode], {type: "text/javascript"});
    const url = URL.createObjectURL(blob);
    navigator.serviceWorker.register(url, {scope: "./"}).catch(function(){});
  } catch (e) {}
}

function setupVisualViewportPad() {
  if (!window.visualViewport) return;
  const apply = function() {
    const app = document.getElementById("app");
    if (!app) return;
    const need = (view === "link" || view === "fuel" || view === "backfill");
    const vv = window.visualViewport;
    const keyboardOpen = need && vv && (window.innerHeight - vv.height > 80);
    if (keyboardOpen) {
      const pad = Math.max(0, Math.round(window.innerHeight - vv.height - (vv.offsetTop || 0))) + 24;
      app.style.paddingBottom = pad + "px";
      vvPadActive = true;
      try {
        const focus = document.activeElement;
        if (focus && (focus.tagName === "TEXTAREA" || focus.tagName === "INPUT")) {
          focus.scrollIntoView({block: "center", behavior: "smooth"});
        }
      } catch (e) {}
    } else if (vvPadActive) {
      app.style.paddingBottom = "";
      vvPadActive = false;
    }
  };
  window.visualViewport.addEventListener("resize", apply);
  window.visualViewport.addEventListener("scroll", apply);
  window.addEventListener("focusin", apply);
  window.addEventListener("focusout", function() { setTimeout(apply, 80); });
}

function unlockAudioOnce() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  try { audio(); } catch (e) {}
  askPersistOnce();
}

function onVisibility() {
  if (document.visibilityState === "visible") {
    startClock();
    if (state && state.live && state.live.restUntil) {
      if (restRemaining() <= 0) {
        state.live.restUntil = 0;
        saveLive();
      }
      ensureRestTick();
      if (view === "lift") render();
    }
    syncWakeLock();
  } else {
    if (clockHandle) { clearInterval(clockHandle); clockHandle = null; }
    stopRestTick();
    releaseWakeLock();
  }
}

function bootSequence() {
  load();
  ensureCosmetics();
  applyEnvironment();
  watchBattery();
  setupPwaChrome();
  setupVisualViewportPad();
  registerOfflineSW();
  updateAppBadge();
  let skip = false;
  try { skip = sessionStorage.getItem("pftrack_booted") === "1"; } catch (e) {}
  if (skip) {
    booted = true;
    view = state.live ? "lift" : "home";
    render();
    startClock();
    syncWakeLock();
    return;
  }
  view = "boot";
  render();
  setTimeout(function() {
    try { sessionStorage.setItem("pftrack_booted", "1"); } catch (e) {}
    booted = true;
    view = state.live ? "lift" : "home";
    sfxDone();
    render();
    startClock();
    syncWakeLock();
  }, 1600);
}

document.addEventListener("pointerdown", unlockAudioOnce, {once: true, passive: true});
document.addEventListener("visibilitychange", onVisibility);
bootSequence();
