<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="PF//TRACK"/>
<meta name="theme-color" content="#0a0e14"/>
<title>PF//TRACK · Marathon</title>
<style>
:root{
  --bg:#0a0e14;
  --panel:#141b24;
  --panel2:#1a2330;
  --line:#2a3544;
  --line2:#3a4758;
  --text:#e8eef4;
  --dim:#8b9aab;
  --muted:#6b7a8c;
  --neon:#b8ff2e;
  --neon-dim:rgba(184,255,46,.18);
  --cyan:#5ec8d8;
  --hot:#ff6b8a;
  --amber:#ffb020;
  --ok:#3dff9e;
  --ok-bg:rgba(61,255,158,.12);
  --radius:14px;
  --radius-sm:12px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --tap:52px;
  --gap:13px;
  --card-pad:19px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;-webkit-text-size-adjust:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  font-size:16px;
  line-height:1.45;
  overflow-x:hidden;
  background-image:
    radial-gradient(100% 55% at 50% -8%,rgba(94,200,216,.08),transparent 55%),
    radial-gradient(80% 45% at 50% 105%,rgba(184,255,46,.04),transparent 55%);
  background-attachment:fixed;
}
#app{
  max-width:430px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  padding:0 16px calc(72px + env(safe-area-inset-bottom,0px));
}
.sb{
  position:sticky;top:0;z-index:40;margin:0 -16px 16px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 12px;
  display:flex;justify-content:space-between;align-items:center;
  font-size:12px;font-weight:600;color:var(--dim);
  background:linear-gradient(180deg,rgba(10,14,20,.98) 70%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.sb b{color:var(--neon);font-weight:700;letter-spacing:0.02em}
.dotlive{
  display:inline-block;width:8px;height:8px;border-radius:50%;
  background:var(--neon);margin-right:8px;vertical-align:middle;
  box-shadow:0 0 6px rgba(184,255,46,.45);opacity:.9;
}
.lbl{
  font-size:12px;font-weight:600;color:var(--dim);
  letter-spacing:0.04em;margin:0;
}
h1{
  font-size:27px;line-height:1.2;margin:8px 0 10px;font-weight:700;
  color:var(--text);letter-spacing:-0.01em;
}
h2{
  font-size:15px;font-weight:700;color:var(--text);margin:0 0 12px;
  letter-spacing:0;
}
.sub{
  color:var(--dim);margin:0 0 16px;font-size:15px;line-height:1.5;
}
.stat{
  font-family:var(--mono);font-size:36px;font-weight:700;
  font-variant-numeric:tabular-nums;line-height:1.1;color:var(--text);
}
.stat small{font-size:15px;color:var(--dim);font-weight:600}
.card{
  position:relative;padding:var(--card-pad);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  margin-top:var(--gap);
}
.card:first-of-type{margin-top:0}
.cue{
  background:rgba(255,176,32,.08);
  border-color:rgba(255,176,32,.35);
  color:#f0c27a;
  font-size:15px;line-height:1.5;
}
.cue b{color:#ffd080;font-weight:700}
.btn{
  display:flex;align-items:center;justify-content:center;
  width:100%;min-height:48px;padding:14px 18px;
  background:var(--panel2);border:1px solid var(--line2);
  border-radius:var(--radius-sm);
  color:var(--text);font:600 15px/1.25 var(--font);
  cursor:pointer;text-align:center;
}
.btn:active{transform:scale(.98);filter:brightness(1.08)}
.btn.pri{
  min-height:56px;font-size:17px;font-weight:700;
  background:linear-gradient(180deg,#d4ff6a,#a8e820);
  color:#0a1408;border-color:#e0ff9a;
  box-shadow:0 4px 20px rgba(184,255,46,.25);
}
.btn.ok{
  min-height:56px;font-size:17px;font-weight:700;
  background:linear-gradient(180deg,#4dffaa,#1ec878);
  color:#03180e;border-color:#8affc8;
}
.btn.dan{
  min-height:48px;
  background:rgba(255,47,110,.1);color:#ff8aab;border-color:rgba(255,47,110,.35);
}
.btn.gho{
  background:transparent;color:var(--dim);border-color:var(--line);
  min-height:48px;
}
.btn.big{min-height:56px;font-size:17px}
.stack{display:grid;gap:10px;margin-top:16px}
.bar{
  height:10px;background:#0c1218;border:1px solid var(--line);
  border-radius:6px;margin:12px 0 10px;position:relative;overflow:hidden;
}
.bar>i{
  display:block;height:100%;border-radius:5px;
  background:linear-gradient(90deg,var(--cyan),var(--neon));
}
.dots{display:flex;gap:8px;margin:14px 0 8px}
.dot{
  flex:1;height:12px;background:#0c1218;border:1px solid var(--line);
  border-radius:6px;
}
.dot.on{background:var(--neon);border-color:var(--neon)}
.pill{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:28px;padding:4px 10px;font-size:12px;font-weight:600;
  background:var(--panel2);border:1px solid var(--line2);
  border-radius:999px;color:var(--dim);white-space:nowrap;
}
.pill.on{background:var(--ok-bg);border-color:#2a7a52;color:var(--ok)}
.pill.hot{background:rgba(255,176,32,.12);border-color:#5a4018;color:var(--amber)}
.pill.today{background:var(--neon-dim);border-color:#6f9a12;color:var(--neon)}
.row{
  display:flex;justify-content:space-between;gap:12px;
  padding:14px 0;border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:0}
.row b{font-size:15px;font-weight:600;letter-spacing:0}
.row .n{font-size:13px;color:var(--dim);margin-top:4px;line-height:1.4}
.row .r{text-align:right;flex-shrink:0}
.daybtn{
  display:flex;justify-content:space-between;align-items:center;width:100%;
  min-height:64px;padding:14px 16px;margin-bottom:10px;text-align:left;
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-sm);
  color:var(--text);font-family:var(--font);cursor:pointer;gap:12px;
}
.daybtn:active{filter:brightness(1.06)}
.daybtn.is-today{
  border-color:rgba(184,255,46,.55);
  box-shadow:inset 4px 0 0 var(--neon);
  background:rgba(184,255,46,.06);
}
.daybtn .l b{display:block;font-size:16px;font-weight:700}
.daybtn .l span{display:block;font-size:13px;color:var(--dim);margin-top:4px;line-height:1.35}
.setbox{display:flex;gap:12px;margin-top:14px}
.setbox>div{
  flex:1;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:14px 10px;text-align:center;
}
.step{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.step b{
  font-family:var(--mono);font-size:28px;font-weight:700;
  min-width:48px;font-variant-numeric:tabular-nums;
}
.mini{
  width:var(--tap);height:var(--tap);min-width:var(--tap);min-height:var(--tap);
  border-radius:12px;background:var(--panel2);border:1px solid var(--line2);
  color:var(--text);font:700 24px/1 var(--font);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
}
.mini:active{background:var(--neon);color:#0a1408;border-color:var(--neon)}
.ringwrap{position:relative;width:200px;height:200px;margin:12px auto}
.ring{width:200px;height:200px}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:#1a2430}
.ring .fg{
  stroke:var(--neon);transform:rotate(-90deg);transform-origin:50% 50%;
  transition:stroke-dashoffset .4s linear;
}
.ringwrap .num{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--mono);font-size:58px;font-weight:700;
  font-variant-numeric:tabular-nums;
}
.check{
  width:88px;height:88px;margin:20px auto;display:grid;place-items:center;
  font-size:40px;color:var(--neon);
  border:2px solid var(--neon);border-radius:20px;
  background:var(--neon-dim);
}
input[type=number]{
  width:100%;min-height:var(--tap);background:#0c1218;
  border:1px solid var(--line2);border-radius:var(--radius-sm);
  color:var(--text);padding:14px 16px;
  font:600 18px/1.2 var(--font);outline:none;
}
input:focus{border-color:var(--neon)}
.toggle{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  min-height:64px;padding:14px 16px;margin-top:10px;
  background:var(--panel2);border:1px solid var(--line);
  border-radius:var(--radius-sm);cursor:pointer;
}
.toggle:first-child{margin-top:0}
.toggle .sw{
  width:52px;height:32px;border-radius:16px;background:#1a2530;
  border:1px solid var(--line2);position:relative;flex-shrink:0;
}
.toggle .sw::after{
  content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;
  border-radius:50%;background:var(--muted);transition:left .15s ease,background .15s ease;
}
.toggle.on .sw{background:var(--neon-dim);border-color:var(--neon)}
.toggle.on .sw::after{left:23px;background:var(--neon)}
.toggle b{font-size:16px;font-weight:600;display:block}
.toggle span{display:block;font-size:13px;color:var(--dim);margin-top:3px;line-height:1.35}
nav.hud{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);
  width:100%;max-width:430px;z-index:45;
  display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(10,14,20,.96);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);
  padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px));
  gap:4px;
}
nav.hud button{
  background:0;border:0;color:var(--dim);
  font:600 11px/1.2 var(--font);
  min-height:56px;padding:8px 4px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;cursor:pointer;border-radius:10px;
}
nav.hud button .ico{font-size:18px;opacity:.8;line-height:1}
nav.hud button.on{color:var(--neon);background:var(--neon-dim)}
nav.hud button.on .ico{opacity:1}
.toast{
  position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);z-index:55;
  background:rgba(12,28,20,.97);border:1px solid #2c6b46;
  border-radius:12px;color:var(--ok);
  padding:14px 18px;font-size:14px;font-weight:600;
  max-width:min(390px,92vw);text-align:center;
}
.boot{padding-top:calc(48px + env(safe-area-inset-top,0px))}
.bootline{
  font-size:14px;color:var(--ok);margin:0 0 10px;opacity:0;
  animation:bootin .4s ease forwards;
}
.bootline.dim{color:var(--dim)}
@keyframes bootin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.boottitle{
  font-size:28px;font-weight:700;margin:0 0 6px;color:var(--neon);
  letter-spacing:0.02em;
}
@keyframes bootfill{from{width:0}to{width:100%}}
.center{text-align:center}
.mt{margin-top:16px}
.mb{margin-bottom:16px}
.xpdots{display:flex;gap:8px;margin:12px 0}
.xpdots i{
  flex:1;height:10px;background:#0c1218;border:1px solid var(--line);
  border-radius:5px;
}
.xpdots i.on{background:var(--cyan);border-color:var(--cyan)}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:0.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:0.01ms !important;
  }
  .ring .fg{transition:none}
  .bootline{opacity:1;animation:none}
  .bar>i[style*="bootfill"]{width:100% !important;animation:none !important}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const STORAGE_KEY = "pftrack_v3";
const REST = 75;
const CIRC = 2 * Math.PI * 52;

const PROGRAMS = {
  "upper-a": {
    name: "Upper A — V + Delts",
    why: "Width day. Press + laterals + pulldown build the triangle.",
    items: [
      {id:"press", name:"Shoulder Press", cue:"Don't shrug. Ribs down.", sets:"2×10–15"},
      {id:"lat", name:"Lat Pulldown", cue:"To upper chest. No yank.", sets:"2×10–15"},
      {id:"row", name:"Seated Row", cue:"Squeeze blades. Torso still.", sets:"2×10–15"},
      {id:"raise", name:"Lateral Raise", cue:"Elbows lead. Never skip.", sets:"2×10–15"},
      {id:"rear", name:"Rear Fly / Face Pull", cue:"Pick ONE. Not both.", sets:"2×10–15"},
      {id:"tri", name:"Tricep Pushdown", cue:"Elbows pinned to ribs.", sets:"2×10–15"}
    ]
  },
  "lower-a": {
    name: "Lower A — Quad / Glute",
    why: "Matching legs. Seated machines. No kickbacks.",
    items: [
      {id:"lpress", name:"Leg Press (high/wide)", cue:"Don't lock knees.", sets:"2×10–15"},
      {id:"abd", name:"Hip Abductor", cue:"Seated. Knees out.", sets:"2×10–15"},
      {id:"ext", name:"Leg Extension", cue:"Light. Control it.", sets:"2×10–15"},
      {id:"curl", name:"Seated Leg Curl", cue:"STOP at first cramp.", sets:"2×10–15"},
      {id:"calf", name:"Calf Raise", cue:"Skip if feet cooked.", sets:"2×10–15"}
    ]
  },
  "upper-b": {
    name: "Upper B — Delts + Bis",
    why: "Second hit on shoulders. Curls live here.",
    items: [
      {id:"press", name:"Shoulder Press", cue:"Same pin as Saturday.", sets:"2×10–15"},
      {id:"lat", name:"Lat Pulldown", cue:"To upper chest.", sets:"2×10–15"},
      {id:"row", name:"Seated Row", cue:"Squeeze blades.", sets:"2×10–15"},
      {id:"raise", name:"Lateral Raise", cue:"Do not skip.", sets:"2×10–15"},
      {id:"curlbi", name:"Bicep Curl", cue:"Machine / cable / DB.", sets:"2×10–15"},
      {id:"chest", name:"Chest Press", cue:"Keeps the front honest.", sets:"2×10–15"}
    ]
  },
  "lower-b": {
    name: "Lower B — Light Posterior",
    why: "Glutes/hams without wrecking Thu–Fri work.",
    items: [
      {id:"abd", name:"Hip Abductor", cue:"Seated only.", sets:"2×10–15"},
      {id:"lpress", name:"Leg Press High/Wide", cue:"Lighter than Sunday.", sets:"2×10–15"},
      {id:"curl", name:"Seated Leg Curl", cue:"Skip if hamstring weird.", sets:"2×10–15"},
      {id:"calf", name:"Calf Raise", cue:"Skip if work wrecked feet.", sets:"2×10–15"}
    ]
  }
};

const WEEK = [
  {d:0, label:"Sunday", short:"Sun", key:"lower-a", note:"After Saturday upper. Legs while you still have the weekend."},
  {d:1, label:"Monday", short:"Mon", key:null, note:"Busiest work day. Walking is the session. No PF."},
  {d:2, label:"Tuesday", short:"Tue", key:"upper-b", note:"Second upper. Laterals + curls. Not a make-up dump."},
  {d:3, label:"Wednesday", short:"Wed", key:"lower-b", note:"Work off. Light legs if hamstring is quiet. Bigger food day ends tonight."},
  {d:4, label:"Thursday", short:"Thu", key:null, note:"Gym off on purpose. Protects Friday. Food window only."},
  {d:5, label:"Friday", short:"Fri", key:null, note:"Busiest work day. No lift, no laterals cameo, no incline."},
  {d:6, label:"Saturday", short:"Sat", key:"upper-a", note:"Week starts here. V-taper session."}
];

let state = null;
let view = "boot";
let tab = "home";
let openDay = null;
let openSession = null;
let toastMsg = "";
let restHandle = null;
let tapLock = false;
let booted = false;
let AC = null;
let toastTimer = null;
let clockHandle = null;

function defaults() {
  return {
    lastWeights: {},
    sessions: [],
    bodyweights: [],
    stats: {wt: 270, ht: "6'2\"", lbm: 175, protein: "160–180"},
    food: null,
    live: null,
    exitReason: "",
    sound: true,
    installHint: true
  };
}

function load() {
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) {}
  let data = defaults();
  if (raw) {
    try {
      const parsed = JSON.parse(raw);
      data = Object.assign(defaults(), parsed);
      if (!data.stats) data.stats = defaults().stats;
      if (!data.lastWeights) data.lastWeights = {};
      if (!Array.isArray(data.sessions)) data.sessions = [];
      if (!Array.isArray(data.bodyweights)) data.bodyweights = [];
    } catch (e) {}
  }
  data.live = null;
  state = data;
  return state;
}

function persist() {
  const copy = Object.assign({}, state);
  copy.live = null;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(copy)); } catch (e) {}
}

function audio() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (AC && AC.state === "suspended") AC.resume();
  return AC;
}

function blip(freq, dur, type, vol) {
  if (!state || !state.sound) return;
  const ctx = audio();
  if (!ctx) return;
  try {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type || "square";
    o.frequency.value = freq;
    g.gain.value = vol != null ? vol : 0.04;
    o.connect(g); g.connect(ctx.destination);
    const t = ctx.currentTime;
    g.gain.setValueAtTime(g.gain.value, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.1));
    o.start(t); o.stop(t + (dur || 0.1) + 0.02);
  } catch (e) {}
}

function sfxTap() { blip(420, 0.05, "square", 0.03); }
function sfxConfirm() { blip(660, 0.08, "square", 0.04); setTimeout(function(){ blip(880, 0.1, "square", 0.04); }, 70); }
function sfxDone() { blip(523, 0.1, "triangle", 0.05); setTimeout(function(){ blip(659, 0.12, "triangle", 0.05); }, 100); setTimeout(function(){ blip(784, 0.18, "triangle", 0.05); }, 220); }
function sfxWarn() { blip(220, 0.18, "sawtooth", 0.035); }

function buzz(pattern) {
  try {
    if (navigator.vibrate) navigator.vibrate(pattern);
  } catch (e) {}
}

function todayISO() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}

function weekStart() {
  const d = new Date();
  const day = d.getDay();
  const satOffset = (day + 1) % 7;
  d.setDate(d.getDate() - satOffset);
  d.setHours(0, 0, 0, 0);
  return d;
}

function sessionsThisWeek() {
  const start = weekStart();
  return state.sessions.filter(function(s) {
    const parts = s.date.split("-");
    const dt = new Date(+parts[0], +parts[1] - 1, +parts[2]);
    return dt >= start;
  });
}

function didKeyThisWeek(key) {
  return sessionsThisWeek().some(function(s) { return s.key === key; });
}

function xp() {
  return state.sessions.reduce(function(n, s) {
    const done = (s.work || []).reduce(function(a, w) {
      return a + (w.sets || []).filter(function(x) { return x.done; }).length;
    }, 0);
    return n + done * 5 + 10;
  }, 0);
}

function level() {
  return Math.floor(xp() / 40) + 1;
}

function xpInto() {
  return xp() % 40;
}

function todayPlan() {
  const d = new Date().getDay();
  return WEEK.find(function(w) { return w.d === d; });
}

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function isWorkDay(d) {
  return d === 1 || d === 5;
}

function toast(msg) {
  toastMsg = msg;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function() {
    toastMsg = "";
    const el = document.getElementById("toastEl");
    if (el) el.remove();
  }, 2200);
  let el = document.getElementById("toastEl");
  if (!el) {
    el = document.createElement("div");
    el.id = "toastEl";
    el.className = "toast";
    document.body.appendChild(el);
  }
  el.textContent = msg;
}

function go(v) {
  view = v;
  if (v === "home") tab = "home";
  if (v === "week" || v === "day") tab = "week";
  if (v === "fuel") tab = "fuel";
  if (v === "log" || v === "session") tab = "log";
  render();
}

function startWorkout(key) {
  const d = new Date().getDay();
  if (isWorkDay(d) && !confirm("Mon/Fri is work-walk protocol.\nDeploy a lift anyway?")) return;
  const p = PROGRAMS[key];
  if (!p) return;
  state.live = {
    key: key,
    date: todayISO(),
    i: 0,
    set: 0,
    resting: 0,
    started: Date.now(),
    sets: p.items.map(function(ex) {
      const w = state.lastWeights[ex.id] != null ? state.lastWeights[ex.id] : 10;
      return [
        {w: w, r: 12, done: false},
        {w: w, r: 12, done: false}
      ];
    })
  };
  state.exitReason = "";
  sfxConfirm();
  buzz(25);
  go("lift");
}

function bump(kind, dir) {
  if (!state.live) return;
  const live = state.live;
  const s = live.sets[live.i][live.set];
  if (kind === "w") {
    s.w = Math.max(5, s.w + dir * 5);
  } else {
    s.r = Math.max(1, Math.min(30, s.r + dir));
  }
  sfxTap();
  render();
}

function startRest() {
  clearInterval(restHandle);
  state.live.resting = REST;
  restHandle = setInterval(function() {
    if (!state.live || state.live.resting <= 0) {
      clearInterval(restHandle);
      return;
    }
    state.live.resting -= 1;
    if (state.live.resting <= 0) {
      state.live.resting = 0;
      clearInterval(restHandle);
      blip(1046, 0.13, "triangle", 0.05);
      setTimeout(function() { blip(1568, 0.16, "triangle", 0.05); }, 150);
      buzz([40, 60, 40]);
    }
    if (view === "lift") render();
  }, 1000);
  render();
}

function completeSet() {
  if (tapLock) return;
  tapLock = true;
  setTimeout(function() { tapLock = false; }, 380);
  const live = state.live;
  if (!live) return;
  const ex = PROGRAMS[live.key].items[live.i];
  live.sets[live.i][live.set].done = true;
  state.lastWeights[ex.id] = live.sets[live.i][live.set].w;
  sfxConfirm();
  buzz(30);
  if (live.set === 0) {
    live.set = 1;
    startRest();
  } else {
    clearInterval(restHandle);
    live.resting = 0;
    if (live.i < PROGRAMS[live.key].items.length - 1) {
      live.i += 1;
      live.set = 0;
      render();
    } else {
      finishWorkout("complete");
    }
  }
}

function finishWorkout(reason) {
  clearInterval(restHandle);
  const live = state.live;
  if (!live) return;
  const p = PROGRAMS[live.key];
  state.sessions.unshift({
    date: live.date,
    key: live.key,
    name: p.name,
    minutes: Math.max(1, Math.round((Date.now() - live.started) / 60000)),
    work: p.items.map(function(ex, i) {
      return {id: ex.id, name: ex.name, sets: live.sets[i]};
    })
  });
  if (state.sessions.length > 60) state.sessions.length = 60;
  state.live = null;
  state.exitReason = reason || "complete";
  if (reason === "complete") sfxDone();
  else sfxWarn();
  buzz(60);
  persist();
  go("done");
}

  else if (view === "lift") html = screenLift();
  else if (view === "done") html = screenDone();
  else if (view === "fuel") html = screenFuel();
  else if (view === "log") html = screenLog();
  else if (view === "session") html = screenSession();

function $(id) { return document.getElementById(id); }

function bind() {
  document.querySelectorAll("[data-nav]").forEach(function(btn) {
    btn.onclick = function() {
      sfxTap();
      const v = btn.getAttribute("data-nav");
      if (v === "home") go("home");
      else if (v === "week") go("week");
      else if (v === "fuel") go("fuel");
      else if (v === "log") go("log");
    };
  });
  document.querySelectorAll("[data-go]").forEach(function(btn) {
    btn.onclick = function() {
      const g = btn.getAttribute("data-go");
      if (g.indexOf("start:") === 0) {
        startWorkout(g.slice(6));
        return;
      }
      sfxTap();
      go(g);
    };
  });
  document.querySelectorAll("[data-day]").forEach(function(btn) {
    btn.onclick = function() {
      sfxTap();
      openDay = +btn.getAttribute("data-day");
      go("day");
    };
  });
  document.querySelectorAll("[data-sess]").forEach(function(btn) {
    btn.onclick = function() {
      sfxTap();
      openSession = +btn.getAttribute("data-sess");
      go("session");
    };
  });
  document.querySelectorAll("[data-act]").forEach(function(btn) {
    btn.onclick = function() {
      const a = btn.getAttribute("data-act");
      if (a === "w+") bump("w", 1);
      else if (a === "w-") bump("w", -1);
      else if (a === "r+") bump("r", 1);
      else if (a === "r-") bump("r", -1);
    };
  });
  document.querySelectorAll("[data-food]").forEach(function(el) {
    el.onclick = function() {
      const food = ensureFood();
      const k = el.getAttribute("data-food");
      food[k] = !food[k];
      sfxTap();
      persist();
      render();
    };
  });
  if ($("did")) $("did").onclick = function() { completeSet(); };
  if ($("skipRest")) $("skipRest").onclick = function() {
    clearInterval(restHandle);
    if (state.live) state.live.resting = 0;
    sfxTap();
    render();
  };
  if ($("cramp")) $("cramp").onclick = function() {
    if (!confirm("Cramp abort — leave the floor?")) return;
    finishWorkout("cramp");
  };
  if ($("quit")) $("quit").onclick = function() {
    if (!confirm("End & save current progress?")) return;
    finishWorkout("quit");
  };
  if ($("skipEx")) $("skipEx").onclick = function() {
    sfxTap();
    const live = state.live;
    if (!live) return;
    clearInterval(restHandle);
    live.resting = 0;
    if (live.i < PROGRAMS[live.key].items.length - 1) {
      live.i += 1;
      live.set = 0;
      render();
    } else {
      finishWorkout("complete");
    }
  };
  if ($("bwSave")) $("bwSave").onclick = function() {
    const inp = $("bwInput");
    const v = parseFloat(inp && inp.value);
    if (!v || v < 50 || v > 600) { toast("Enter a valid weight"); return; }
    state.bodyweights.unshift({date: todayISO(), lb: Math.round(v * 10) / 10});
    if (state.bodyweights.length > 90) state.bodyweights.length = 90;
    state.stats.wt = state.bodyweights[0].lb;
    sfxConfirm();
    persist();
    toast("Scale logged · " + state.bodyweights[0].lb + " LB");
    render();
  };
  if ($("soundToggle")) $("soundToggle").onclick = function() {
    state.sound = !state.sound;
    if (state.sound) sfxTap();
    persist();
    render();
  };
  if ($("wipeData")) $("wipeData").onclick = function() {
    if (!confirm("Wipe ALL local PF//TRACK data?")) return;
    if (!confirm("Really wipe? This cannot be undone.")) return;
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    clearInterval(restHandle);
    state = defaults();
    sfxWarn();
    toast("Data wiped");
    go("home");
  };
  if ($("installHint")) $("installHint").onclick = function() {
    state.installHint = false;
    persist();
    render();
  };
}

  let skip = false;
  try { skip = sessionStorage.getItem("pftrack_booted") === "1"; } catch (e) {}
  if (skip) {
    booted = true;
    view = "home";
    render();
    return;
  }
  view = "boot";
  render();
  setTimeout(function() {
    try { sessionStorage.setItem("pftrack_booted", "1"); } catch (e) {}
    booted = true;
    view = "home";
    sfxDone();
    render();
  }, 1600);
}

bootSequence();
clockHandle = setInterval(tickClock, 15000);
</script>
</body>
</html>
