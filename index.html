<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5, user-scalable=yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="PF//TRACK"/>
<meta name="theme-color" content="#04060a"/>
<title>PF//TRACK</title>
<style>
:root{
  --t-press:120ms;--t-screen:200ms;--ease:cubic-bezier(.2,.8,.2,1);
  /* token aliases — env engine remaps these */
  --bg:#0a0e14;
  --panel:#141b24;
  --panel2:#1a2330;
  --line:#2a3544;
  --line2:#3a4758;
  --text:#e8eef4;
  --dim:#8b9aab;
  --muted:#6b7a8c;
  --neon:#b8ff2e;
  --neon-dim:rgba(184,255,46,.18);
  --cyan:#5ec8d8;
  --hot:#ff6b8a;
  --amber:#ffb020;
  --ok:#3dff9e;
  --ok-bg:rgba(61,255,158,.12);
  --env-glow-a:rgba(94,200,216,.08);
  --env-glow-b:rgba(184,255,46,.04);
  --reactive-glow:rgba(184,255,46,.14);
  --sb-bg:rgba(10,14,20,.98);
  --hud-bg:rgba(10,14,20,.96);
  --vice-sky-top:#050a12;
  --vice-sky-mid:#120820;
  --vice-sky-bot:#020306;
  --aurora-a:rgba(255,0,170,.1);
  --aurora-b:rgba(0,229,255,.08);
  --aurora-c:rgba(184,255,46,.06);
  --grid-line:rgba(0,229,255,.16);
  --grid-opacity:.16;
  --skyline-pink:#ff00aa;
  --skyline-cyan:#00e5ff;
  --tint-wash:transparent;
  --radius:14px;
  --radius-sm:12px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --tap:52px;
  --gap:13px;
  --card-pad:19px;
  --env-fade:450ms;
  --well:#0c1218;
  --well2:#1a2530;
  --pop-bg:rgba(14,20,28,.97);
}
html[data-env="day"]{
  /* v4.36 Daylight: light surfaces + ink, AAA text contrast on panel */
  --bg:#eef4f5;
  --panel:#ffffff;
  --panel2:#f3f7f8;
  --line:#c9d6da;
  --line2:#aebfc4;
  --text:#0b1a20;
  --dim:#2f4952;
  --muted:#3d5862;
  --neon:#335800;
  --neon-dim:rgba(120,190,0,.16);
  --cyan:#005a6e;
  --hot:#a8002f;
  --amber:#7a4600;
  --ok:#00603a;
  --ok-bg:rgba(0,150,80,.1);
  --ok-ink:#004d2e; /* v4.62: --ok one step darker, for ok text on a solid --ok tint (low crowd pill) */
  --danger-ink:#820022; /* v4.71: --hot ink for danger TEXT (same hue 18, OKLCH L .464 -> .384) */
  --warn-ink:#462904; /* v4.71: amber ink for warning TEXT (hue 67, between --amber 64 and the cue 71) */
  --neon-ink:#2b4b00; /* v4.62: --neon one step darker for small neon text on glass (active tab, header brand, Dismiss) */
  --dim-onart:#1e3540; /* v4.62: --dim for text sitting straight on the city art (no card behind it) */
  --env-glow-a:rgba(255,200,120,.38);
  --env-glow-b:rgba(0,180,200,.14);
  --reactive-glow:rgba(120,190,0,.24);
  --sb-bg:rgba(238,244,245,.94);
  --hud-bg:rgba(255,255,255,.92);
  --vice-sky-top:#cfe8f1;
  --vice-sky-mid:#eef5f4;
  --vice-sky-bot:#f7efe5;
  --aurora-a:rgba(255,170,120,.2);
  --aurora-b:rgba(0,200,230,.14);
  --aurora-c:rgba(255,120,170,.1);
  --grid-line:rgba(0,90,110,.2);
  --grid-opacity:.3;
  --skyline-pink:#ff9ab0;
  --skyline-cyan:#64c8d8;
  --well:#e4edef;
  --well2:#cbd9dd;
  --pop-bg:rgba(255,255,255,.97);
}
html[data-env="day"][data-camo]{--neon:#335800;--neon-dim:rgba(120,190,0,.16);--cyan:#005a6e;--reactive-glow:rgba(120,190,0,.24)}
html[data-env="night"]{
  --bg:#050218;
  --panel:#120e1c;
  --panel2:#1a1428;
  --line:#2a2438;
  --line2:#3a3450;
  --text:#ece8f4;
  --dim:#c0b4cd; /* v4.59: 7:1+ on the lightest Night glass (hero #2c233b), still quieter than --text */
  --dim-onart:#d4cae0; /* v4.62: --dim lifted (same hue) for text straight on the city art; --dim itself unchanged */
  --danger-ink:#ff9cb6; /* v4.71: Night danger text (hue 3, OKLCH L .77 -> .80), on an opaque .btn.dan base */
  --warn-ink:#ffb020; /* v4.71: Night warning text = the Night --amber value (already 7:1+) */
  --neon-ink:color-mix(in srgb,var(--neon) 60%,#fff); /* v4.63: Night twin of the Day --neon-ink (active tab, "next"); follows camo --neon */
  --muted:#9a8aad; /* v4.70: decoration-only (toggle OFF knob is its only user); OKLCH L .554 -> .66, same C/H: knob vs track 3.19 -> 4.89 */
  --neon:#c4a0ff;
  --neon-dim:rgba(196,160,255,.2);
  --cyan:#00e5ff;
  --hot:#ff6b8a;
  --amber:#ffb020;
  --ok:#3dff9e;
  --ok-bg:rgba(61,255,158,.12);
  --env-glow-a:rgba(255,0,170,.16);
  --env-glow-b:rgba(0,229,255,.1);
  --reactive-glow:rgba(255,0,170,.18);
  --sb-bg:rgba(5,2,24,.98);
  --hud-bg:rgba(5,2,24,.96);
  --vice-sky-top:#040218;
  --vice-sky-mid:#1a0532;
  --vice-sky-bot:#010104;
  --aurora-a:rgba(255,0,170,.18);
  --aurora-b:rgba(0,229,255,.15);
  --aurora-c:rgba(61,255,158,.1);
  --grid-line:rgba(255,0,170,.28);
  --grid-opacity:.22;
  --skyline-pink:#ff00aa;
  --skyline-cyan:#00e5ff;
}
/* Camo accent overlays (cosmetic-only) */
html[data-camo="verde"]{--neon:#b8ff2e;--neon-dim:rgba(184,255,46,.2);--cyan:#6ad4a0;--reactive-glow:rgba(184,255,46,.2)}
html[data-camo="midnight"]{--neon:#c4a0ff;--neon-dim:rgba(196,160,255,.22);--cyan:#8a7cff;--reactive-glow:rgba(196,160,255,.22)}
html[data-camo="glacial"]{--neon:#9ef0ff;--neon-dim:rgba(158,240,255,.2);--cyan:#7ad4e8;--reactive-glow:rgba(158,240,255,.2)}
html[data-camo="royal"]{--neon:#ffd060;--neon-dim:rgba(255,208,96,.2);--cyan:#c4a0ff;--reactive-glow:rgba(255,208,96,.18)}
html[data-camo="emerald"]{--neon:#3dff9e;--neon-dim:rgba(61,255,158,.2);--cyan:#5ec8a0;--reactive-glow:rgba(61,255,158,.2)}
html[data-camo="afterglow"]{--neon:#ff9a6a;--neon-dim:rgba(255,154,106,.22);--cyan:#ffb020;--reactive-glow:rgba(255,154,106,.2)}
html{
  transition:background-color var(--env-fade) ease, color var(--env-fade) ease;
}
html,body{background:var(--bg)}
.btn.pri{
  transition:box-shadow var(--env-fade) ease, filter var(--t-press) var(--ease), transform var(--t-press) var(--ease);
}
html.reactive-hot .card{
  box-shadow:0 0 28px var(--reactive-glow);
  border-color:var(--neon);
}
html.reactive-hot .btn.pri{
  box-shadow:0 4px 28px var(--reactive-glow);
}
html.reactive-low .card{box-shadow:none}
.shopGrid{display:grid;gap:10px;margin-top:12px}
.shopItem{
  display:flex;flex-direction:column;gap:8px;padding:14px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);
}
.shopItem.eq{border-color:rgba(184,255,46,.45);box-shadow:inset 3px 0 0 var(--neon)}
.shopSwatch{
  height:36px;border-radius:10px;border:1px solid var(--line2);
  background:linear-gradient(135deg,var(--neon),var(--cyan));
}
.shopRow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.shopMeta{font-size:12px;color:var(--dim)}
.seg{
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;
}
.seg button{
  min-height:44px;border-radius:10px;border:1px solid var(--line2);
  background:var(--panel2);color:var(--dim);font:600 13px/1 var(--font);cursor:pointer;
}
.seg button.on{background:var(--neon-dim);border-color:var(--neon);color:var(--neon)}
html[data-env="night"] .seg button.on{color:color-mix(in srgb,var(--neon) 45%,#fff)} /* v4.72: 60% -> 45% neon so every Night selected segment reaches 7.5:1 (Fuel/Calday "Home" was 6.97) */ /* v4.59: label on the tinted pill reaches 7:1; accent token untouched */
.moreList{display:grid;gap:10px;margin-top:8px}
.moreList .btn{justify-content:flex-start;gap:12px;padding-left:16px;text-align:left}
.moreList .btn .ico{opacity:.85;width:22px;text-align:center}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  font-size:16px;
  line-height:1.45;
  overflow-x:hidden;
  position:relative;
  transition:background-color var(--env-fade) ease, color var(--env-fade) ease;
}
#app{
  position:relative;z-index:1;
  max-width:440px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  padding:0 16px calc(var(--nav-clear,104px) + env(safe-area-inset-bottom,0px));
}

/* Neo-Vice City global ambient — navy→magenta→black / Verde Monte day */
#envBg{
  position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
}
#envBg .envGrad{
  position:absolute;inset:0;
  background:
    linear-gradient(180deg,var(--vice-sky-top) 0%,var(--vice-sky-mid) 46%,var(--vice-sky-bot) 100%),
    radial-gradient(120% 70% at 50% -5%,var(--env-glow-a),transparent 58%),
    radial-gradient(90% 50% at 50% 110%,var(--env-glow-b),transparent 60%);
  transition:background var(--env-fade) ease, opacity var(--env-fade) ease;
}
#envBg .envAurora{
  position:absolute;inset:-12% -18%;
  background:
    radial-gradient(ellipse 52% 38% at 18% 28%,var(--aurora-a),transparent 70%),
    radial-gradient(ellipse 48% 34% at 82% 22%,var(--aurora-b),transparent 70%),
    radial-gradient(ellipse 58% 42% at 50% 88%,var(--aurora-c),transparent 72%),
    radial-gradient(ellipse 40% 30% at 50% 40%,var(--tint-wash),transparent 75%);
  opacity:.9;
  filter:blur(1.5px);
  animation:auroraDrift 32s ease-in-out infinite alternate;
}
#envBg .envGrid{
  position:absolute;left:-25%;right:-25%;bottom:-8%;height:58%;
  background-image:
    linear-gradient(to bottom,transparent 0%,transparent 94%,var(--grid-line) 95%,transparent 100%),
    linear-gradient(to right,transparent 0%,transparent 94%,var(--grid-line) 95%,transparent 100%);
  background-size:56px 56px;
  background-position:0 0;
  transform:perspective(480px) rotateX(60deg) translateY(8%);
  transform-origin:50% 100%;
  opacity:var(--grid-opacity);
  -webkit-mask-image:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.55) 35%,rgba(0,0,0,.95) 100%);
  mask-image:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.55) 35%,rgba(0,0,0,.95) 100%);
  animation:gridCrawl 22s linear infinite;
}
#envBg .envSkyline{
  position:absolute;left:0;right:0;bottom:0;height:min(36vh,260px);
  opacity:.48;
}
#envBg .envSkyline svg{display:block;width:100%;height:100%}
#envBg .envHaze{
  position:absolute;left:0;right:0;bottom:0;height:42%;
  background:
    linear-gradient(180deg,transparent 0%,rgba(255,0,170,.06) 55%,rgba(0,229,255,.05) 100%);
  opacity:.7;
  mix-blend-mode:screen;
}
html[data-env="day"] #envBg .envHaze{
  background:linear-gradient(180deg,transparent 0%,rgba(61,255,158,.05) 50%,rgba(70,120,255,.07) 100%);
}
#envBg .envScan{
  position:absolute;inset:0;
  background:repeating-linear-gradient(
    0deg,
    transparent,
    transparent 3px,
    rgba(0,0,0,.035) 3px,
    rgba(0,0,0,.035) 4px
  );
  opacity:.4;pointer-events:none;
}
@keyframes auroraDrift{
  from{transform:translate3d(-2%,1%,0) scale(1)}
  to{transform:translate3d(2%,-1.5%,0) scale(1.04)}
}
@keyframes gridCrawl{
  from{background-position:0 0}
  to{background-position:0 56px}
}
html.reactive-low #envBg .envAurora,
html.reactive-low #envBg .envGrid{
  animation:none;
}
html.reactive-low #envBg .envAurora{opacity:.55}
html.reactive-low #envBg .envGrid{opacity:calc(var(--grid-opacity) * .7)}
html.reactive-low #envBg .envSkyline{opacity:.38}
html[data-tint="lime"]{--tint-wash:rgba(184,255,46,.14)}
html[data-tint="amber"]{--tint-wash:rgba(255,176,32,.14)}
html[data-tint="navy"]{--tint-wash:rgba(40,70,180,.16)}
html[data-tint="cyan"]{--tint-wash:rgba(0,229,255,.1)}
html[data-tint="none"]{--tint-wash:transparent}
@media (prefers-reduced-motion: reduce){
  #envBg .envAurora,#envBg .envGrid{animation:none !important}
}
.sb{
  position:sticky;top:0;z-index:40;margin:0 -16px 24px;
  padding:calc(12px + env(safe-area-inset-top,0px)) calc(72px + env(safe-area-inset-right,0px)) 12px 16px;
  min-height:calc(42px + env(safe-area-inset-top,0px));box-sizing:border-box;
  display:flex;justify-content:space-between;align-items:center;
  font-size:12px;font-weight:600;color:var(--dim);
  background:linear-gradient(180deg,var(--sb-bg) 70%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.sb b{color:var(--neon);font-weight:700;letter-spacing:0.02em}
.sb > span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sb > span + span{flex:none;margin-left:10px}
.dotlive{
  display:inline-block;width:8px;height:8px;border-radius:50%;
  background:var(--neon);margin-right:8px;vertical-align:middle;
  box-shadow:0 0 6px rgba(184,255,46,.45);opacity:.9;
}
.lbl{
  font-size:12px;font-weight:600;color:var(--dim);
  letter-spacing:0.04em;margin:0;
}
h1{
  font-size:27px;line-height:1.2;margin:8px 0 10px;font-weight:700;
  color:var(--text);letter-spacing:-0.01em;
}
h2{
  font-size:15px;font-weight:700;color:var(--text);margin:0 0 12px;
  letter-spacing:0;
}
.sub{
  color:var(--dim);margin:0 0 16px;font-size:15px;line-height:1.5;
}
.stat{
  font-family:var(--mono);font-size:36px;font-weight:700;
  font-variant-numeric:tabular-nums;line-height:1.1;color:var(--text);
}
.stat small{font-size:15px;color:var(--dim);font-weight:600}
.card{
  position:relative;z-index:1;padding:var(--card-pad);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  margin-top:var(--gap);
  box-shadow:0 8px 28px rgba(0,0,0,.28);
}
.card:first-of-type{margin-top:0}
.cue{
  background:rgba(255,176,32,.08);
  border-color:rgba(255,176,32,.35);
  color:#f0c27a;
  font-size:15px;line-height:1.5;
}
.cue b{color:#ffd080;font-weight:700}
.btn{
  display:flex;align-items:center;justify-content:center;
  width:100%;min-height:48px;padding:14px 18px;
  background:var(--panel2);border:1px solid var(--line2);
  border-radius:var(--radius-sm);
  color:var(--text);font:600 15px/1.25 var(--font);
  cursor:pointer;text-align:center;
}
.btn:active{transform:scale(.98);filter:brightness(1.08)}
.btn.pri{
  min-height:56px;font-size:17px;font-weight:700;
  background:linear-gradient(180deg,#d4ff6a,#a8e820);
  color:#0a1408;border-color:#e0ff9a;
  box-shadow:0 4px 18px var(--reactive-glow);
}
.btn.ok{
  min-height:56px;font-size:17px;font-weight:700;
  background:linear-gradient(180deg,#4dffaa,#1ec878);
  color:#03180e;border-color:#8affc8;
}
.btn.dan{
  min-height:48px;
  background:rgba(255,47,110,.1);color:var(--danger-ink);border-color:rgba(255,47,110,.35); /* v4.71: text -> --danger-ink */
}
.btn.gho{
  background:transparent;color:var(--dim);border-color:var(--line);
  min-height:48px;
}
.btn.big{min-height:56px;font-size:17px}
.btn:disabled,.btn.disabled{opacity:.7;pointer-events:none;background:transparent;border:1px dashed var(--line2);color:var(--dim);box-shadow:none;filter:none} /* v4.72: disabled = no fill + dashed edge + --dim label (was the whole button at .4 = 1.6-2.5:1); label >= 3:1 */
.stack{display:grid;gap:10px;margin-top:16px}
.bar{
  height:10px;background:var(--well);border:1px solid var(--line);
  border-radius:6px;margin:12px 0 10px;position:relative;overflow:hidden;
}
.bar>i{
  display:block;height:100%;border-radius:5px;
  background:linear-gradient(90deg,var(--cyan),var(--neon));
}
.dots{display:flex;gap:8px;margin:14px 0 8px}
.dot{
  flex:1;height:12px;background:var(--well);border:1px solid var(--line);
  border-radius:6px;
}
.dot.on{background:var(--neon);border-color:var(--neon)}
.pill{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:28px;padding:4px 10px;font-size:12px;font-weight:600;
  background:var(--panel2);border:1px solid var(--line2);
  border-radius:999px;color:var(--dim);white-space:nowrap;
}
.pill.on{background:var(--ok-bg);border-color:#2a7a52;color:var(--ok)}
.pill.hot{background:rgba(255,176,32,.12);border-color:#5a4018;color:var(--warn-ink)} /* v4.71: text -> --warn-ink */
.pill.today{background:var(--neon-dim);border-color:#6f9a12;color:var(--neon)}
.row{
  display:flex;justify-content:space-between;gap:12px;
  padding:14px 0;border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:0}
.row b{font-size:15px;font-weight:600;letter-spacing:0}
.row .n{font-size:13px;color:var(--dim);margin-top:4px;line-height:1.4}
.row .r{text-align:right;flex-shrink:0}
.daybtn{
  display:flex;justify-content:space-between;align-items:center;width:100%;
  min-height:64px;padding:14px 16px;margin-bottom:10px;text-align:left;
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-sm);
  color:var(--text);font-family:var(--font);cursor:pointer;gap:12px;
}
.daybtn:active{filter:brightness(1.06)}
.daybtn.is-today{
  border-color:rgba(184,255,46,.55);
  box-shadow:inset 4px 0 0 var(--neon);
  background:rgba(184,255,46,.06);
}
.daybtn .l b{display:block;font-size:16px;font-weight:700}
.daybtn .l span{display:block;font-size:13px;color:var(--dim);margin-top:4px;line-height:1.35}
.setbox{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px} /* v4.68: wraps to one stepper per row below 380px (v4.69) */
.setbox>div{
  flex:1 1 168px;min-width:0; /* v4.69: 168 = wrap below 380 (v4.68: 165 -> 374); was flex:1 (min-width:auto) -> Reps card overflowed 18px at 390 */
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:14px 10px;text-align:center;
}
.step{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.step b{
  font-family:var(--mono);font-size:28px;font-weight:700;
  min-width:48px;font-variant-numeric:tabular-nums;
}
.mini{
  width:var(--tap);height:var(--tap);min-width:var(--tap);min-height:var(--tap);
  border-radius:12px;background:var(--panel2);border:1px solid var(--line2);
  color:var(--text);font:700 24px/1 var(--font);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
  user-select:none;-webkit-user-select:none;
}
.mini:active{background:var(--neon);color:#0a1408;border-color:var(--neon)}
.ringwrap{position:relative;width:200px;height:200px;margin:12px auto}
.ring{width:200px;height:200px}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:#1a2430}
.ring .fg{
  stroke:var(--neon);transform:rotate(-90deg);transform-origin:50% 50%;
  transition:stroke-dashoffset var(--t-screen) var(--ease);
}
.ringwrap .num{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--mono);font-size:58px;font-weight:700;
  font-variant-numeric:tabular-nums;
}

/* Home bubble map v3.7 */
.bubbleSection{margin-top:18px}
.bubbleSection > .lbl{margin-bottom:10px}
.bubbleMap{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}
.bubble{
  aspect-ratio:1;
  min-width:0;
  min-height:72px;
  width:100%;
  border-radius:50%;
  border:1px solid var(--line2);
  background:radial-gradient(circle at 35% 28%,rgba(94,200,216,.16),transparent 55%),var(--panel);
  color:var(--text);
  font-family:var(--font);
  cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:10px 6px;
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
  touch-action:manipulation;
  box-shadow:inset 0 0 0 1px rgba(94,200,216,.08);
}
.bubble:active{filter:brightness(1.1);border-color:rgba(94,200,216,.55)}
.bubble .bico{
  font-size:22px;line-height:1;color:var(--cyan);
  text-shadow:0 0 12px rgba(94,200,216,.35);
}
.bubble .blabel{
  font-size:12px;font-weight:700;letter-spacing:0.02em;
  color:var(--text);line-height:1.1;
}
.bubbleNote{
  position:fixed;z-index:60;
  max-width:min(280px,78vw);
  padding:12px 14px;
  background:var(--pop-bg);
  border:1px solid rgba(94,200,216,.45);
  border-radius:14px;
  color:var(--text);
  font:600 14px/1.4 var(--font);
  box-shadow:0 10px 28px rgba(0,0,0,.45),0 0 0 1px rgba(184,255,46,.08);
  pointer-events:none;
}
.bubbleNote::after{
  content:"";position:absolute;left:50%;bottom:-6px;
  width:10px;height:10px;transform:translateX(-50%) rotate(45deg);
  background:var(--pop-bg);
  border-right:1px solid rgba(94,200,216,.45);
  border-bottom:1px solid rgba(94,200,216,.45);
}
.bubbleNote.below::after{
  bottom:auto;top:-6px;
  border:0;
  border-left:1px solid rgba(94,200,216,.45);
  border-top:1px solid rgba(94,200,216,.45);
}

/* v4.31 tabular figures: digits never jitter (clock, weight, macros, steppers, rings, heatmap) */
*,*::before,*::after{font-variant-numeric:tabular-nums lining-nums !important;font-feature-settings:"tnum" 1,"lnum" 1}
/* v4.30 unified motion: one press, one screen timing */
button,.btn,.daybtn,.mini,.pet-item,.calCell,.hubTile,.bubble,.plateBtn,.criollaTile,.starBtn,.toggle,.moreList a,.moreList button,summary{
  -webkit-tap-highlight-color:transparent;
  transition:transform var(--t-press) var(--ease),filter var(--t-press) var(--ease),background-color var(--t-press) var(--ease),border-color var(--t-press) var(--ease),color var(--t-press) var(--ease),box-shadow var(--t-screen) var(--ease);
}
button:active,.btn:active,.daybtn:active,.mini:active,.pet-item:active,.calCell:active,.hubTile:active,.bubble:active,.plateBtn:active,.criollaTile:active,.starBtn:active,.toggle:active,.moreList a:active,.moreList button:active,summary:active{
  transform:scale(.98);filter:brightness(1.08);
}
button:disabled:active,.btn:disabled:active{transform:none;filter:none}
@keyframes screenIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#app.screenIn > *:not(.sb):not(nav):not(.hud){animation:screenIn var(--t-screen) var(--ease) backwards}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;animation-delay:0s !important;transition-duration:.01ms !important;transition-delay:0s !important;scroll-behavior:auto !important}
  button:active,.btn:active,.daybtn:active,.mini:active,.pet-item:active,.calCell:active,.hubTile:active,.bubble:active,.plateBtn:active,.criollaTile:active,.starBtn:active,.toggle:active,.moreList a:active,.moreList button:active,summary:active{transform:none}
}

// Test clock: ?asof=YYYY-MM-DD shifts the app's date and uses a separate sandbox store.
var PF_ASOF = (function() {
  try {
    var m = /[?&]asof=(\d{4}-\d{2}-\d{2})/.exec(location.search || "");
    if (!m) return "";
    var R = Date, now = new R(), t = new R(m[1] + "T00:00:00");
    if (isNaN(t)) return "";
    t.setHours(now.getHours(), now.getMinutes(), now.getSeconds(), now.getMilliseconds());
    var off = t.getTime() - now.getTime();
    var D = function() {
      if (!(this instanceof D)) return new R(R.now() + off).toString();
      if (!arguments.length) return new R(R.now() + off);
      return new (Function.prototype.bind.apply(R, [null].concat([].slice.call(arguments))))();
    };
    D.prototype = R.prototype; D.now = function() { return R.now() + off; }; D.parse = R.parse; D.UTC = R.UTC;
    window.Date = D;
    return m[1];
  } catch (e) { return ""; }
})();

function normalizeCosmetics(raw) {
  const d = defaults().cosmetics;
  const c = (raw && typeof raw === "object") ? raw : {};
  const pref = c.environmentPreference;
  const out = {
    environmentPreference: (pref === "day" || pref === "night" || pref === "auto") ? pref : "auto",
    camo: typeof c.camo === "string" ? c.camo : "default",
    reactive: typeof c.reactive === "boolean" ? c.reactive : true,
    owned: Array.isArray(c.owned) ? c.owned.slice() : d.owned.slice(),
    equipped: (c.equipped && typeof c.equipped === "object") ? Object.assign({}, d.equipped, c.equipped) : Object.assign({}, d.equipped),
    earned: (c.earned && typeof c.earned === "object") ? Object.assign({}, c.earned) : {}
  };
  // Offline personalization: grant all listed camos as owned (prices = future reference)
  CAMO_ITEMS.forEach(function(it) {
    if (out.owned.indexOf(it.id) < 0) out.owned.push(it.id);
  });
  if (out.owned.indexOf("default") < 0) out.owned.unshift("default");
  if (!out.camo || out.owned.indexOf(out.camo) < 0) out.camo = "default";
  if (!out.equipped.camo) out.equipped.camo = out.camo;
  return out;
}

function ensureCosmetics() {
  if (!state) return defaults().cosmetics;
  state.cosmetics = normalizeCosmetics(state.cosmetics);
  return state.cosmetics;
}

function resolveEnvironment() {
  const c = ensureCosmetics();
  const pref = c.environmentPreference || "auto";
  if (pref === "day" || pref === "night") return pref;
  const h = new Date().getHours();
  return (h >= 7 && h < 18) ? "day" : "night";
}

function prefersReducedMotion() {
  try {
    if (/[?&]rm=1(&|$)/.test(location.search)) return true;
    return !!(typeof matchMedia === "function" && matchMedia("(prefers-reduced-motion: reduce)").matches);
  } catch (e) { return false; }
}

function applyDayTint() {
  // Light wash from todayPlan() — Sat lime / Fri amber / Thu navy; else none
  let tint = "none";
  try {
    const plan = todayPlan();
    if (plan) {
      if (plan.d === 6) tint = "lime";
      else if (plan.d === 5) tint = "amber";
      else if (plan.d === 4) tint = "navy";
      else if (plan.key) tint = "cyan";
    }
  } catch (e) {}
  try {
    document.documentElement.setAttribute("data-tint", tint);
  } catch (e) {}
  return tint;
}

function applyEnvironment() {
  const env = resolveEnvironment();
  try {
    document.documentElement.setAttribute("data-env", env);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) {
      meta.setAttribute("content", env === "day" ? "#0e2f38" : "#050218");
    }
  } catch (e) {}
  applyDayTint();
  applyCamoClass();
  applyReactiveClass();
  return env;
}

function applyCamoClass() {
  const c = ensureCosmetics();
  const camo = c.camo || "default";
  try {
    if (camo && camo !== "default") document.documentElement.setAttribute("data-camo", camo);
    else document.documentElement.removeAttribute("data-camo");
  } catch (e) {}
}

function reactiveAllowed() {
  const c = ensureCosmetics();
  if (!c.reactive) return false;
  if (prefersReducedMotion()) return false;
  if (batteryLevel < 0.2) return false;
  return true;
}

function applyReactiveClass() {
  const root = document.documentElement;
  root.classList.remove("reactive-hot", "reactive-low");
  if (!reactiveAllowed()) {
    root.classList.add("reactive-low");
    return;
  }
  const hot = (view === "lift") || !!(state && state.live);
  if (hot) root.classList.add("reactive-hot");
}

function watchBattery() {
  if (batteryWatching) return;
  batteryWatching = true;
  try {
    if (navigator.getBattery) {
      navigator.getBattery().then(function(b) {
        batteryLevel = typeof b.level === "number" ? b.level : 1;
        applyReactiveClass();
        b.addEventListener("levelchange", function() {
          batteryLevel = typeof b.level === "number" ? b.level : 1;
          applyReactiveClass();
        });
      }).catch(function() {});
    }
  } catch (e) {}
}

/* Apple Health bridge — real when WKWebView injects PFHealth / pfHealth; null on Safari */
var healthSummaryCache = null;
var healthSummaryAt = 0;
var healthAuthAsked = false;

function hasHealthBridge() {
  try {
    if (window.PFHealth && window.PFHealth.available) return true;
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.pfHealth) return true;
  } catch (e) {}
  return false;
}

function healthPost(action, payload) {
  if (!hasHealthBridge()) {
    return Promise.resolve(null);
  }
  try {
    if (window.PFHealth && typeof window.PFHealth.post === "function") {
      return window.PFHealth.post(action, payload || {}).catch(function() { return null; });
    }
  } catch (e) {}
  return Promise.resolve(null);
}

function requestHealthAuth() {
  return healthPost("health.requestAuth", {}).then(function(r) {
    healthAuthAsked = true;
    if (r && r.ok) {
      try { state.healthConnected = true; persist(); } catch (e) {}
    }
    return r;
  });
}

function refreshHealthSummary(force) {
  if (!hasHealthBridge()) return Promise.resolve(null);
  var age = Date.now() - (healthSummaryAt || 0);
  if (!force && healthSummaryCache && age < 60000) return Promise.resolve(healthSummaryCache);
  return healthPost("health.getSummary", {}).then(function(r) {
    if (r && r.ok !== false) {
      healthSummaryCache = r;
      healthSummaryAt = Date.now();
      if (r.sleepHours != null && !sleepEntry(todayISO())) {
        setLastNightHours(Math.round(Number(r.sleepHours) * 100) / 100);
        ensureSleep()[todayISO()].src = "health";
        try { persist(); } catch (e) {}
      }
    }
    return healthSummaryCache;
  });
}

function writeWeightToHealth(lb, iso) {
  if (!hasHealthBridge()) return Promise.resolve(null);
  if (!state || !state.healthWriteWeight) return Promise.resolve(null);
  var n = Number(lb);
  if (!n || n < 50 || n > 600) return Promise.resolve(null);
  return healthPost("health.writeWeight", { lb: n, date: iso || null }).then(function(r) {
    return r;
  }).catch(function() { return null; });
}

function getHeartRate() {
  return healthSummaryCache && healthSummaryCache.heartRate != null ? healthSummaryCache.heartRate : null;
}
function getRestingHR() {
  return healthSummaryCache && healthSummaryCache.restingHR != null ? healthSummaryCache.restingHR : null;
}
function getHRV() {
  return healthSummaryCache && healthSummaryCache.hrv != null ? healthSummaryCache.hrv : null;
}
function getSleepSample() {
  if (healthSummaryCache && healthSummaryCache.sleepHours != null) return healthSummaryCache.sleepHours;
  return null;
}
function getStepsSample() {
  return healthSummaryCache && healthSummaryCache.steps != null ? healthSummaryCache.steps : null;
}
function getHealthMetric(key) {
  if (!healthSummaryCache) return null;
  return healthSummaryCache[key] != null ? healthSummaryCache[key] : null;
}

function healthMetricsCardHtml() {
  if (!hasHealthBridge() && !healthSummaryCache) return "";
  var hr = getHeartRate();
  var rhr = getRestingHR();
  var hrv = getHRV();
  var sleep = getSleepSample();
  var steps = getStepsSample();
  var energy = getHealthMetric("activeEnergy");
  var bits = [];
  if (hr != null) bits.push('<div><div class="lbl">HR</div><b>' + hr + '</b><small> bpm</small></div>');
  if (rhr != null) bits.push('<div><div class="lbl">Resting</div><b>' + rhr + '</b><small> bpm</small></div>');
  if (hrv != null) bits.push('<div><div class="lbl">HRV</div><b>' + hrv + '</b><small> ms</small></div>');
  if (sleep != null) bits.push('<div><div class="lbl">Sleep</div><b>' + sleep + '</b><small> h</small></div>');
  if (steps != null) bits.push('<div><div class="lbl">Steps</div><b>' + steps + '</b></div>');
  if (energy != null) bits.push('<div><div class="lbl">Active</div><b>' + energy + '</b><small> kcal</small></div>');
  if (!bits.length) {
    return '<div class="card mt"><div class="lbl">Apple Health</div><p class="sub" style="margin:0">Connected · pull summary or wait for samples.</p></div>';
  }
  return '<div class="card mt"><div class="lbl">Apple Health</div><div class="row" style="border:0;padding:8px 0 0;flex-wrap:wrap;gap:14px">' + bits.join("") + "</div></div>";
}

function healthConnectHtml() {
  var bridged = hasHealthBridge();
  var connected = !!(state && state.healthConnected);
  var html = '<div class="card mt">';
  html += '<div class="lbl">Apple Health</div>';

  } else {
    html += '<p class="sub" style="margin:0">Requires PF//TRACK iOS app. Safari cannot reach HealthKit — manual cues stay available.</p>';
  }
  html += "</div>";
  return html;
}

function setEnvironmentPreference(pref) {
  const c = ensureCosmetics();
  if (pref !== "auto" && pref !== "day" && pref !== "night") return;
  c.environmentPreference = pref;
  persist();
  applyEnvironment();
}

function setReactive(on) {
  const c = ensureCosmetics();
  c.reactive = !!on;
  persist();
  applyReactiveClass();
}

function equipCamo(id) {
  const c = ensureCosmetics();
  const item = CAMO_ITEMS.find(function(x) { return x.id === id; });
  if (!item) return;
  if (c.owned.indexOf(id) < 0) c.owned.push(id);
  c.camo = id;
  c.equipped.camo = id;
  persist();
  applyCamoClass();
  toast("Equipped · " + item.name + " · cosmetic only · no IAP yet");
}

function proteinRange() {
  const lbm = Number(state.stats.lbm) || 175;

}

function defaultMacrosFromLbm() {
  const lbm = Number(state && state.stats && state.stats.lbm) || 175;
  const proteinTarget = Math.round(lbm); // lower end of LBM range
  const fatTarget = Math.max(40, Math.round(lbm * 0.35));
  const calTarget = Math.round(lbm * 12);
  const carbsTarget = Math.max(50, Math.round((calTarget - proteinTarget * 4 - fatTarget * 9) / 4));
  return {
    calTarget: calTarget,
    proteinTarget: proteinTarget,
    carbsTarget: carbsTarget,
    fatTarget: fatTarget,
    cal: 0,
    protein: 0,
    carbs: 0,
    fat: 0
  };
}

function ensureMacros() {
  const base = defaultMacrosFromLbm();
  if (!state.macros || typeof state.macros !== "object") {
    state.macros = base;
  } else {
    const m = state.macros;
    ["calTarget","proteinTarget","carbsTarget","fatTarget","cal","protein","carbs","fat"].forEach(function(k) {
      if (m[k] == null || isNaN(Number(m[k]))) m[k] = base[k];
      else m[k] = Number(m[k]);
    });
    if (typeof m.date !== "string" || !m.date) m.date = todayISO();
  }
  return state.macros;
}

function greetingForHour(h) {

function activityStreak() {
  // Consecutive calendar days (ending today or yesterday) with a session or walk.
  const days = {};
  (state.sessions || []).forEach(function(s) {
    if (s && s.date) days[s.date] = 1;
  });
  (state.walks || []).forEach(function(w) {
    if (w && w.date) days[w.date] = 1;
  });
  let streak = 0;
  const cursor = new Date();
  // Allow streak to start from yesterday if today empty
  const today = todayISO();
  if (!days[today]) {
    cursor.setDate(cursor.getDate() - 1);
  }
  for (let i = 0; i < 365; i++) {
    const iso = isoFromDate(cursor);
    if (!days[iso]) {
      if (state.shield && state.shield.covered === iso) {
        streak++;
        cursor.setDate(cursor.getDate() - 1);
        continue;
      }
      break;
    }
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}

function clearLiveStorage() {
  try { sessionStorage.removeItem(LIVE_KEY); } catch (e) {}
}

function saveLive() {
  if (!state || !state.live) {
    clearLiveStorage();
    return;
  }
  try {
    sessionStorage.setItem(LIVE_KEY, JSON.stringify({
      savedAt: Date.now(),
      live: state.live
    }));
  } catch (e) {}
}

function loadLive() {
  try {
    const raw = sessionStorage.getItem(LIVE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || !parsed.live || !parsed.savedAt) return null;
    if (Date.now() - parsed.savedAt > LIVE_TTL_MS) {
      clearLiveStorage();
      return null;
    }
    return parsed.live;
  } catch (e) {
    return null;
  }
}

function load() {
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) {}
  let data = defaults();
  if (raw) {
    try {
      const parsed = JSON.parse(raw);

      if (!data.stats) data.stats = defaults().stats;
      if (data.stats.lbm == null) data.stats.lbm = 175;
      if (data.stats.bf == null || data.stats.bf === "") data.stats.bf = null;
      else data.stats.bf = Number(data.stats.bf);
      if (!data.lastWeights) data.lastWeights = {};
      if (!Array.isArray(data.sessions)) data.sessions = [];
      if (!Array.isArray(data.bodyweights)) data.bodyweights = [];
      if (!data.readyUp || typeof data.readyUp !== "object") data.readyUp = {};
      if (!Array.isArray(data.walks)) data.walks = [];
      if (typeof data.feetCookedWeek !== "string") data.feetCookedWeek = "";
      if (typeof data.hamWeirdWeek === "string") {
        /* already week-scoped */
      } else if (data.hamWeird === true) {
        data.hamWeirdWeek = weekStartISO();
      } else {
        data.hamWeirdWeek = "";
      }
      try { delete data.hamWeird; } catch (e) {}
      if (!data.sleepLog || typeof data.sleepLog !== "object" || Array.isArray(data.sleepLog)) data.sleepLog = {};
      if (!data.sleepGoal || typeof data.sleepGoal !== "object") data.sleepGoal = {hours: 7.5, wake: 360};
      if (data.sleepHours != null) data.sleepHours = Number(data.sleepHours);
      else data.sleepHours = null;
      if (typeof data.healthConnected !== "boolean") data.healthConnected = false;
      if (typeof data.healthWriteWeight !== "boolean") data.healthWriteWeight = false;
      if (typeof data.quietReminder !== "boolean") data.quietReminder = false;
      if (!data.shield || typeof data.shield !== "object") data.shield = {held: 0, covered: ""};
      else {
        data.shield.held = data.shield.held ? 1 : 0;
        data.shield.covered = typeof data.shield.covered === "string" ? data.shield.covered.slice(0, 10) : "";
      }
      if (!Array.isArray(data.recentPlates)) data.recentPlates = [];
      if (!Array.isArray(data.favPlates)) data.favPlates = [];
      data.favPlates = data.favPlates.filter(function(id) { return !!plateById(id); }).slice(0, 8);
      if (!Array.isArray(data.mealTemplates)) data.mealTemplates = [];
      data.mealTemplates = data.mealTemplates.filter(function(t) {
        return t && typeof t.id === "string" && typeof t.name === "string" && Array.isArray(t.items);
      }).slice(0, 3);
      if (data.plateSlot !== "work" && data.plateSlot !== "home" && data.plateSlot !== "after") data.plateSlot = "home";
      if (typeof data.haptics !== "boolean") data.haptics = true;
      if (typeof data.sound !== "boolean") data.sound = true;
      if (!Array.isArray(data.foodHistory)) data.foodHistory = [];
      if (data.food && data.food.date && !data.foodHistory.some(function(f){ return f.date === data.food.date; })) {
        data.foodHistory.unshift({
          date: data.food.date,
          work: !!data.food.work,
          home: !!data.food.home,
          after: !!data.food.after,
          rice: !!data.food.rice
        });
      }
      data.foodHistory = data.foodHistory.slice(0, 120);
      if (!data.dayNotes || typeof data.dayNotes !== "object" || Array.isArray(data.dayNotes)) data.dayNotes = {};
      data.pet = normalizePet(data.pet);
      data.cosmetics = normalizeCosmetics(data.cosmetics);
    } catch (e) {}
  }
  if (!data.dayNotes || typeof data.dayNotes !== "object" || Array.isArray(data.dayNotes)) data.dayNotes = {};
  data.pet = normalizePet(data.pet);
  data.cosmetics = normalizeCosmetics(data.cosmetics);
  state = data;
  ensureMacros();
  data.macros = state.macros;
  try { rollMacrosIfNewDay(); } catch (e) {}
  try { reconcileShield(); } catch (e) {}
  data.live = null;
  state = data;
  const resumed = loadLive();
  if (resumed && resumed.key && PROGRAMS[resumed.key] && Array.isArray(resumed.sets)) {
    state.live = resumed;
  }
  return state;
}

function audio() {
  if (!AC) {

  }
  if (AC && AC.state === "suspended") AC.resume();
  return AC;
}

function blip(freq, dur, type, vol) {
  if (!state || !state.sound) return;
  const ctx = audio();
  if (!ctx) return;
  try {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type || "square";
    o.frequency.value = freq;
    g.gain.value = vol != null ? vol : 0.04;
    o.connect(g); g.connect(ctx.destination);
    const t = ctx.currentTime;
    g.gain.setValueAtTime(g.gain.value, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.1));
    o.start(t); o.stop(t + (dur || 0.1) + 0.02);
  } catch (e) {}
}

function todayISO() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}

function weekStart() {
  const d = new Date();
  const day = d.getDay();
  const satOffset = (day + 1) % 7;
  d.setDate(d.getDate() - satOffset);
  d.setHours(0, 0, 0, 0);
  return d;
}

function parseLocalDate(iso) {
  const parts = String(iso || "").split("-");
  if (parts.length < 3) return new Date(NaN);
  return new Date(+parts[0], +parts[1] - 1, +parts[2]);
}

function isoFromDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}

function addMonths(date, n) {
  const d = new Date(date.getFullYear(), date.getMonth(), 1);
  d.setMonth(d.getMonth() + n);
  return d;
}

function planForISO(iso) {
  const dt = parseLocalDate(iso);
  if (isNaN(dt.getTime())) return null;
  const day = dt.getDay();
  return WEEK.find(function(w) { return w.d === day; }) || null;
}

function ensureFoodFor(iso) {
  if (!iso) return ensureFood();
  if (!Array.isArray(state.foodHistory)) state.foodHistory = [];
  let entry = state.foodHistory.find(function(f) { return f.date === iso; });
  if (!entry) {
    entry = {date: iso, work: false, home: false, after: false, rice: false, items: [], waterOz: 0};
    state.foodHistory.unshift(entry);
  }
  if (entry.rice == null) entry.rice = false;
  if (!Array.isArray(entry.items)) entry.items = [];
  if (entry.waterOz == null || isNaN(Number(entry.waterOz))) entry.waterOz = 0;
  state.foodHistory = state.foodHistory
    .sort(function(a, b) { return a.date < b.date ? 1 : -1; })
    .slice(0, 120);
  if (iso === todayISO()) state.food = entry;
  return entry;
}

function sessionsForISO(iso) {
  return (state.sessions || []).filter(function(s) { return s.date === iso; });
}

function bodyweightForISO(iso) {
  return (state.bodyweights || []).find(function(w) { return w.date === iso; }) || null;
}

function foodForISO(iso) {
  return (state.foodHistory || []).find(function(f) { return f.date === iso; }) || null;
}

function dayMarks(iso) {
  const sessions = sessionsForISO(iso);
  const lift = sessions.some(function(s) {
    return s.key && PROGRAMS[s.key];
  });
  const food = foodForISO(iso);
  const foodN = food ? ((food.work ? 1 : 0) + (food.home ? 1 : 0) + (food.after ? 1 : 0)) : 0;
  const walk = !!walkForDate(iso);
  const note = !!(state.dayNotes && state.dayNotes[iso] && String(state.dayNotes[iso]).trim());
  return {lift: lift, foodN: foodN, walk: walk, note: note};
}

function isFutureISO(iso) {

function isoInCurrentWeek(iso) {
  const start = weekStart();
  const dt = parseLocalDate(iso);
  if (isNaN(dt.getTime())) return false;
  const end = new Date(start);
  end.setDate(start.getDate() + 7);
  return dt >= start && dt < end;
}

function sessionsThisWeek() {

    return dt >= start;
  });

function didKeyThisWeek(key) {

}

function liftKeysClearedThisWeek() {
  const keys = ["upper-a", "lower-a", "upper-b", "lower-b"];

function walkForDate(iso) {

function walkThisWeekForDay(d) {
  const start = weekStart();
  const target = new Date(start);
  const orderIdx = WEEK_ORDER.indexOf(d);
  target.setDate(start.getDate() + (orderIdx < 0 ? 0 : orderIdx));
  const y = target.getFullYear();
  const m = String(target.getMonth() + 1).padStart(2, "0");
  const day = String(target.getDate()).padStart(2, "0");
  return walkForDate(y + "-" + m + "-" + day);
}


function weekStartISO() {

  const day = String(d.getDate()).padStart(2, "0");

}

function isFeetCooked() {
  if (state.feetCookedWeek && state.feetCookedWeek === weekStartISO()) return true;
  const start = weekStart();
  return (state.walks || []).some(function(w) {
    if (!w.feetCooked) return false;
    const dt = parseLocalDate(w.date);
    return dt >= start;
  });

function setFeetCooked(on) {

  if (!on) {
    const start = weekStart();
    (state.walks || []).forEach(function(w) {
      const dt = parseLocalDate(w.date);
      if (dt >= start) w.feetCooked = false;

function lastRepsFor(id) {
  for (let i = 0; i < (state.sessions || []).length; i++) {
    const s = state.sessions[i];
    if (!s.work) continue;
    for (let j = 0; j < s.work.length; j++) {
      if (s.work[j].id !== id) continue;
      const sets = (s.work[j].sets || []).filter(function(x) { return x.done && !x.skipped; });
      if (sets.length) return sets.map(function(x) { return x.r; }).join("/");
      break;
    }
  }
  return "—";
}

function fuelWindowMeta() {
  const now = new Date();
  const mins = now.getHours() * 60 + now.getMinutes();
  const start = 14 * 60;
  const end = 20 * 60;
  let pct = 0;
  let phase = "before";
  if (mins < start) {
    pct = 0;
    phase = "before";
  } else if (mins >= end) {
    pct = 100;
    phase = "after";
  } else {
    pct = Math.round((mins - start) / (end - start) * 100);
    phase = "open";
  }
  return {pct: pct, phase: phase, mins: mins};
}

function movementFullySkipped(sets) {
  return (sets || []).length > 0 && (sets || []).every(function(s) { return s.skipped; });
}

function advancePastPreSkipped() {
  if (!state.live) return;
  const live = state.live;
  const items = PROGRAMS[live.key].items;
  while (live.i < items.length && movementFullySkipped(live.sets[live.i])) {
    live.i += 1;
    live.set = 0;
  }
}

function resolveMovementId(raw) {
  const k = String(raw || "").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  if (!k) return null;
  if (MOVEMENT_ALIASES[k]) return MOVEMENT_ALIASES[k];
  // try without accents already stripped
  const keys = Object.keys(MOVEMENT_ALIASES);
  for (let i = 0; i < keys.length; i++) {
    const ak = keys[i].normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    if (ak === k) return MOVEMENT_ALIASES[keys[i]];
  }
  // known program ids
  const ids = ["press","lat","row","raise","rear","tri","curlbi","chest","lpress","abd","ext","curl","calf"];
  if (ids.indexOf(k) >= 0) return k;
  return null;
}

function formatPFTRACK(session) {
  if (!session) return "";
  let lines = ["PFTRACK"];
  if (session.key) lines.push("key: " + session.key);
  (session.work || []).forEach(function(w) {
    const sets = (w.sets || []).filter(function(x) { return x.done && !x.skipped; });
    if (!sets.length) return;
    lines.push(w.id + " " + sets.map(function(s) { return s.w + "x" + s.r; }).join(" "));
  });
  if (session.diff != null) lines.push("diff: " + session.diff);
  if (session.sore != null) lines.push("sore: " + session.sore);
  if (session.feet != null) lines.push("feet: " + session.feet);
  return lines.join("\n");
}

function parsePFTRACK(text) {
  const raw = String(text || "").trim();
  if (!raw) return {ok: false, error: "Empty"};
  const lines = raw.split(/\r?\n/).map(function(l) { return l.trim(); }).filter(Boolean);
  let start = 0;
  if (/^pftrack$/i.test(lines[0])) start = 1;
  const pins = {};
  let key = null;
  let log = false;
  let meta = {};
  for (let i = start; i < lines.length; i++) {
    const line = lines[i];
    const metaM = line.match(/^(key|diff|sore|feet|log)\s*:\s*(.+)$/i);
    if (metaM) {
      const mk = metaM[1].toLowerCase();
      const mv = metaM[2].trim();
      if (mk === "key") key = mv.toLowerCase();
      else if (mk === "log") log = /^(1|true|yes|y)$/i.test(mv);
      else meta[mk] = mv;
      continue;
    }
    const m = line.match(/^(.+?)\s+((?:\d+(?:\.\d+)?[xX×]\d+)(?:\s+\d+(?:\.\d+)?[xX×]\d+)*)$/);
    if (!m) continue;
    const id = resolveMovementId(m[1]);
    if (!id) continue;
    const pairs = m[2].split(/\s+/).map(function(p) {
      const parts = p.split(/[xX×]/);
      return {w: parseFloat(parts[0]), r: parseInt(parts[1], 10)};
    }).filter(function(p) { return p.w > 0 && p.r > 0; });
    if (!pairs.length) continue;
    pins[id] = pairs;
  }
  return {ok: true, key: key, pins: pins, log: log, meta: meta};
}

function applyPFTRACK(parsed) {
  if (!parsed || !parsed.ok) return {updated: 0};
  let updated = 0;
  const work = [];
  Object.keys(parsed.pins).forEach(function(id) {
    const pairs = parsed.pins[id];
    const last = pairs[pairs.length - 1];
    state.lastWeights[id] = last.w;
    updated++;
    // readyUp if both sets 15+
    if (pairs.length >= 2 && pairs[0].r >= 15 && pairs[1].r >= 15 && pairs[0].w === pairs[1].w) {
      // leave readyUp detection to next complete session; pins only here
    }
    work.push({
      id: id,
      name: id,
      sets: pairs.map(function(p) { return {w: p.w, r: p.r, done: true, skipped: false}; })
    });
  });
  if (parsed.log && work.length) {
    const key = parsed.key && PROGRAMS[parsed.key] ? parsed.key : null;
    const name = key ? PROGRAMS[key].name : "Uplink session";
    // enrich names from program if possible
    if (key) {
      work.forEach(function(w) {
        const ex = PROGRAMS[key].items.find(function(x) { return x.id === w.id; });
        if (ex) w.name = ex.name;
      });
    } else {
      Object.keys(PROGRAMS).forEach(function(k) {
        PROGRAMS[k].items.forEach(function(ex) {
          work.forEach(function(w) { if (w.id === ex.id && w.name === w.id) w.name = ex.name; });
        });
      });
    }
    state.sessions.unshift({
      date: todayISO(),
      key: key || "uplink",
      name: name,
      minutes: 1,
      reason: "uplink",
      work: work,
      diff: parsed.meta.diff,
      sore: parsed.meta.sore,
      feet: parsed.meta.feet
    });
    if (state.sessions.length > 60) state.sessions.length = 60;
  }
  persist();
  return {updated: updated, logged: !!parsed.log};
}

function movementName(id) {
  const keys = Object.keys(PROGRAMS);
  for (let i = 0; i < keys.length; i++) {
    const items = PROGRAMS[keys[i]].items;
    for (let j = 0; j < items.length; j++) {
      if (items[j].id === id) return items[j].name;
    }
  }
  return id;
}

function canonicalDayKey(raw) {
  const k = String(raw || "").trim().toLowerCase().replace(/_/g, "-").replace(/\s+/g, " ");
  if (!k) return null;
  if (PROGRAMS[k]) return k;
  if (BACKFILL_KEY_ALIASES[k]) return BACKFILL_KEY_ALIASES[k];
  return null;
}

function readLooseNumber(v) {
  if (typeof v === "number" && isFinite(v)) return v;
  const m = String(v == null ? "" : v).replace(/,/g, "").match(/-?\d+(?:\.\d+)?/);
  return m ? parseFloat(m[0]) : NaN;
}

function normalizeISO(raw) {
  const m = String(raw || "").trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (!m) return "";
  return m[1] + "-" + String(m[2]).padStart(2, "0") + "-" + String(m[3]).padStart(2, "0");
}

function validBackfillISO(iso) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return false;
  const dt = parseLocalDate(iso);
  if (isNaN(dt.getTime())) return false;
  if (isoFromDate(dt) !== iso) return false;
  const today = parseLocalDate(todayISO());
  const ahead = (dt.getTime() - today.getTime()) / 86400000;
  if (ahead > 14) return false;
  if (dt.getFullYear() < 2020) return false;
  return true;
}

function extractBackfillJson(text) {
  let s = String(text || "").replace(/^\uFEFF/, "").trim();
  if (!s) return "";
  const fence = s.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if (fence) s = fence[1].trim();
  const obj = s.indexOf("{");
  const arr = s.indexOf("[");
  let cut = -1;
  if (obj >= 0 && (arr < 0 || obj < arr)) cut = obj;
  else if (arr >= 0) cut = arr;
  if (cut > 0) s = s.slice(cut);
  return s.trim();
}

function parseLooseJson(s) {
  try { return JSON.parse(s); } catch (e) {}
  try { return JSON.parse(s.replace(/,\s*([}\]])/g, "$1")); } catch (e2) {}
  return null;
}

function readBackfillSet(raw) {
  if (typeof raw === "string") {
    const m = String(raw).trim().match(/^(\d+(?:\.\d+)?)\s*[xX×]\s*(\d+)/);
    if (!m) return null;
    raw = {pin: parseFloat(m[1]), reps: parseInt(m[2], 10)};
  }
  if (!raw || typeof raw !== "object") return null;
  const pin = readLooseNumber(raw.pin != null ? raw.pin : (raw.w != null ? raw.w : raw.weight));
  const reps = readLooseNumber(raw.reps != null ? raw.reps : (raw.r != null ? raw.r : raw.rep));
  if (!(pin > 0) || !(reps > 0)) return null;
  if (pin > 800 || reps > 40) return null;
  const set = {w: Math.round(pin * 10) / 10, r: Math.round(reps), done: true, skipped: false};
  if (raw.clean === true || raw.clean === false || raw.clean === 1 || raw.clean === 0) set.clean = !!raw.clean;
  return set;
}

function insertSessionByDate(session) {
  let idx = state.sessions.findIndex(function(s) { return s.date < session.date; });
  if (idx < 0) state.sessions.push(session);
  else state.sessions.splice(idx, 0, session);
  while (state.sessions.length > 60) {
    let oldest = 0;
    for (let i = 1; i < state.sessions.length; i++) {
      if (state.sessions[i].date < state.sessions[oldest].date) oldest = i;
      else if (state.sessions[i].date === state.sessions[oldest].date && i > oldest) oldest = i;
    }
    const dropped = state.sessions.splice(oldest, 1)[0];
    if (dropped === session) return false;
  }
  return true;
}

function logCatchupSession(iso, key, opts) {
  opts = opts || {};
  if (!PROGRAMS[key]) return {ok: false};
  if (isFutureISO(iso) && !opts.allowFuture) return {ok: false};
  if ((state.sessions || []).some(function(s) { return s.date === iso && s.key === key; })) {
    return {ok: false, duplicate: true};
  }
  const p = PROGRAMS[key];
  const work = opts.work || p.items.map(function(ex) {
    const w = state.lastWeights[ex.id] != null ? state.lastWeights[ex.id] : 10;
    return {
      id: ex.id,
      name: ex.name,
      sets: [
        {w: w, r: 10, done: true, skipped: false},
        {w: w, r: 10, done: true, skipped: false}
      ]
    };
  });
  const session = {
    date: iso,
    key: key,
    name: p.name,
    minutes: opts.minutes || 1,
    reason: "catch-up",
    work: work
  };
  if (opts.note) session.note = String(opts.note).slice(0, 280);
  if (opts.byDate) {
    if (!insertSessionByDate(session)) return {ok: false};
  } else {
    state.sessions.unshift(session);
    if (state.sessions.length > 60) state.sessions.length = 60;
  }
  // Do NOT award embers for catch-up / backfill
  return {ok: true};
}

function backfillTouchPins(work, iso) {
  (work || []).forEach(function(w) {
    const sets = (w.sets || []).filter(function(x) { return x.done && !x.skipped && x.w > 0; });
    if (!sets.length) return;
    let later = false;
    (state.sessions || []).forEach(function(s) {
      if (!(s.date > iso)) return;
      (s.work || []).forEach(function(sw) {
        if (sw.id === w.id) later = true;
      });
    });
    if (later) return;
    state.lastWeights[w.id] = sets[sets.length - 1].w;
  });
}

function appendDayNote(iso, text) {
  const bit = String(text || "").trim();
  if (!bit) return false;
  if (!state.dayNotes || typeof state.dayNotes !== "object" || Array.isArray(state.dayNotes)) state.dayNotes = {};
  const cur = String(state.dayNotes[iso] || "").trim();
  if (cur && cur.indexOf(bit) >= 0) return false;
  state.dayNotes[iso] = cur ? (cur + "\n" + bit) : bit;
  return true;
}

function addBackfillFood(iso, item) {
  const name = String(item.name || "").trim().slice(0, 80);
  if (!name) return false;
  const cal = Math.max(0, Math.min(5000, Math.round(Number(item.cal) || 0)));
  const protein = Math.max(0, Math.min(400, Math.round(Number(item.protein) || 0)));
  const carbs = Math.max(0, Math.min(800, Math.round(Number(item.carbs) || 0)));
  const fat = Math.max(0, Math.min(400, Math.round(Number(item.fat) || 0)));
  const entry = ensureFoodFor(iso);
  const dup = (entry.items || []).some(function(it) {
    return String(it.name) === name && Math.round(Number(it.cal) || 0) === cal && Math.round(Number(it.protein) || 0) === protein;
  });
  if (dup) return false;
  entry.items.push({
    id: "backfill",
    name: name,
    qty: 1,
    baseCal: cal,
    baseProtein: protein,
    baseCarbs: carbs,
    baseFat: fat,
    cal: cal,
    protein: protein,
    carbs: carbs,
    fat: fat
  });
  if (!entry.dayMacros) entry.dayMacros = {cal: 0, protein: 0, carbs: 0, fat: 0};
  entry.dayMacros.cal += cal;
  entry.dayMacros.protein += protein;
  entry.dayMacros.carbs += carbs;
  entry.dayMacros.fat += fat;
  const slot = (item.slot === "work" || item.slot === "after") ? item.slot : "home";
  entry[slot] = true;
  if (iso === todayISO()) {
    const m = ensureMacros();
    m.cal += cal;
    m.protein += protein;
    m.carbs += carbs;
    m.fat += fat;
    entry.dayMacros = {cal: m.cal, protein: m.protein, carbs: m.carbs, fat: m.fat};
  }
  return true;
}

function mergeBackfillWater(iso, oz) {
  const add = Math.max(0, Math.min(200, Math.round(Number(oz) || 0)));
  if (!add) return false;
  const entry = ensureFoodFor(iso);
  const cur = Number(entry.waterOz) || 0;
  const next = Math.max(0, Math.min(200, cur + add));
  if (next === cur) return false;
  entry.waterOz = next;
  return true;
}

function mergeBackfillWalk(iso, mins) {
  const minutes = Math.max(1, Math.min(180, Math.round(Number(mins) || 0)));
  if (!minutes) return false;
  if (!Array.isArray(state.walks)) state.walks = [];
  const existing = state.walks.findIndex(function(w) { return w.date === iso; });
  if (existing >= 0) {
    if (Number(state.walks[existing].minutes) === minutes) return false;
    state.walks[existing].minutes = minutes;
    return true;
  }
  state.walks.unshift({date: iso, minutes: minutes, feetCooked: false});
  if (state.walks.length > 120) state.walks.length = 120;
  return true;
}

function mergeBackfillScale(iso, lb) {
  const n = Math.round(Number(lb) * 10) / 10;
  if (!n || n < 50 || n > 600) return false;
  if (!Array.isArray(state.bodyweights)) state.bodyweights = [];
  const idx = state.bodyweights.findIndex(function(w) { return w.date === iso; });
  if (idx >= 0) {
    if (state.bodyweights[idx].lb === n) return false;
    state.bodyweights[idx] = {date: iso, lb: n};
  } else {
    state.bodyweights.unshift({date: iso, lb: n});
  }
  state.bodyweights.sort(function(a, b) { return a.date < b.date ? 1 : -1; });
  if (state.bodyweights.length > 90) state.bodyweights.length = 90;
  if (iso === todayISO() || !state.stats.wt) state.stats.wt = state.bodyweights[0].lb;
  return true;
}

function backfillSetsAreMovements(arr) {
  if (!Array.isArray(arr) || !arr.length) return false;
  return arr.every(function(mv) {
    if (typeof mv === "string") return true;
    if (!mv || typeof mv !== "object" || Array.isArray(mv)) return false;
    if (Array.isArray(mv.sets)) return true;
    if (mv.id || mv.name || mv.movement) return true;
    return false;
  });
}

function backfillMovementList(day, workout) {
  if (workout && Array.isArray(workout.movements) && workout.movements.length) return workout.movements;
  if (workout && Array.isArray(workout.work) && workout.work.length) return workout.work;
  if (backfillSetsAreMovements(day.sets)) return day.sets;
  if (Array.isArray(day.movements) && day.movements.length) return day.movements;
  return [];
}

function normalizeBackfillDay(day) {
  if (!day || typeof day !== "object" || Array.isArray(day)) return null;
  const iso = normalizeISO(day.date || day.iso || "");
  if (!validBackfillISO(iso)) return null;
  const plan = planForISO(iso);
  const bits = [];
  const notes = [];
  let session = null;

  const restRaw = day.rest != null ? day.rest : day.restNote;
  if (typeof restRaw === "string" && restRaw.trim()) notes.push("Rest · " + restRaw.trim().slice(0, 240));
  else if (restRaw === true) notes.push("Rest.");

  const workout = (day.workout && typeof day.workout === "object" && !Array.isArray(day.workout)) ? day.workout : null;
  let keySource = "";
  if (workout) keySource = String(workout.key || workout.day || workout.program || "").trim();
  else if (typeof day.workout === "string") keySource = day.workout.trim();
  if (!keySource && day.key != null && typeof day.key !== "object") keySource = String(day.key).trim();
  let key = canonicalDayKey(keySource);
  // A bad explicit key must not inherit the weekday program.
  if (!key && !keySource && plan && plan.key) key = plan.key;
  if (typeof day.workout === "string" && day.workout.trim() && !canonicalDayKey(day.workout)) {
    notes.push(day.workout.trim().slice(0, 240));
  }
  const movements = backfillMovementList(day, workout);
  const liftIntent = !!(workout || (typeof day.workout === "string" && day.workout.trim()) || movements.length);
  if (liftIntent) {
    const unmatched = [];
    const work = [];
    movements.forEach(function(mv) {
      if (!mv) return;
      if (typeof mv === "string") {
        const idOnly = resolveMovementId(mv);
        if (!idOnly) unmatched.push(mv);
        else unmatched.push(movementName(idOnly));
        return;
      }
      if (typeof mv !== "object") return;
      const label = String(mv.name || mv.id || mv.movement || "").trim();
      // An unknown id (for example "face") must not fall through to the name
      // and become a program machine.
      let id = null;
      if (mv.id != null && String(mv.id).trim()) id = resolveMovementId(mv.id);
      else id = resolveMovementId(mv.name || mv.movement || "");
      const sets = [];
      (Array.isArray(mv.sets) ? mv.sets : []).forEach(function(s) {
        const set = readBackfillSet(s);
        if (set) sets.push(set);
      });
      if (!id) {
        if (label) {
          unmatched.push(label + (sets.length ? " " + sets.map(function(s) { return s.w + "×" + s.r; }).join(" ") : ""));
        }
        return;
      }
      if (!sets.length) {
        unmatched.push(label || movementName(id));
        return;
      }
      // Stored sessions use a variable-length sets array. Live logging is 2 sets;
      // backfill keeps every parsed set so extras are not dropped.
      work.push({id: id, name: movementName(id), sets: sets});
    });
    if (unmatched.length) notes.push("Unmatched · " + unmatched.join("; ").slice(0, 800));
    const wnote = (workout && workout.note) ? String(workout.note).trim().slice(0, 240) : "";
    if (key && work.length) {
      const dup = (state.sessions || []).some(function(s) { return s.date === iso && s.key === key; });
      if (dup) {
        bits.push("session already logged");
        if (wnote) notes.push(wnote);
      } else {
        const minutesSrc = (workout && workout.minutes != null) ? workout.minutes : day.minutes;
        let minutes = Math.round(readLooseNumber(minutesSrc));
        if (!minutes || minutes < 1) minutes = 1;
        if (minutes > 180) minutes = 180;
        session = {key: key, minutes: minutes, note: wnote, work: work};
        const shortName = String(PROGRAMS[key].name).split("—")[0].trim();
        bits.push(shortName + " · " + work.length + " movement" + (work.length === 1 ? "" : "s") + " · no embers");
      }
    } else if (work.length && !key) {
      notes.push("Not a lift day · " + work.map(function(w) { return w.name; }).join(", "));
      bits.push("off-day lifts kept as a note");
    } else if (wnote) {
      notes.push(wnote);
    }
  }

  const foodsIn = Array.isArray(day.food) ? day.food : (Array.isArray(day.foods) ? day.foods : (day.food && typeof day.food === "object" ? [day.food] : []));
  const foods = [];
  foodsIn.forEach(function(f) {
    if (!f || typeof f !== "object") return;
    const name = String(f.name || f.item || "").trim();
    if (!name) return;
    const cal = readLooseNumber(f.cal != null ? f.cal : f.calories);
    const protein = readLooseNumber(f.protein != null ? f.protein : f.p);
    if (isNaN(cal) || isNaN(protein) || cal < 0 || protein < 0) return;
    let slot = String(f.slot || f.meal || "home").toLowerCase();
    if (slot === "snack") slot = "after";
    if (slot !== "work" && slot !== "home" && slot !== "after") slot = "home";
    foods.push({
      name: name.slice(0, 80),
      cal: Math.min(5000, Math.round(cal)),
      protein: Math.min(400, Math.round(protein)),
      carbs: Math.min(800, Math.max(0, Math.round(readLooseNumber(f.carbs) || 0))),
      fat: Math.min(400, Math.max(0, Math.round(readLooseNumber(f.fat) || 0))),
      slot: slot
    });
  });
  if (foods.length) bits.push("+" + foods.length + " food");

  let waterOz = null;
  const waterRaw = day.waterOz != null ? day.waterOz : (day.water != null ? day.water : day.oz);
  if (waterRaw != null && waterRaw !== "") {
    const oz = Math.round(readLooseNumber(waterRaw));
    if (oz > 0) {
      waterOz = Math.min(200, oz);
      bits.push("water +" + waterOz + " oz");
    }
  }

  let walkMinutes = null;
  const walkRaw = day.walkMinutes != null ? day.walkMinutes : (day.walkMin != null ? day.walkMin : day.walk);
  if (walkRaw != null && walkRaw !== "" && typeof walkRaw !== "boolean") {
    const mins = Math.round(readLooseNumber(typeof walkRaw === "object" ? walkRaw.minutes : walkRaw));
    if (mins > 0) {
      walkMinutes = Math.min(180, mins);
      bits.push("walk " + walkMinutes + " min");
    }
  }

  let scale = null;
  const scaleRaw = day.scale != null ? day.scale : (day.weight != null ? day.weight : day.lb);
  if (scaleRaw != null && scaleRaw !== "" && typeof scaleRaw !== "boolean") {
    const lb = Math.round(readLooseNumber(typeof scaleRaw === "object" ? (scaleRaw.lb != null ? scaleRaw.lb : scaleRaw.weight) : scaleRaw) * 10) / 10;
    if (lb >= 50 && lb <= 600) {
      scale = lb;
      bits.push("scale " + scale);
    }
  }

  const noteRaw = day.note != null ? day.note : day.dayNote;
  if (typeof noteRaw === "string" && noteRaw.trim()) notes.push(noteRaw.trim().slice(0, 500));
  if (notes.length) bits.push("note");

  const actionable = !!(session || foods.length || waterOz != null || walkMinutes != null || scale != null || notes.length || bits.length);
  if (!actionable) return null;
  return {
    iso: iso,
    title: iso + (plan ? " · " + plan.short : ""),
    bits: bits.length ? bits : ["nothing new"],
    session: session,
    foods: foods,
    waterOz: waterOz,
    walkMinutes: walkMinutes,
    scale: scale,
    notes: notes
  };
}

function planBackfill(text) {
  const raw = extractBackfillJson(text);
  if (!raw) return {ok: false, error: "Paste the JSON first."};
  const parsed = parseLooseJson(raw);
  if (parsed == null || typeof parsed !== "object") return {ok: false, error: "That is not JSON."};
  let days = null;
  if (Array.isArray(parsed)) days = parsed;
  else if (Array.isArray(parsed.days)) days = parsed.days;
  else if (parsed.date || parsed.iso) days = [parsed];
  if (!days) return {ok: false, error: "Need a days list with YYYY-MM-DD dates."};
  if (!days.length) return {ok: false, error: "Nothing to backfill."};
  const planned = [];
  let badDate = false;
  days.forEach(function(day) {
    if (!day || typeof day !== "object" || Array.isArray(day)) { badDate = true; return; }
    const iso = normalizeISO(day.date || day.iso || "");
    if (!iso || !validBackfillISO(iso)) {
      if (day.date || day.iso) badDate = true;
      else badDate = true;
      return;
    }
    const norm = normalizeBackfillDay(day);
    if (norm) planned.push(norm);
  });
  if (!planned.length) {
    return {ok: false, error: badDate ? "Need a days list with YYYY-MM-DD dates." : "Nothing to backfill."};
  }
  return {ok: true, days: planned};
}

function applyBackfill(days) {
  let n = 0;
  (days || []).forEach(function(day) {
    let wrote = false;
    if (day.session) {
      backfillTouchPins(day.session.work, day.iso);
      const res = logCatchupSession(day.iso, day.session.key, {
        work: day.session.work,
        minutes: day.session.minutes,
        note: day.session.note,
        byDate: true,
        allowFuture: true
      });
      if (res.ok) wrote = true;
    }
    (day.foods || []).forEach(function(f) {
      if (addBackfillFood(day.iso, f)) wrote = true;
    });
    if (day.waterOz != null && mergeBackfillWater(day.iso, day.waterOz)) wrote = true;
    if (day.walkMinutes != null && mergeBackfillWalk(day.iso, day.walkMinutes)) wrote = true;
    if (day.scale != null && mergeBackfillScale(day.iso, day.scale)) wrote = true;
    (day.notes || []).forEach(function(note) {
      if (appendDayNote(day.iso, note)) wrote = true;
    });
    if (wrote) n++;
  });
  return n;
}

function xp() {
  return state.sessions.reduce(function(n, s) {
    const done = (s.work || []).reduce(function(a, w) {
      return a + (w.sets || []).filter(function(x) { return x.done && !x.skipped; }).length;
    }, 0);
    return n + done * 5 + 10;
  }, 0);
}

function level() {
  return Math.floor(xp() / 40) + 1;
}

function xpInto() {
  return xp() % 40;
}

function todayPlan() {
  const d = new Date().getDay();
  return WEEK.find(function(w) { return w.d === d; });
}


function defaultPet() {
  return {
    ember: 0,
    owned: ["scale_moss", "horn_neon"],
    equipped: {scale: "scale_moss", horn: "horn_neon", extras: []},
    lastSeenLevel: 1,
    celebrateUntil: 0,
    fullWeekAwarded: ""
  };
}

function normalizePet(raw) {
  const d = defaultPet();
  if (!raw || typeof raw !== "object") return d;
  const p = Object.assign({}, d, raw);
  if (!Array.isArray(p.owned)) p.owned = d.owned.slice();
  ["scale_moss", "horn_neon"].forEach(function(id) {
    if (p.owned.indexOf(id) < 0) p.owned.push(id);
  });
  if (!p.equipped || typeof p.equipped !== "object") p.equipped = Object.assign({}, d.equipped);
  if (!p.equipped.scale) p.equipped.scale = "scale_moss";
  if (!p.equipped.horn) p.equipped.horn = "horn_neon";
  if (!Array.isArray(p.equipped.extras)) p.equipped.extras = [];
  p.ember = Math.max(0, Number(p.ember) || 0);
  p.lastSeenLevel = Math.max(1, Number(p.lastSeenLevel) || 1);
  p.celebrateUntil = Number(p.celebrateUntil) || 0;
  p.fullWeekAwarded = typeof p.fullWeekAwarded === "string" ? p.fullWeekAwarded : "";
  // Old builds stored a Date → JSON UTC string; never equals local weekStartISO()
  if (p.fullWeekAwarded.indexOf("T") >= 0) p.fullWeekAwarded = "";
  return p;
}

function ensurePet() {
  if (!state.pet) state.pet = defaultPet();
  else state.pet = normalizePet(state.pet);
  return state.pet;
}

function petStage() {
  const lv = level();
  for (let i = 0; i < PET_STAGES.length; i++) {
    const s = PET_STAGES[i];
    if (lv >= s.min && lv <= s.max) return s;
  }
  return PET_STAGES[PET_STAGES.length - 1];
}

function petItem(id) {

}

function maybeFlagCelebration() {
  const pet = ensurePet();
  const lv = level();
  if (lv > pet.lastSeenLevel) {
    pet.celebrateUntil = Date.now() + 2400;
    pet.lastSeenLevel = lv;
    return true;
  }
  pet.lastSeenLevel = Math.max(pet.lastSeenLevel, lv);
  return false;
}

function awardSessionEmbers() {
  const pet = ensurePet();
  let gained = EMBER_PER_SESSION;
  let bonus = 0;
  const ws = weekStartISO();
  if (liftKeysClearedThisWeek() >= 4 && pet.fullWeekAwarded !== ws) {
    bonus = EMBER_FULL_WEEK_BONUS;
    pet.fullWeekAwarded = ws;
  }
  pet.ember += gained + bonus;
  if (!state.shield || typeof state.shield !== "object") state.shield = {held: 0, covered: ""};
  let shield = false;
  if (!state.shield.held) {
    state.shield.held = 1;
    shield = true;
  }
  maybeFlagCelebration();
  try { maybeEarnWeekCamo(); } catch (e) {}
  return {gained: gained, bonus: bonus, total: pet.ember, shield: shield};
}

function buyOrEquipPet(id) {
  const pet = ensurePet();
  const it = petItem(id);
  if (!it) return;
  const owned = pet.owned.indexOf(id) >= 0;
  if (!owned) {
    if (pet.ember < it.cost) { toast("Need more embers"); return; }
    pet.ember -= it.cost;
    pet.owned.push(id);
    if (it.slot === "extra") {
      if (pet.equipped.extras.indexOf(id) < 0) pet.equipped.extras.push(id);
    } else {
      pet.equipped[it.slot] = id;
    }
    sfxConfirm();
    buzz(30);
    toast("Unlocked · " + it.name);
  } else if (it.slot === "extra") {
    const idx = pet.equipped.extras.indexOf(id);
    if (idx >= 0) pet.equipped.extras.splice(idx, 1);
    else pet.equipped.extras.push(id);
    sfxTap();
  } else {
    pet.equipped[it.slot] = id;
    sfxTap();
  }
  persist();
  renderPetWidget();
  const panel = document.getElementById("pet-panel");
  if (panel && !panel.hidden) {
    panel.innerHTML = petPanelHtml();
    applyPetPalette(document.getElementById("petHeroArt"));
    bindPetPanel();
  }
}

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function isWorkDay(d) {
  return d === 1 || d === 5;
}

function toast(msg, opts) {
  toastMsg = msg;
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function() {
    toastMsg = "";
    const el = document.getElementById("toastEl");
    if (el) el.remove();
  }, 2200);
  let el = document.getElementById("toastEl");
  if (!el) {
    el = document.createElement("div");
    el.id = "toastEl";
    document.body.appendChild(el);
  }
  el.className = "toast" + (opts && opts.top ? " top" : "");
  el.textContent = msg;
}

function clearUndo() {
  undoSnapshot = null;
  if (undoTimer) { clearTimeout(undoTimer); undoTimer = null; }
  const el = document.getElementById("undoGhost");
  if (el) el.remove();
}

function showUndoGhost() {
  let el = document.getElementById("undoGhost");

    el.id = "undoGhost";
    el.className = "undoGhost";
    document.body.appendChild(el);
  }

  const btn = document.getElementById("undoBtn");
  if (btn) btn.onclick = function() { undoLastSet(); };
}

function restRemaining() {
  if (!state.live || !state.live.restUntil) return 0;
  return Math.max(0, Math.ceil((state.live.restUntil - Date.now()) / 1000));
}

function restTotal() {
  if (state.live && state.live.restSpan) return state.live.restSpan;
  if (!state.live) return 75;
  const ex = PROGRAMS[state.live.key].items[state.live.i];
  return restSecFor(ex.id);
}

function stopRestTick() {
  if (restTickHandle) { clearInterval(restTickHandle); restTickHandle = null; }
}

function patchRestUI() {
  const rem = restRemaining();
  const num = document.querySelector(".ringwrap .num");
  const fg = document.querySelector(".ring circle.fg");
  if (!num || !fg) return false;
  if (rem <= 0) return false;
  num.textContent = String(rem);
  const totalRest = restTotal();
  const off = CIRC * (1 - rem / Math.max(1, totalRest));
  fg.setAttribute("stroke-dashoffset", off.toFixed(1));
  return true;
}

function ensureRestTick() {
  stopRestTick();
  if (!state.live || !state.live.restUntil) return;
  if (document.visibilityState !== "visible") return;
  restTickHandle = setInterval(function() {
    if (!state.live || !state.live.restUntil) {
      stopRestTick();
      return;
    }
    const rem = restRemaining();
    if (rem <= 0) {
      state.live.restUntil = 0;
      saveLive();
      stopRestTick();
      blip(1046, 0.13, "triangle", 0.05);
      setTimeout(function() { blip(1568, 0.16, "triangle", 0.05); }, 150);
      buzz([40, 60, 40]);
      if (view === "lift") render();
      return;
    }
    // Patch ring in place — no full render / no pet SVG rebuild while resting
    if (view === "lift" && !patchRestUI()) render();
  }, 250);
}

function startRest() {
  if (!state.live) return;
  const ex = PROGRAMS[state.live.key].items[state.live.i];
  const sec = restSecFor(ex.id);
  state.live.restSpan = sec;
  state.live.restUntil = Date.now() + sec * 1000;
  saveLive();
  ensureRestTick();
  render();
}

function clearRest() {
  if (state.live) state.live.restUntil = 0;
  stopRestTick();
}

function applyReadyUp(items) {
  return items.map(function(ex) {
    let w = state.lastWeights[ex.id] != null ? state.lastWeights[ex.id] : 10;
    // Apply +5 to live sets only; consume readyUp flag on first completed set
    if (state.readyUp && state.readyUp[ex.id]) {
      w = w + 5;
    }
    return [
      {w: w, r: 12, done: false, skipped: false},
      {w: w, r: 12, done: false, skipped: false}
    ];
  });
}

function doStartWorkout(key) {
  const p = PROGRAMS[key];
  if (!p) return;
  clearUndo();
  const sets = applyReadyUp(p.items);
  if (key === "lower-b") {
    p.items.forEach(function(ex, idx) {
      if (ex.id === "calf" && isFeetCooked()) {
        sets[idx].forEach(function(s) { s.skipped = true; s.done = false; });
      }
      if (ex.id === "curl" && isHamWeird()) {
        sets[idx].forEach(function(s) { s.skipped = true; s.done = false; });
      }
    });
  }
  state.live = {
    key: key,
    date: todayISO(),
    i: 0,
    set: 0,
    restUntil: 0,
    restSpan: 0,
    combo: 0,
    started: Date.now(),
    sets: sets
  };
  advancePastPreSkipped();
  if (state.live.i >= p.items.length) {
    // everything pre-skipped — still open empty? finish as partial
    state.exitReason = "";
    persist();
    finishWorkout("partial");
    return;
  }
  state.exitReason = "";
  persist();
  sfxConfirm();
  buzz(25);
  go("lift");
}

function startWorkout(key) {

      input: true,
