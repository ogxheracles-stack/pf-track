<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5, user-scalable=yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="PF//TRACK"/>
<meta name="theme-color" content="#04060a"/>
<title>PF//TRACK</title>
<style>
:root{
  /* token aliases — env engine remaps these */
  --bg:#0a0e14;
  --panel:#141b24;
  --panel2:#1a2330;
  --line:#2a3544;
  --line2:#3a4758;
  --text:#e8eef4;
  --dim:#8b9aab;
  --muted:#6b7a8c;
  --neon:#b8ff2e;
  --neon-dim:rgba(184,255,46,.18);
  --cyan:#5ec8d8;
  --hot:#ff6b8a;
  --amber:#ffb020;
  --ok:#3dff9e;
  --ok-bg:rgba(61,255,158,.12);
  --env-glow-a:rgba(94,200,216,.08);
  --env-glow-b:rgba(184,255,46,.04);
  --reactive-glow:rgba(184,255,46,.14);
  --sb-bg:rgba(10,14,20,.98);
  --hud-bg:rgba(10,14,20,.96);
  --radius:14px;
  --radius-sm:12px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --tap:52px;
  --gap:13px;
  --card-pad:19px;
  --env-fade:450ms;
}
html[data-env="day"]{
  --bg:#0c1410;
  --panel:#152018;
  --panel2:#1a2820;
  --line:#2a3a30;
  --line2:#3a4e42;
  --text:#e8f4ec;
  --dim:#8ba898;
  --muted:#6b8a78;
  --neon:#b8ff2e;
  --neon-dim:rgba(184,255,46,.18);
  --cyan:#5ec8a0;
  --hot:#ff6b8a;
  --amber:#ffb020;
  --ok:#3dff9e;
  --ok-bg:rgba(61,255,158,.12);
  --env-glow-a:rgba(184,255,46,.11);
  --env-glow-b:rgba(94,200,160,.07);
  --reactive-glow:rgba(184,255,46,.18);
  --sb-bg:rgba(12,20,16,.98);
  --hud-bg:rgba(12,20,16,.96);
}
html[data-env="night"]{
  --bg:#0a0614;
  --panel:#14101e;
  --panel2:#1a1528;
  --line:#2a2438;
  --line2:#3a3450;
  --text:#ece8f4;
  --dim:#9a8bab;
  --muted:#7a6b8c;
  --neon:#c4a0ff;
  --neon-dim:rgba(196,160,255,.2);
  --cyan:#8a7cff;
  --hot:#ff6b8a;
  --amber:#ffb020;
  --ok:#b89cff;
  --ok-bg:rgba(184,156,255,.14);
  --env-glow-a:rgba(168,140,255,.13);
  --env-glow-b:rgba(94,80,180,.09);
  --reactive-glow:rgba(196,160,255,.2);
  --sb-bg:rgba(10,6,20,.98);
  --hud-bg:rgba(10,6,20,.96);
}
/* Camo accent overlays (cosmetic-only) */
html[data-camo="verde"]{--neon:#b8ff2e;--neon-dim:rgba(184,255,46,.2);--cyan:#6ad4a0;--reactive-glow:rgba(184,255,46,.2)}
html[data-camo="midnight"]{--neon:#c4a0ff;--neon-dim:rgba(196,160,255,.22);--cyan:#8a7cff;--reactive-glow:rgba(196,160,255,.22)}
html[data-camo="glacial"]{--neon:#9ef0ff;--neon-dim:rgba(158,240,255,.2);--cyan:#7ad4e8;--reactive-glow:rgba(158,240,255,.2)}
html[data-camo="royal"]{--neon:#ffd060;--neon-dim:rgba(255,208,96,.2);--cyan:#c4a0ff;--reactive-glow:rgba(255,208,96,.18)}
html[data-camo="emerald"]{--neon:#3dff9e;--neon-dim:rgba(61,255,158,.2);--cyan:#5ec8a0;--reactive-glow:rgba(61,255,158,.2)}
html[data-camo="afterglow"]{--neon:#ff9a6a;--neon-dim:rgba(255,154,106,.22);--cyan:#ffb020;--reactive-glow:rgba(255,154,106,.2)}
html{
  transition:background-color var(--env-fade) ease, color var(--env-fade) ease;
}
html,body{background:var(--bg)}
.btn.pri{
  transition:box-shadow var(--env-fade) ease, filter .15s ease, transform .1s ease;
}
html.reactive-hot .card{
  box-shadow:0 0 28px var(--reactive-glow);
  border-color:var(--neon);
}
html.reactive-hot .btn.pri{
  box-shadow:0 4px 28px var(--reactive-glow);
}
html.reactive-low .card{box-shadow:none}
.shopGrid{display:grid;gap:10px;margin-top:12px}
.shopItem{
  display:flex;flex-direction:column;gap:8px;padding:14px;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-sm);
}
.shopItem.eq{border-color:rgba(184,255,46,.45);box-shadow:inset 3px 0 0 var(--neon)}
.shopSwatch{
  height:36px;border-radius:10px;border:1px solid var(--line2);
  background:linear-gradient(135deg,var(--neon),var(--cyan));
}
.shopRow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.shopMeta{font-size:12px;color:var(--dim)}
.seg{
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;
}
.seg button{
  min-height:44px;border-radius:10px;border:1px solid var(--line2);
  background:var(--panel2);color:var(--dim);font:600 13px/1 var(--font);cursor:pointer;
}
.seg button.on{background:var(--neon-dim);border-color:var(--neon);color:var(--neon)}
.moreList{display:grid;gap:10px;margin-top:8px}
.moreList .btn{justify-content:flex-start;gap:12px;padding-left:16px;text-align:left}
.moreList .btn .ico{opacity:.85;width:22px;text-align:center}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;-webkit-text-size-adjust:100%;background:var(--bg)}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  font-size:16px;
  line-height:1.45;
  overflow-x:hidden;
  background-image:
    radial-gradient(100% 55% at 50% -8%,var(--env-glow-a),transparent 55%),
    radial-gradient(80% 45% at 50% 105%,var(--env-glow-b),transparent 55%);
  background-attachment:fixed;
  transition:background-color var(--env-fade) ease, background-image var(--env-fade) ease, color var(--env-fade) ease;
}
#app{
  max-width:440px;
  margin:0 auto;
  min-height:100vh;
  min-height:100dvh;
  padding:0 16px calc(72px + env(safe-area-inset-bottom,0px));
}
.sb{
  position:sticky;top:0;z-index:40;margin:0 -16px 16px;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;
  display:flex;justify-content:space-between;align-items:center;
  font-size:12px;font-weight:600;color:var(--dim);
  background:linear-gradient(180deg,var(--sb-bg) 70%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.sb b{color:var(--neon);font-weight:700;letter-spacing:0.02em}
.dotlive{
  display:inline-block;width:8px;height:8px;border-radius:50%;
  background:var(--neon);margin-right:8px;vertical-align:middle;
  box-shadow:0 0 6px rgba(184,255,46,.45);opacity:.9;
}
.lbl{
  font-size:12px;font-weight:600;color:var(--dim);
  letter-spacing:0.04em;margin:0;
}
h1{
  font-size:27px;line-height:1.2;margin:8px 0 10px;font-weight:700;
  color:var(--text);letter-spacing:-0.01em;
}
h2{
  font-size:15px;font-weight:700;color:var(--text);margin:0 0 12px;
  letter-spacing:0;
}
.sub{
  color:var(--dim);margin:0 0 16px;font-size:15px;line-height:1.5;
}
.stat{
  font-family:var(--mono);font-size:36px;font-weight:700;
  font-variant-numeric:tabular-nums;line-height:1.1;color:var(--text);
}
.stat small{font-size:15px;color:var(--dim);font-weight:600}
.card{
  position:relative;padding:var(--card-pad);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:var(--radius);
  margin-top:var(--gap);
}
.card:first-of-type{margin-top:0}
.cue{
  background:rgba(255,176,32,.08);
  border-color:rgba(255,176,32,.35);
  color:#f0c27a;
  font-size:15px;line-height:1.5;
}
.cue b{color:#ffd080;font-weight:700}
.btn{
  display:flex;align-items:center;justify-content:center;
  width:100%;min-height:48px;padding:14px 18px;
  background:var(--panel2);border:1px solid var(--line2);
  border-radius:var(--radius-sm);
  color:var(--text);font:600 15px/1.25 var(--font);
  cursor:pointer;text-align:center;
}
.btn:active{transform:scale(.98);filter:brightness(1.08)}
.btn.pri{
  min-height:56px;font-size:17px;font-weight:700;
  background:linear-gradient(180deg,#d4ff6a,#a8e820);
  color:#0a1408;border-color:#e0ff9a;
  box-shadow:0 4px 18px var(--reactive-glow);
}
.btn.ok{
  min-height:56px;font-size:17px;font-weight:700;
  background:linear-gradient(180deg,#4dffaa,#1ec878);
  color:#03180e;border-color:#8affc8;
}
.btn.dan{
  min-height:48px;
  background:rgba(255,47,110,.1);color:#ff8aab;border-color:rgba(255,47,110,.35);
}
.btn.gho{
  background:transparent;color:var(--dim);border-color:var(--line);
  min-height:48px;
}
.btn.big{min-height:56px;font-size:17px}
.btn:disabled,.btn.disabled{opacity:.4;pointer-events:none}
.stack{display:grid;gap:10px;margin-top:16px}
.bar{
  height:10px;background:#0c1218;border:1px solid var(--line);
  border-radius:6px;margin:12px 0 10px;position:relative;overflow:hidden;
}
.bar>i{
  display:block;height:100%;border-radius:5px;
  background:linear-gradient(90deg,var(--cyan),var(--neon));
}
.dots{display:flex;gap:8px;margin:14px 0 8px}
.dot{
  flex:1;height:12px;background:#0c1218;border:1px solid var(--line);
  border-radius:6px;
}
.dot.on{background:var(--neon);border-color:var(--neon)}
.pill{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:28px;padding:4px 10px;font-size:12px;font-weight:600;
  background:var(--panel2);border:1px solid var(--line2);
  border-radius:999px;color:var(--dim);white-space:nowrap;
}
.pill.on{background:var(--ok-bg);border-color:#2a7a52;color:var(--ok)}
.pill.hot{background:rgba(255,176,32,.12);border-color:#5a4018;color:var(--amber)}
.pill.today{background:var(--neon-dim);border-color:#6f9a12;color:var(--neon)}
.row{
  display:flex;justify-content:space-between;gap:12px;
  padding:14px 0;border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:0}
.row b{font-size:15px;font-weight:600;letter-spacing:0}
.row .n{font-size:13px;color:var(--dim);margin-top:4px;line-height:1.4}
.row .r{text-align:right;flex-shrink:0}
.daybtn{
  display:flex;justify-content:space-between;align-items:center;width:100%;
  min-height:64px;padding:14px 16px;margin-bottom:10px;text-align:left;
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-sm);
  color:var(--text);font-family:var(--font);cursor:pointer;gap:12px;
}
.daybtn:active{filter:brightness(1.06)}
.daybtn.is-today{
  border-color:rgba(184,255,46,.55);
  box-shadow:inset 4px 0 0 var(--neon);
  background:rgba(184,255,46,.06);
}
.daybtn .l b{display:block;font-size:16px;font-weight:700}
.daybtn .l span{display:block;font-size:13px;color:var(--dim);margin-top:4px;line-height:1.35}
.setbox{display:flex;gap:12px;margin-top:14px}
.setbox>div{
  flex:1;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:14px 10px;text-align:center;
}
.step{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.step b{
  font-family:var(--mono);font-size:28px;font-weight:700;
  min-width:48px;font-variant-numeric:tabular-nums;
}
.mini{
  width:var(--tap);height:var(--tap);min-width:var(--tap);min-height:var(--tap);
  border-radius:12px;background:var(--panel2);border:1px solid var(--line2);
  color:var(--text);font:700 24px/1 var(--font);cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
  user-select:none;-webkit-user-select:none;
}
.mini:active{background:var(--neon);color:#0a1408;border-color:var(--neon)}
.ringwrap{position:relative;width:200px;height:200px;margin:12px auto}
.ring{width:200px;height:200px}
.ring circle{fill:none;stroke-width:6}
.ring .bg{stroke:#1a2430}
.ring .fg{
  stroke:var(--neon);transform:rotate(-90deg);transform-origin:50% 50%;
  transition:stroke-dashoffset .4s linear;
}
.ringwrap .num{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--mono);font-size:58px;font-weight:700;
  font-variant-numeric:tabular-nums;
}
.check{
  width:88px;height:88px;margin:20px auto;display:grid;place-items:center;
  font-size:40px;color:var(--neon);
  border:2px solid var(--neon);border-radius:20px;
  background:var(--neon-dim);
}
input[type=number]{
  width:100%;min-height:var(--tap);background:#0c1218;
  border:1px solid var(--line2);border-radius:var(--radius-sm);
  color:var(--text);padding:14px 16px;
  font:600 18px/1.2 var(--font);outline:none;
}
input:focus{border-color:var(--neon)}
.toggle{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  min-height:64px;padding:14px 16px;margin-top:10px;
  background:var(--panel2);border:1px solid var(--line);
  border-radius:var(--radius-sm);cursor:pointer;
}
.toggle:first-child{margin-top:0}
.toggle .sw{
  width:52px;height:32px;border-radius:16px;background:#1a2530;
  border:1px solid var(--line2);position:relative;flex-shrink:0;
}
.toggle .sw::after{
  content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;
  border-radius:50%;background:var(--muted);transition:left .15s ease,background .15s ease;
}
.toggle.on .sw{background:var(--neon-dim);border-color:var(--neon)}
.toggle.on .sw::after{left:23px;background:var(--neon)}
.toggle b{font-size:16px;font-weight:600;display:block}
.toggle span{display:block;font-size:13px;color:var(--dim);margin-top:3px;line-height:1.35}
nav.hud{
  position:fixed;left:50%;bottom:0;transform:translateX(-50%);
  width:100%;max-width:440px;z-index:45;
  display:grid;grid-template-columns:repeat(6,1fr);
  background:var(--hud-bg);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);
  padding:6px 2px calc(8px + env(safe-area-inset-bottom,0px));
  gap:2px;
}
nav.hud button{
  background:0;border:0;color:var(--dim);
  font:600 10.5px/1.15 var(--font);
  min-height:56px;min-width:44px;padding:8px 1px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;cursor:pointer;border-radius:10px;
}
nav.hud button .ico{font-size:18px;opacity:.8;line-height:1}
nav.hud button.on{color:var(--neon);background:var(--neon-dim)}
nav.hud button.on .ico{opacity:1}
.toast{
  position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);z-index:55;
  background:rgba(12,28,20,.97);border:1px solid #2c6b46;
  border-radius:12px;color:var(--ok);
  padding:14px 18px;font-size:14px;font-weight:600;
  max-width:min(390px,92vw);text-align:center;
}
.boot{padding-top:calc(48px + env(safe-area-inset-top,0px))}
.bootline{
  font-size:14px;color:var(--ok);margin:0 0 10px;opacity:0;
  animation:bootin .4s ease forwards;
}
.bootline.dim{color:var(--dim)}
@keyframes bootin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.boottitle{
  font-size:28px;font-weight:700;margin:0 0 6px;color:var(--neon);
  letter-spacing:0.02em;
}
@keyframes bootfill{from{width:0}to{width:100%}}
.center{text-align:center}
.mt{margin-top:16px}
.mb{margin-bottom:16px}
.xpdots{display:flex;gap:8px;margin:12px 0}
.xpdots i{
  flex:1;height:10px;background:#0c1218;border:1px solid var(--line);
  border-radius:5px;
}
.xpdots i.on{background:var(--cyan);border-color:var(--cyan)}
.modal-bg{
  position:fixed;inset:0;z-index:80;
  background:rgba(4,8,12,.78);
  display:flex;align-items:flex-end;justify-content:center;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));
}
.modal{
  width:100%;max-width:400px;
  background:var(--panel);border:1px solid var(--line2);
  border-radius:18px;padding:22px 18px 18px;
  box-shadow:0 -8px 40px rgba(0,0,0,.45);
}
.modal h2{margin:0 0 8px;font-size:20px}
.modal p{margin:0 0 16px;color:var(--dim);font-size:15px;line-height:1.5}
.modal .stack{margin-top:0}
.modal input[type=text],.modal textarea{
  width:100%;min-height:var(--tap);background:#0c1218;
  border:1px solid var(--line2);border-radius:var(--radius-sm);
  color:var(--text);padding:14px 16px;
  font:600 16px/1.3 var(--font);outline:none;margin-bottom:12px;
  resize:vertical;
}
.modal textarea{min-height:110px;font-weight:500}
.modal input:focus,.modal textarea:focus{border-color:var(--neon)}
.undoGhost{
  position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);z-index:54;
  background:rgba(20,27,36,.97);border:1px solid var(--line2);
  border-radius:12px;color:var(--text);
  padding:12px 16px;font-size:14px;font-weight:600;
  max-width:min(390px,92vw);display:flex;align-items:center;gap:12px;
}
.undoGhost button{
  background:var(--panel2);border:1px solid var(--line2);color:var(--neon);
  border-radius:10px;padding:8px 14px;font:700 13px/1 var(--font);cursor:pointer;
}
.pinsLine{font-size:13px;color:var(--dim);margin:0 0 12px;line-height:1.45}
.pinsLine b{color:var(--text);font-weight:600}
.foodDots{display:flex;gap:8px;margin:12px 0 4px}
.foodDots i{
  flex:1;height:12px;background:#0c1218;border:1px solid var(--line);
  border-radius:6px;
}
.foodDots i.on{background:var(--ok);border-color:var(--ok)}
.foodDots i.partial{background:var(--amber);border-color:var(--amber)}
.delta{font-size:14px;font-weight:600;margin-top:4px}
.delta.up{color:var(--hot)}.delta.down{color:var(--ok)}.delta.flat{color:var(--dim)}
.walkMark{color:var(--amber);font-size:12px;font-weight:700;margin-left:6px}

.pinCard .row{padding:12px 0}
.pinCard .pinVal{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--neon)}
.pinCard .repsVal{font-size:12px;color:var(--dim);margin-top:2px}
.pinStrip{padding:10px 14px}
.pinStrip .pinLine{
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding:5px 0;font-size:13px;line-height:1.35;border-bottom:1px solid var(--line);
}
.pinStrip .pinLine:last-child{border-bottom:0;padding-bottom:0}
.pinStrip .pinLine b{font-weight:600;color:var(--text)}
.pinStrip .pinLine .meta{font-family:var(--mono);font-size:12px;color:var(--dim);white-space:nowrap}
.pinStrip .pinLine .meta b{color:var(--neon);font-weight:700}
.pinStrip .pinLine.preSkip{opacity:.55}
.fuelBar{
  height:14px;background:#0c1218;border:1px solid var(--line);
  border-radius:8px;margin:10px 0 8px;position:relative;overflow:hidden;
}
.fuelBar>i{
  display:block;height:100%;border-radius:7px;
  background:linear-gradient(90deg,var(--cyan),var(--neon));
}
.fuelBar .mark{
  position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.25);
}
.heat{
  background:rgba(255,107,138,.1);
  border-color:rgba(255,107,138,.4);
  color:#ffb0c0;
}
.heat b{color:#ffd0da}
.heatLine{margin:8px 0 0;font-size:13px;color:var(--muted)}
.crowdTag{display:inline-block;margin-top:6px}
.chip{
  display:inline-block;font-size:11px;font-weight:600;
  padding:2px 8px;border-radius:999px;margin-left:6px;
  background:rgba(255,176,32,.12);color:var(--amber);

function equipCamo(id) {
  const c = ensureCosmetics();
  const item = CAMO_ITEMS.find(function(x) { return x.id === id; });
  if (!item) return;
  if (c.owned.indexOf(id) < 0) c.owned.push(id);
  c.camo = id;
  c.equipped.camo = id;
  persist();
  applyCamoClass();
  toast("Equipped · " + item.name + " · cosmetic only · no IAP yet");
}

function proteinRange() {
  const lbm = Number(state.stats.lbm) || 175;
  return Math.round(lbm) + "–" + Math.round(lbm * 1.1);
}

function defaultMacrosFromLbm() {
  const lbm = Number(state && state.stats && state.stats.lbm) || 175;
  const proteinTarget = Math.round(lbm); // lower end of LBM range
  const fatTarget = Math.max(40, Math.round(lbm * 0.35));
  const calTarget = Math.round(lbm * 12);
  const carbsTarget = Math.max(50, Math.round((calTarget - proteinTarget * 4 - fatTarget * 9) / 4));
  return {
    calTarget: calTarget,
    proteinTarget: proteinTarget,
    carbsTarget: carbsTarget,
    fatTarget: fatTarget,
    cal: 0,
    protein: 0,
    carbs: 0,
    fat: 0
  };
}

function ensureMacros() {
  const base = defaultMacrosFromLbm();
  if (!state.macros || typeof state.macros !== "object") {
    state.macros = base;
  } else {
    const m = state.macros;
    ["calTarget","proteinTarget","carbsTarget","fatTarget","cal","protein","carbs","fat"].forEach(function(k) {
      if (m[k] == null || isNaN(Number(m[k]))) m[k] = base[k];
      else m[k] = Number(m[k]);
    });
  }
  return state.macros;
}

function greetingForHour(h) {
  if (h < 12) return "Good morning";
  if (h < 17) return "Good afternoon";
  return "Good evening";
}

function activityStreak() {
  // Consecutive calendar days (ending today or yesterday) with a session or walk.
  const days = {};
  (state.sessions || []).forEach(function(s) {
    if (s && s.date) days[s.date] = 1;
  });
  (state.walks || []).forEach(function(w) {
    if (w && w.date) days[w.date] = 1;
  });
  let streak = 0;
  const cursor = new Date();
  // Allow streak to start from yesterday if today empty
  const today = todayISO();
  if (!days[today]) {
    cursor.setDate(cursor.getDate() - 1);
  }
  for (let i = 0; i < 365; i++) {
    const iso = isoFromDate(cursor);
    if (!days[iso]) break;
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}

function clearLiveStorage() {
  try { sessionStorage.removeItem(LIVE_KEY); } catch (e) {}
}

function saveLive() {
  if (!state || !state.live) {
    clearLiveStorage();
    return;
  }
  try {
    sessionStorage.setItem(LIVE_KEY, JSON.stringify({
      savedAt: Date.now(),
      live: state.live
    }));
  } catch (e) {}
}

function loadLive() {
  try {
    const raw = sessionStorage.getItem(LIVE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || !parsed.live || !parsed.savedAt) return null;
    if (Date.now() - parsed.savedAt > LIVE_TTL_MS) {
      clearLiveStorage();
      return null;
    }
    return parsed.live;
  } catch (e) {
    return null;
  }
}

function load() {
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) {}
  let data = defaults();
  if (raw) {
    try {
      const parsed = JSON.parse(raw);
      data = Object.assign(defaults(), parsed);
      if (!data.stats) data.stats = defaults().stats;
      if (data.stats.lbm == null) data.stats.lbm = 175;
      if (data.stats.bf == null || data.stats.bf === "") data.stats.bf = null;
      else data.stats.bf = Number(data.stats.bf);
      if (!data.lastWeights) data.lastWeights = {};
      if (!Array.isArray(data.sessions)) data.sessions = [];
      if (!Array.isArray(data.bodyweights)) data.bodyweights = [];
      if (!data.readyUp || typeof data.readyUp !== "object") data.readyUp = {};
      if (!Array.isArray(data.walks)) data.walks = [];
      if (typeof data.feetCookedWeek !== "string") data.feetCookedWeek = "";
      if (typeof data.hamWeirdWeek === "string") {
        /* already week-scoped */
      } else if (data.hamWeird === true) {
        data.hamWeirdWeek = weekStartISO();
      } else {
        data.hamWeirdWeek = "";
      }
      try { delete data.hamWeird; } catch (e) {}
      if (data.sleepHours != null) data.sleepHours = Number(data.sleepHours);
      else data.sleepHours = null;
      if (typeof data.haptics !== "boolean") data.haptics = true;
      if (typeof data.sound !== "boolean") data.sound = true;
      if (!Array.isArray(data.foodHistory)) data.foodHistory = [];
      if (data.food && data.food.date && !data.foodHistory.some(function(f){ return f.date === data.food.date; })) {
        data.foodHistory.unshift({
          date: data.food.date,
          work: !!data.food.work,
          home: !!data.food.home,
          after: !!data.food.after,
          rice: !!data.food.rice
        });
      }
      data.foodHistory = data.foodHistory.slice(0, 120);
      if (!data.dayNotes || typeof data.dayNotes !== "object" || Array.isArray(data.dayNotes)) data.dayNotes = {};
      data.pet = normalizePet(data.pet);
      data.cosmetics = normalizeCosmetics(data.cosmetics);
    } catch (e) {}
  }
  if (!data.dayNotes || typeof data.dayNotes !== "object" || Array.isArray(data.dayNotes)) data.dayNotes = {};
  data.pet = normalizePet(data.pet);
  data.cosmetics = normalizeCosmetics(data.cosmetics);
  state = data;
  ensureMacros();
  data.macros = state.macros;
  data.live = null;
  state = data;
  const resumed = loadLive();
  if (resumed && resumed.key && PROGRAMS[resumed.key] && Array.isArray(resumed.sets)) {
    state.live = resumed;
  }
  return state;
}

function persist() {
  const copy = Object.assign({}, state);
  copy.live = null;
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(copy)); } catch (e) {}
  saveLive();
  try { updateAppBadge(); } catch (e) {}
}

function audio() {
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  if (AC && AC.state === "suspended") AC.resume();
  return AC;
}

function blip(freq, dur, type, vol) {
  if (!state || !state.sound) return;
  const ctx = audio();
  if (!ctx) return;
  try {
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = type || "square";
    o.frequency.value = freq;
    g.gain.value = vol != null ? vol : 0.04;
    o.connect(g); g.connect(ctx.destination);
    const t = ctx.currentTime;
    g.gain.setValueAtTime(g.gain.value, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (dur || 0.1));
    o.start(t); o.stop(t + (dur || 0.1) + 0.02);
  } catch (e) {}
}

function todayISO() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}

function weekStart() {
  const d = new Date();
  const day = d.getDay();
  const satOffset = (day + 1) % 7;
  d.setDate(d.getDate() - satOffset);
  d.setHours(0, 0, 0, 0);
  return d;
}

function parseLocalDate(iso) {
  const parts = String(iso || "").split("-");
  if (parts.length < 3) return new Date(NaN);
  return new Date(+parts[0], +parts[1] - 1, +parts[2]);
}

function isoFromDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}

function addMonths(date, n) {
  const d = new Date(date.getFullYear(), date.getMonth(), 1);
  d.setMonth(d.getMonth() + n);
  return d;
}

function planForISO(iso) {
  const dt = parseLocalDate(iso);
  if (isNaN(dt.getTime())) return null;
  const day = dt.getDay();
  return WEEK.find(function(w) { return w.d === day; }) || null;
}

function ensureFoodFor(iso) {
  if (!iso) return ensureFood();
  if (!Array.isArray(state.foodHistory)) state.foodHistory = [];
  let entry = state.foodHistory.find(function(f) { return f.date === iso; });
  if (!entry) {
    entry = {date: iso, work: false, home: false, after: false, rice: false};
    state.foodHistory.unshift(entry);
  }
  if (entry.rice == null) entry.rice = false;
  state.foodHistory = state.foodHistory
    .sort(function(a, b) { return a.date < b.date ? 1 : -1; })
    .slice(0, 120);
  if (iso === todayISO()) state.food = entry;
  return entry;
}

function sessionsForISO(iso) {
  return (state.sessions || []).filter(function(s) { return s.date === iso; });
}

function bodyweightForISO(iso) {
  return (state.bodyweights || []).find(function(w) { return w.date === iso; }) || null;
}

function foodForISO(iso) {
  return (state.foodHistory || []).find(function(f) { return f.date === iso; }) || null;
}

function dayMarks(iso) {
  const sessions = sessionsForISO(iso);
  const lift = sessions.some(function(s) {
    return s.key && PROGRAMS[s.key];
  });
  const food = foodForISO(iso);
  const foodN = food ? ((food.work ? 1 : 0) + (food.home ? 1 : 0) + (food.after ? 1 : 0)) : 0;
  const walk = !!walkForDate(iso);
  const note = !!(state.dayNotes && state.dayNotes[iso] && String(state.dayNotes[iso]).trim());
  return {lift: lift, foodN: foodN, walk: walk, note: note};
}

function formatCalTitle(d) {
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

function ensureCalCursor() {
  if (!calCursor || isNaN(calCursor.getTime())) {
    const t = new Date();

function isFutureISO(iso) {
  return iso > todayISO();
}

function isoInCurrentWeek(iso) {
  const start = weekStart();
  const dt = parseLocalDate(iso);
  if (isNaN(dt.getTime())) return false;
  const end = new Date(start);
  end.setDate(start.getDate() + 7);
  return dt >= start && dt < end;
}

function sessionsThisWeek() {
  const start = weekStart();
  return state.sessions.filter(function(s) {
    const dt = parseLocalDate(s.date);
    return dt >= start;
  });
}

function didKeyThisWeek(key) {
  return sessionsThisWeek().some(function(s) { return s.key === key; });
}

function liftKeysClearedThisWeek() {
  const keys = ["upper-a", "lower-a", "upper-b", "lower-b"];
  return keys.filter(function(k) { return didKeyThisWeek(k); }).length;
}

function walkForDate(iso) {
  return (state.walks || []).find(function(w) { return w.date === iso; });
}

function walkThisWeekForDay(d) {
  const start = weekStart();
  const target = new Date(start);
  const orderIdx = WEEK_ORDER.indexOf(d);
  target.setDate(start.getDate() + (orderIdx < 0 ? 0 : orderIdx));
  const y = target.getFullYear();
  const m = String(target.getMonth() + 1).padStart(2, "0");
  const day = String(target.getDate()).padStart(2, "0");
  return walkForDate(y + "-" + m + "-" + day);
}


function weekStartISO() {
  const d = weekStart();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}

function isFeetCooked() {
  if (state.feetCookedWeek && state.feetCookedWeek === weekStartISO()) return true;
  const start = weekStart();
  return (state.walks || []).some(function(w) {
    if (!w.feetCooked) return false;
    const dt = parseLocalDate(w.date);
    return dt >= start;
  });
}

function setFeetCooked(on) {
  state.feetCookedWeek = on ? weekStartISO() : "";
  if (!on) {
    const start = weekStart();
    (state.walks || []).forEach(function(w) {
      const dt = parseLocalDate(w.date);
      if (dt >= start) w.feetCooked = false;
    });
  }
}

function isHamWeird() {
  return !!(state.hamWeirdWeek && state.hamWeirdWeek === weekStartISO());
}

function setHamWeird(on) {
  state.hamWeirdWeek = on ? weekStartISO() : "";
}

function lastRepsFor(id) {
  for (let i = 0; i < (state.sessions || []).length; i++) {
    const s = state.sessions[i];
    if (!s.work) continue;
    for (let j = 0; j < s.work.length; j++) {
      if (s.work[j].id !== id) continue;
      const sets = (s.work[j].sets || []).filter(function(x) { return x.done && !x.skipped; });
      if (sets.length) return sets.map(function(x) { return x.r; }).join("/");
      break;
    }
  }
  return "—";
}

};

function resolveMovementId(raw) {
  const k = String(raw || "").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  if (!k) return null;
  if (MOVEMENT_ALIASES[k]) return MOVEMENT_ALIASES[k];
  // try without accents already stripped
  const keys = Object.keys(MOVEMENT_ALIASES);
  for (let i = 0; i < keys.length; i++) {
    const ak = keys[i].normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    if (ak === k) return MOVEMENT_ALIASES[keys[i]];
  }
  // known program ids
  const ids = ["press","lat","row","raise","rear","tri","curlbi","chest","lpress","abd","ext","curl","calf"];
  if (ids.indexOf(k) >= 0) return k;
  return null;
}

function formatPFTRACK(session) {
  if (!session) return "";
  let lines = ["PFTRACK"];
  if (session.key) lines.push("key: " + session.key);
  (session.work || []).forEach(function(w) {
    const sets = (w.sets || []).filter(function(x) { return x.done && !x.skipped; });
    if (!sets.length) return;
    lines.push(w.id + " " + sets.map(function(s) { return s.w + "x" + s.r; }).join(" "));
  });
  if (session.diff != null) lines.push("diff: " + session.diff);
  if (session.sore != null) lines.push("sore: " + session.sore);
  if (session.feet != null) lines.push("feet: " + session.feet);
  return lines.join("\n");
}

function parsePFTRACK(text) {
  const raw = String(text || "").trim();
  if (!raw) return {ok: false, error: "Empty"};
  const lines = raw.split(/\r?\n/).map(function(l) { return l.trim(); }).filter(Boolean);
  let start = 0;
  if (/^pftrack$/i.test(lines[0])) start = 1;
  const pins = {};
  let key = null;
  let log = false;
  let meta = {};
  for (let i = start; i < lines.length; i++) {
    const line = lines[i];
    const metaM = line.match(/^(key|diff|sore|feet|log)\s*:\s*(.+)$/i);
    if (metaM) {
      const mk = metaM[1].toLowerCase();
      const mv = metaM[2].trim();
      if (mk === "key") key = mv.toLowerCase();
      else if (mk === "log") log = /^(1|true|yes|y)$/i.test(mv);
      else meta[mk] = mv;
      continue;
    }
    const m = line.match(/^(.+?)\s+((?:\d+(?:\.\d+)?[xX×]\d+)(?:\s+\d+(?:\.\d+)?[xX×]\d+)*)$/);
    if (!m) continue;
    const id = resolveMovementId(m[1]);
    if (!id) continue;
    const pairs = m[2].split(/\s+/).map(function(p) {
      const parts = p.split(/[xX×]/);
      return {w: parseFloat(parts[0]), r: parseInt(parts[1], 10)};
    }).filter(function(p) { return p.w > 0 && p.r > 0; });
    if (!pairs.length) continue;
    pins[id] = pairs;
  }
  return {ok: true, key: key, pins: pins, log: log, meta: meta};
}

function applyPFTRACK(parsed) {
  if (!parsed || !parsed.ok) return {updated: 0};
  let updated = 0;
  const work = [];
  Object.keys(parsed.pins).forEach(function(id) {
    const pairs = parsed.pins[id];
    const last = pairs[pairs.length - 1];
    state.lastWeights[id] = last.w;
    updated++;
    // readyUp if both sets 15+
    if (pairs.length >= 2 && pairs[0].r >= 15 && pairs[1].r >= 15 && pairs[0].w === pairs[1].w) {
      // leave readyUp detection to next complete session; pins only here
    }
    work.push({
      id: id,
      name: id,
      sets: pairs.map(function(p) { return {w: p.w, r: p.r, done: true, skipped: false}; })
    });
  });
  if (parsed.log && work.length) {
    const key = parsed.key && PROGRAMS[parsed.key] ? parsed.key : null;
    const name = key ? PROGRAMS[key].name : "Uplink session";
    // enrich names from program if possible
    if (key) {
      work.forEach(function(w) {
        const ex = PROGRAMS[key].items.find(function(x) { return x.id === w.id; });
        if (ex) w.name = ex.name;
      });
    } else {
      Object.keys(PROGRAMS).forEach(function(k) {
        PROGRAMS[k].items.forEach(function(ex) {
          work.forEach(function(w) { if (w.id === ex.id && w.name === w.id) w.name = ex.name; });
        });
      });
    }
    state.sessions.unshift({
      date: todayISO(),
      key: key || "uplink",
      name: name,
      minutes: 1,
      reason: "uplink",
      work: work,
      diff: parsed.meta.diff,
      sore: parsed.meta.sore,
      feet: parsed.meta.feet
    });
    if (state.sessions.length > 60) state.sessions.length = 60;
  }
  persist();
  return {updated: updated, logged: !!parsed.log};
}


function xp() {
  return state.sessions.reduce(function(n, s) {
    const done = (s.work || []).reduce(function(a, w) {
      return a + (w.sets || []).filter(function(x) { return x.done && !x.skipped; }).length;
    }, 0);
    return n + done * 5 + 10;
  }, 0);
}

function level() {
  return Math.floor(xp() / 40) + 1;
}

function xpInto() {
  return xp() % 40;
}

function defaultPet() {
  return {
    ember: 0,
    owned: ["scale_moss", "horn_neon"],

    lastSeenLevel: 1,
    celebrateUntil: 0,
    fullWeekAwarded: ""
  };
}

function normalizePet(raw) {
  const d = defaultPet();
  if (!raw || typeof raw !== "object") return d;
  const p = Object.assign({}, d, raw);
  if (!Array.isArray(p.owned)) p.owned = d.owned.slice();
  ["scale_moss", "horn_neon"].forEach(function(id) {
    if (p.owned.indexOf(id) < 0) p.owned.push(id);
  });
  if (!p.equipped || typeof p.equipped !== "object") p.equipped = Object.assign({}, d.equipped);
  if (!p.equipped.scale) p.equipped.scale = "scale_moss";
  if (!p.equipped.horn) p.equipped.horn = "horn_neon";
  if (!Array.isArray(p.equipped.extras)) p.equipped.extras = [];
  p.ember = Math.max(0, Number(p.ember) || 0);
  p.lastSeenLevel = Math.max(1, Number(p.lastSeenLevel) || 1);
  p.celebrateUntil = Number(p.celebrateUntil) || 0;
  p.fullWeekAwarded = typeof p.fullWeekAwarded === "string" ? p.fullWeekAwarded : "";
  // Old builds stored a Date → JSON UTC string; never equals local weekStartISO()
  if (p.fullWeekAwarded.indexOf("T") >= 0) p.fullWeekAwarded = "";
  return p;
}

  if (!it) return;
  const owned = pet.owned.indexOf(id) >= 0;
  if (!owned) {
    if (pet.ember < it.cost) { toast("Need more embers"); return; }
    pet.ember -= it.cost;
    pet.owned.push(id);
    if (it.slot === "extra") {
      if (pet.equipped.extras.indexOf(id) < 0) pet.equipped.extras.push(id);
    } else {
      pet.equipped[it.slot] = id;
    }
    sfxConfirm();
    buzz(30);
    toast("Unlocked · " + it.name);
  } else if (it.slot === "extra") {
    const idx = pet.equipped.extras.indexOf(id);
    if (idx >= 0) pet.equipped.extras.splice(idx, 1);
    else pet.equipped.extras.push(id);
    sfxTap();
  } else {
    pet.equipped[it.slot] = id;
    sfxTap();
  }
  persist();
  renderPetWidget();
  const panel = document.getElementById("pet-panel");
  if (panel && !panel.hidden) {
    panel.innerHTML = petPanelHtml();
    applyPetPalette(document.getElementById("petHeroArt"));
    bindPetPanel();
  }
}

    .replace(/</g, "&lt;")

    .replace(/"/g, "&quot;");
}

function restRemaining() {
  if (!state.live || !state.live.restUntil) return 0;
  return Math.max(0, Math.ceil((state.live.restUntil - Date.now()) / 1000));
}

function restTotal() {
  if (!state.live) return 75;
  const ex = PROGRAMS[state.live.key].items[state.live.i];
  return restSecFor(ex.id);
}

function stopRestTick() {
  if (restTickHandle) { clearInterval(restTickHandle); restTickHandle = null; }
}

function patchRestUI() {
  const rem = restRemaining();
  const num = document.querySelector(".ringwrap .num");
  const fg = document.querySelector(".ring circle.fg");
  if (!num || !fg) return false;
  if (rem <= 0) return false;
  num.textContent = String(rem);
  const totalRest = restTotal();
  const off = CIRC * (1 - rem / Math.max(1, totalRest));
  fg.setAttribute("stroke-dashoffset", off.toFixed(1));
  return true;
}

function ensureRestTick() {
  stopRestTick();
  if (!state.live || !state.live.restUntil) return;
  if (document.visibilityState !== "visible") return;
  restTickHandle = setInterval(function() {
    if (!state.live || !state.live.restUntil) {
      stopRestTick();
      return;
    }
    const rem = restRemaining();
    if (rem <= 0) {
      state.live.restUntil = 0;
      saveLive();
      stopRestTick();
      blip(1046, 0.13, "triangle", 0.05);
      setTimeout(function() { blip(1568, 0.16, "triangle", 0.05); }, 150);
      buzz([40, 60, 40]);
      if (view === "lift") render();
      return;
    }
    // Patch ring in place — no full render / no pet SVG rebuild while resting
    if (view === "lift" && !patchRestUI()) render();
  }, 250);
}

function startRest() {
  if (!state.live) return;
  const ex = PROGRAMS[state.live.key].items[state.live.i];
  const sec = restSecFor(ex.id);
  state.live.restUntil = Date.now() + sec * 1000;
  saveLive();
  ensureRestTick();
  render();
}

function clearRest() {
  if (state.live) state.live.restUntil = 0;
  stopRestTick();
}

function applyReadyUp(items) {
  return items.map(function(ex) {
    let w = state.lastWeights[ex.id] != null ? state.lastWeights[ex.id] : 10;
    // Apply +5 to live sets only; consume readyUp flag on first completed set
    if (state.readyUp && state.readyUp[ex.id]) {
      w = w + 5;
    }
    return [
      {w: w, r: 12, done: false, skipped: false},
      {w: w, r: 12, done: false, skipped: false}
    ];
  });
}

function doStartWorkout(key) {
  const p = PROGRAMS[key];
  if (!p) return;
  clearUndo();
  const sets = applyReadyUp(p.items);
  if (key === "lower-b") {
    p.items.forEach(function(ex, idx) {
      if (ex.id === "calf" && isFeetCooked()) {
        sets[idx].forEach(function(s) { s.skipped = true; s.done = false; });
      }
      if (ex.id === "curl" && isHamWeird()) {
        sets[idx].forEach(function(s) { s.skipped = true; s.done = false; });
      }
    });
  }
  state.live = {
    key: key,
    date: todayISO(),
    i: 0,
    set: 0,
    restUntil: 0,
    started: Date.now(),
    sets: sets
  };
  advancePastPreSkipped();
  if (state.live.i >= p.items.length) {
    // everything pre-skipped — still open empty? finish as partial
    state.exitReason = "";
    persist();
    finishWorkout("partial");
    return;
  }
  state.exitReason = "";
  persist();
  sfxConfirm();
  buzz(25);
  go("lift");
}

function bump(kind, dir, step) {
  if (!state.live) return;
  const live = state.live;
  const s = live.sets[live.i][live.set];
  const st = step || 1;
  if (kind === "w") {
    s.w = Math.max(5, s.w + dir * 5 * st);
  } else {
    s.r = Math.max(1, Math.min(30, s.r + dir * st));
  }
  sfxTap();
  saveLive();
  // In-place update so long-press isn't destroyed by full re-render
  const box = document.querySelectorAll(".setbox b");
  if (box && box.length >= 2) {
    box[0].textContent = s.w;
    box[1].textContent = s.r;
  } else {
    render();
  }
}

function bindLongPress(btn, kind, dir) {
  let holdTimeout = null;
  let holdInterval = null;
  let armed = false;
  function fire(step) {
    if (step > 1) longPressFired = true;
    bump(kind, dir, step);
  }
  function clearLP() {
    if (holdTimeout) { clearTimeout(holdTimeout); holdTimeout = null; }
    if (holdInterval) { clearInterval(holdInterval); holdInterval = null; }
  }
  btn.addEventListener("pointerdown", function(e) {
    e.preventDefault();
    longPressFired = false;
    armed = true;
    clearLP();
    holdTimeout = setTimeout(function() {
      holdTimeout = null;
      fire(2);
      holdInterval = setInterval(function() { fire(2); }, 220);
    }, 420);
  });
  function end(e) {
    const wasLong = longPressFired;
    const wasArmed = armed;
    armed = false;
    clearLP();
    if (wasArmed && !wasLong && e.type !== "pointercancel") fire(1);
    longPressFired = false;
  }
  btn.addEventListener("pointerup", end);
  btn.addEventListener("pointerleave", function() {
    armed = false;
    clearLP();
    longPressFired = false;
  });
  btn.addEventListener("pointercancel", end);
}

function checkProgression(session) {
  (session.work || []).forEach(function(w) {
    const sets = (w.sets || []).filter(function(x) { return x.done && !x.skipped; });
    if (sets.length < 2) return;
    if (!(sets[0].r >= 15 && sets[1].r >= 15)) return;
    const pin = sets[0].w;
    if (sets[1].w !== pin) return;
    let found = null;
    for (let i = 1; i < state.sessions.length; i++) {
      const s = state.sessions[i];
      if (!s.work) continue;
      for (let j = 0; j < s.work.length; j++) {
        const ww = s.work[j];
        if (ww.id !== w.id) continue;
        const ss = (ww.sets || []).filter(function(x) { return x.done && !x.skipped; });
        if (ss.length >= 2) { found = ss.slice(0, 2); break; }
      }
      if (found) break;
    }
    if (!found) return;
    if (found[0].w !== pin || found[1].w !== pin) return;
    if (!(found[0].r >= 15 && found[1].r >= 15)) return;
    state.readyUp[w.id] = true;
    toast(w.name + " · ready to up one hole");
  });
}

function completeSet() {
  if (tapLock) return;
  tapLock = true;
  setTimeout(function() { tapLock = false; }, 380);
  const live = state.live;
  if (!live) return;
  const ex = PROGRAMS[live.key].items[live.i];
  const readyPending = !!(state.readyUp && state.readyUp[ex.id]);
  undoSnapshot = {
    i: live.i,
    set: live.set,
    restUntil: live.restUntil || 0,
    setData: Object.assign({}, live.sets[live.i][live.set]),
    lastW: state.lastWeights[ex.id],
    readyUpId: readyPending ? ex.id : null
  };
  live.sets[live.i][live.set].done = true;
  live.sets[live.i][live.set].skipped = false;
  state.lastWeights[ex.id] = live.sets[live.i][live.set].w;
  if (readyPending) {
    delete state.readyUp[ex.id];
    toast(ex.name + " · pin +5");
  }
  sfxConfirm();
  buzz(30);
  if (undoTimer) clearTimeout(undoTimer);
  undoTimer = setTimeout(function() {
    clearUndo();
  }, 8000);
  if (live.set === 0) {
    live.set = 1;
    startRest();
    showUndoGhost();
  } else {
    clearRest();
    if (live.i < PROGRAMS[live.key].items.length - 1) {
      live.i += 1;
      live.set = 0;
      advancePastPreSkipped();
      if (live.i >= PROGRAMS[live.key].items.length) {
        clearUndo();
        finishWorkout("complete");
      } else {
        saveLive();
        render();
        showUndoGhost();
      }
    } else {
      clearUndo();
      finishWorkout("complete");
    }
  }
}

function undoLastSet() {
  if (!undoSnapshot || !state.live) return;
  const live = state.live;
  const snap = undoSnapshot;
  const ex = PROGRAMS[live.key].items[snap.i];
  live.i = snap.i;
  live.set = snap.set;
  live.restUntil = 0;
  live.sets[snap.i][snap.set] = Object.assign({}, snap.setData, {done: false, skipped: false});
  if (snap.lastW == null) delete state.lastWeights[ex.id];
  else state.lastWeights[ex.id] = snap.lastW;
  if (snap.readyUpId) state.readyUp[snap.readyUpId] = true;
  clearUndo();
  stopRestTick();
  saveLive();
  sfxTap();
  toast("Set undone");
  render();
}

function skipMovement() {
  const live = state.live;
  if (!live) return;
  clearUndo();
  clearRest();
  const sets = live.sets[live.i];
  for (let i = live.set; i < sets.length; i++) {
    if (!sets[i].done) {
      sets[i].done = false;
      sets[i].skipped = true;
    }
  }
  if (live.i < PROGRAMS[live.key].items.length - 1) {
    live.i += 1;
    live.set = 0;
    advancePastPreSkipped();
    if (live.i >= PROGRAMS[live.key].items.length) {
      finishWorkout("partial");
    } else {
      saveLive();
      render();
    }
  } else {
    finishWorkout("partial");
  }
}

function finishWorkout(reason) {
  clearUndo();
  clearRest();
  const live = state.live;
  if (!live) return;
  const p = PROGRAMS[live.key];
  const session = {
    date: live.date,
    key: live.key,
    name: p.name,
    minutes: Math.max(1, Math.round((Date.now() - live.started) / 60000)),
    reason: reason || "complete",
    work: p.items.map(function(ex, i) {
      return {id: ex.id, name: ex.name, sets: live.sets[i]};
    })
  };
  state.sessions.unshift(session);
  if (state.sessions.length > 60) state.sessions.length = 60;
  if (reason === "complete") checkProgression(session);
  state.live = null;
  state.exitReason = reason || "complete";
  clearLiveStorage();
  const doneSets = (session.work || []).reduce(function(a, w) {
    return a + (w.sets || []).filter(function(x) { return x.done && !x.skipped; }).length;
  }, 0);
  let emberAward = {gained: 0, bonus: 0, total: ensurePet().ember};
  if (doneSets > 0) {
    emberAward = awardSessionEmbers();
  }
  if (reason === "complete") sfxDone();
  else sfxWarn();
  buzz(60);
  persist();
  updateAppBadge();
  go("done");
  if (doneSets > 0) {
    let emberMsg = "+" + emberAward.gained + " embers";
    if (emberAward.bonus) emberMsg += " · +" + emberAward.bonus + " week bonus";
    toast(emberMsg);
  }
}

function weightDeltaHtml() {
  const list = state.bodyweights || [];
  if (!list.length) return "";
  const latest = list[0];
  const latestDt = parseLocalDate(latest.date).getTime();
  let older = null;
  for (let i = 1; i < list.length; i++) {
    const dt = parseLocalDate(list[i].date).getTime();
    const days = (latestDt - dt) / 86400000;
    if (days >= 5 && days <= 10) { older = list[i]; break; }
  }
  if (!older && list.length > 1) older = list[list.length - 1];
  if (!older) return '<div class="delta flat">trend · need ~7d prior</div>';
  const delta = Math.round((latest.lb - older.lb) * 10) / 10;
  const cls = delta > 0 ? "up" : (delta < 0 ? "down" : "flat");
  const sign = delta > 0 ? "+" : "";
  return '<div class="delta ' + cls + '">trend ' + sign + delta + " lb vs ~7d</div>";
}

function dismissBubbleNote() {
  const n = document.getElementById("bubbleNote");
  if (n) n.remove();
}

function showBubbleNote(btn, text) {
  dismissBubbleNote();
  if (!text) return;
  const note = document.createElement("div");
  note.id = "bubbleNote";
  note.className = "bubbleNote";
  note.setAttribute("role", "tooltip");
  note.textContent = text;
  document.body.appendChild(note);
  const r = btn.getBoundingClientRect();
  const nw = note.offsetWidth;
  const nh = note.offsetHeight;
  let left = r.left + r.width / 2 - nw / 2;
  left = Math.max(12, Math.min(left, window.innerWidth - nw - 12));
  let top = r.top - nh - 12;
  let below = false;
  if (top < 10) {
    top = r.bottom + 12;
    below = true;
  }
  if (below) note.classList.add("below");
  note.style.left = Math.round(left) + "px";
  note.style.top = Math.round(top) + "px";
}

function bindBubblePress(btn) {
  let holdTimer = null;
  let noteShown = false;
  function clearHold() {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
  }
  function onDown(e) {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    noteShown = false;
    longPressFired = false;
    clearHold();
    holdTimer = setTimeout(function() {
      holdTimer = null;
      noteShown = true;
      longPressFired = true;
      showBubbleNote(btn, btn.getAttribute("data-note") || "");
      try { if (state.haptics && navigator.vibrate) navigator.vibrate(10); } catch (err) {}
    }, 450);
  }
  function onUp() {
    clearHold();
  }
  function onCancel() {
    clearHold();
    noteShown = false;
    longPressFired = false;
  }
  btn.addEventListener("pointerdown", onDown);
  btn.addEventListener("pointerup", onUp);
  btn.addEventListener("pointercancel", onCancel);
  btn.addEventListener("pointerleave", function() { clearHold(); });
  btn.addEventListener("contextmenu", function(e) { e.preventDefault(); });
  btn.addEventListener("click", function(e) {
    if (noteShown || longPressFired) {
      e.preventDefault();
      e.stopImmediatePropagation();
      noteShown = false;
      longPressFired = false;
      return;
    }
    dismissBubbleNote();
    const g = btn.getAttribute("data-bubble");
    sfxTap();
    if (g === "pet") { openPetPanel(); return; }
    go(g);
  });
}

  let html = statusbar();

  html += '<div class="lbl">' + esc(prog.name) + "</div>";
  html += '<div class="bar"><i style="width:' + pct + '%"></i></div>';
  html += '<div class="lbl" style="margin-bottom:14px">Move ' + (live.i + 1) + "/" + prog.items.length + " · Set " + (live.set + 1) + "/2 · " + pct + "%</div>";

function screenCal() {
  ensureCalCursor();
  const title = formatCalTitle(calCursor);
  const today = todayISO();
  const year = calCursor.getFullYear();
  const month = calCursor.getMonth();
  const first = new Date(year, month, 1);
  const firstDow = first.getDay(); // 0=Sun
  // Grid starts Saturday (WEEK_ORDER[0]=6)
  const lead = (firstDow + 1) % 7; // Sat=0
  const start = new Date(year, month, 1 - lead);
  let html = statusbar();
  html += '<div class="lbl">Calendar</div><h1>' + esc(title) + "</h1>";
  html += '<div class="calHead">';
  html += '<button class="btn gho" id="calPrev">Prev</button>';
  html += '<button class="btn pri" id="calToday">Today</button>';
  html += '<button class="btn gho" id="calNext">Next</button>';
  html += "</div>";
  html += '<div class="calDow">';
  WEEK_ORDER.forEach(function(di) {
    const w = WEEK.find(function(x) { return x.d === di; });
    html += "<span>" + esc(w ? w.short : "") + "</span>";
  });
  html += "</div>";
  html += '<div class="calGrid">';
  for (let i = 0; i < 42; i++) {
    const cell = new Date(start);
    cell.setDate(start.getDate() + i);
    const iso = isoFromDate(cell);
    const inMonth = cell.getMonth() === month;
    const marks = dayMarks(iso);
    const cls = ["calCell"];
    if (!inMonth) cls.push("mute");
    if (iso === today) cls.push("today");
    html += '<button type="button" class="' + cls.join(" ") + '" data-cal-iso="' + iso + '">';
    html += '<span class="n">' + cell.getDate() + "</span>";
    html += '<span class="calDots">';
    let dots = 0;
    if (marks.lift && dots < 3) { html += '<i class="lift"></i>'; dots++; }
    if (marks.foodN > 0 && dots < 3) { html += '<i class="food"></i>'; dots++; }
    if (marks.walk && dots < 3) { html += '<i class="walk"></i>'; dots++; }
    html += "</span></button>";
  }
  html += "</div>";
  html += '<p class="sub mt">Tap a day to edit lifts, food, walk.</p>';
  html += nav("recovery");
  return html;
}

      if (walk) html += '<div class="lbl" style="margin-top:10px;color:var(--amber)">Walk marked · ' + walk.minutes + " min" + (walk.feetCooked ? " · feet cooked" : "") + "</div>";
    }
    html += "</div>";
  }

  // D. Scale
  html += '<div class="card mt"><h2>Scale</h2>';
  html += '<div class="stat" style="font-size:28px;margin:6px 0">' + (bw ? bw.lb + "<small> LB</small>" : "—") + "</div>";
  if (bw) html += '<div class="lbl">' + bw.date + "</div>";
  if (!future) {
    html += '<div class="stack" style="margin-top:10px"><input type="number" id="bwInput" placeholder="Weight (lb)" min="100" max="500" step="0.1"/>';
    html += '<button class="btn pri" id="bwSave" data-bw-iso="' + iso + '">Save scale</button></div>';
  }
  html += "</div>";

  // E. Day note
  html += '<div class="card mt"><h2>Day note</h2>';
  html += '<textarea id="calDayNote" placeholder="What mattered today — pins, feet, plate, mood." style="min-height:110px">' + esc(note) + "</textarea>";
  html += '<div class="stack"><button class="btn pri" id="calNoteSave">Save note</button></div></div>';

  html += nav("recovery");
  return html;
}

function bindWalkControls() {
  if ($("walkMinus")) $("walkMinus").onclick = function() {
    walkMinutes = Math.max(5, walkMinutes - 5);
    sfxTap();
    render();
  };
  if ($("walkPlus")) $("walkPlus").onclick = function() {
    walkMinutes = Math.min(180, walkMinutes + 5);
    sfxTap();
    render();
  };
  if ($("feetCookedToggle")) $("feetCookedToggle").onclick = function() {
    const iso = $("feetCookedToggle").getAttribute("data-walk-iso") || todayISO();
    const w = walkForDate(iso);
    const currentlyOn = !!(w && w.feetCooked) || (isoInCurrentWeek(iso) && isFeetCooked());
    const on = !currentlyOn;
    if (isoInCurrentWeek(iso)) setFeetCooked(on);
    if (w) w.feetCooked = on;
    else if (on) {
      // mark intent on a stub walk only if one exists; otherwise wait for log
    }
    sfxTap();
    persist();
    render();
  };
  if ($("walkLog")) $("walkLog").onclick = function() {
    const t = $("walkLog").getAttribute("data-walk-iso") || todayISO();
    if (isFutureISO(t)) { toast("Future · plan only"); return; }
    const existing = (state.walks || []).findIndex(function(w) { return w.date === t; });
    let cooked = false;
    if ($("feetCookedToggle") && $("feetCookedToggle").classList.contains("on")) cooked = true;
    else if (existing >= 0 && state.walks[existing].feetCooked) cooked = true;
    else if (isoInCurrentWeek(t) && isFeetCooked()) cooked = true;
    const entry = {date: t, minutes: walkMinutes, feetCooked: !!cooked};
    if (cooked && isoInCurrentWeek(t)) setFeetCooked(true);
    if (existing >= 0) state.walks[existing] = entry;
    else {
      state.walks.unshift(entry);
      if (state.walks.length > 120) state.walks.length = 120;
    }
    sfxConfirm();
    buzz(25);
    persist();
    toast("Walk logged · " + walkMinutes + " min" + (cooked ? " · feet cooked" : ""));
    render();
  };
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(function() { return true; }).catch(function() { return false; });
  }
  return Promise.resolve(false).then(function() {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) {}
    ta.remove();
    return ok;
  });
}

function exportBackup() {
  let raw = "";
  try { raw = localStorage.getItem(STORAGE_KEY) || "{}"; } catch (e) { raw = "{}"; }
  copyText(raw).then(function(ok) {
    if (ok) toast("Backup copied");
    else {
      showModal({
        title: "Export backup",
        body: "Copy this JSON manually.",

      });

    }
  });
}

function importBackup() {
  showModal({
    title: "Import backup",
    body: "Paste a PF//TRACK JSON backup. This replaces local storage.",
    textarea: true,
    placeholder: '{ "sessions": [] … }',
    okLabel: "Preview…",
    onOk: function(val) {
      let parsed = null;
      try { parsed = JSON.parse(val); } catch (e) { toast("Invalid JSON"); return; }
      if (!parsed || typeof parsed !== "object") { toast("Invalid backup"); return; }
      showModal({
        title: "Replace storage?",
        body: "This overwrites " + STORAGE_KEY + " and reloads state.",
        okLabel: "Replace & reload",
        danger: true,
        onOk: function() {
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed)); } catch (e) {}
          clearLiveStorage();
          load();
          applyEnvironment();
          toast("Backup loaded · v" + APP_VERSION);
          go("home");
        }
      });
    }
  });
}

function wipeAll() {

function tickClock() {
  if (document.visibilityState !== "visible") return;
  const el = document.getElementById("sbClock");
  if (!el || view === "boot") return;
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, "0");
  const mm = String(now.getMinutes()).padStart(2, "0");
  const ss = String(now.getSeconds()).padStart(2, "0");
  const live = state.live ? '<span class="dotlive"></span>LIVE' : "OFFLINE";
  el.innerHTML = live + " · " + hh + ":" + mm + ":" + ss;
  // Re-apply env when auto crosses day/night boundary
  try {
    const want = resolveEnvironment();
    const have = document.documentElement.getAttribute("data-env");
    if (want !== have) applyEnvironment();
    else applyReactiveClass();
  } catch (e) {}
}

function startClock() {
  if (clockHandle) clearInterval(clockHandle);
  clockHandle = null;
  if (document.visibilityState !== "visible") return;
  clockHandle = setInterval(tickClock, 1000);
  tickClock();
}

function makeNeonIcon(size) {
  const c = document.createElement("canvas");
  c.width = size; c.height = size;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#04060a";
  ctx.fillRect(0, 0, size, size);
  const pad = Math.round(size * 0.155);
  const box = size - pad * 2;
  const rad = Math.round(size * 0.155);
  ctx.fillStyle = "#b8ff2e";
  if (ctx.roundRect) {
    ctx.beginPath();
    ctx.roundRect(pad, pad, box, box, rad);
    ctx.fill();
  } else {
    ctx.fillRect(pad, pad, box, box);
  }
  ctx.fillStyle = "#0a1408";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.font = "bold " + Math.round(size * 0.29) + "px system-ui,sans-serif";
  ctx.fillText("PF", size / 2, size * 0.49);
  ctx.font = "bold " + Math.round(size * 0.1) + "px system-ui,sans-serif";
  ctx.fillText("TRACK", size / 2, size * 0.68);
  return c.toDataURL("image/png");
}

function setupPwaChrome() {
  try {
    const icon180 = makeNeonIcon(180);
    const icon192 = makeNeonIcon(192);
    let link = document.querySelector('link[rel="apple-touch-icon"]');
    if (!link) {
      link = document.createElement("link");
      link.rel = "apple-touch-icon";
      document.head.appendChild(link);
    }
    link.href = icon180;
    let icon = document.querySelector('link[rel="icon"]');
    if (!icon) {
      icon = document.createElement("link");
      icon.rel = "icon";
      document.head.appendChild(icon);
    }
    icon.href = icon180;
    const startUrl = (location.href || "./").split("#")[0] || "./";
    const manifest = {
      name: "PF//TRACK",
      short_name: "PF//TRACK",
      display: "standalone",
      orientation: "portrait",
      background_color: "#04060a",
      theme_color: "#04060a",
      start_url: startUrl,
      icons: [
        {src: icon180, sizes: "180x180", type: "image/png"},
        {src: icon192, sizes: "192x192", type: "image/png"}
      ]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type: "application/json"});
    const murl = URL.createObjectURL(blob);
    let ml = document.querySelector('link[rel="manifest"]');
    if (!ml) {
      ml = document.createElement("link");
      ml.rel = "manifest";
      document.head.appendChild(ml);
    }
    ml.href = murl;
  } catch (e) {}
}

function isHttps() {
  return location.protocol === "https:";
}

async function requestWakeLock() {
  if (!isHttps()) return;
  if (!navigator.wakeLock || !navigator.wakeLock.request) return;
  if (document.visibilityState !== "visible") return;
  if (!(view === "lift" && state && state.live)) return;
  try {
    if (wakeLockSentinel) {
      try { await wakeLockSentinel.release(); } catch (e) {}
      wakeLockSentinel = null;
    }
    wakeLockSentinel = await navigator.wakeLock.request("screen");
    wakeLockSentinel.addEventListener("release", function() {
      wakeLockSentinel = null;
    });
  } catch (e) {}
}

async function releaseWakeLock() {
  try {
    if (wakeLockSentinel) {
      await wakeLockSentinel.release();
      wakeLockSentinel = null;
    }
  } catch (e) {
    wakeLockSentinel = null;
  }
}

function syncWakeLock() {
  if (view === "lift" && state && state.live && document.visibilityState === "visible") {
    requestWakeLock();
  } else {
    releaseWakeLock();
  }
}

function updateAppBadge() {
  if (!isHttps()) return;
  if (!navigator.setAppBadge && !navigator.clearAppBadge) return;
  try {
    const plan = todayPlan();
    const liftDay = !!(plan && plan.key);
    let logged = false;
    if (liftDay) {
      logged = sessionsThisWeek().some(function(s) { return s.key === plan.key; }) ||
        state.sessions.some(function(s) { return s.date === todayISO() && s.key === plan.key; });
    }
    if (liftDay && !logged) {
      if (navigator.setAppBadge) navigator.setAppBadge(1).catch(function(){});
    } else if (navigator.clearAppBadge) {
      navigator.clearAppBadge().catch(function(){});
    }
  } catch (e) {}
}

function askPersistOnce() {
  if (persistAsked) return;
  persistAsked = true;
  if (!isHttps()) return;
  try {
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(function(){});
    }
  } catch (e) {}
}

function registerOfflineSW() {
  if (!isHttps()) return;
  if (!("serviceWorker" in navigator)) return;
  try {
    const pageUrl = (location.href || "./").split("#")[0];
    const swCode = [
      "const PAGE = " + JSON.stringify(pageUrl) + ";",
      "const CACHE = 'pftrack-v40';",
      "self.addEventListener('install', function(e) {",
      "  e.waitUntil(caches.open(CACHE).then(function(c) { return c.addAll([PAGE, './']).catch(function(){}); }).then(function(){ return self.skipWaiting(); }));",
      "});",
      "self.addEventListener('activate', function(e) { e.waitUntil(self.clients.claim()); });",
      "self.addEventListener('fetch', function(e) {",
      "  if (e.request.method !== 'GET') return;",
      "  e.respondWith(caches.match(e.request).then(function(hit) {",
      "    return hit || fetch(e.request).then(function(res) {",
      "      try { var copy = res.clone(); caches.open(CACHE).then(function(c){ c.put(e.request, copy); }); } catch (err) {}",
      "      return res;",
      "    }).catch(function(){ return hit || Response.error(); });",
      "  }));",
      "});"
    ].join("\n");
    const blob = new Blob([swCode], {type: "text/javascript"});
    const url = URL.createObjectURL(blob);
    navigator.serviceWorker.register(url, {scope: "./"}).catch(function(){});
  } catch (e) {}
}

function setupVisualViewportPad() {
  if (!window.visualViewport) return;
  const apply = function() {
    const app = document.getElementById("app");
    if (!app) return;
    const need = (view === "link" || view === "fuel");
    const vv = window.visualViewport;
    const keyboardOpen = need && vv && (window.innerHeight - vv.height > 80);
    if (keyboardOpen) {
      const pad = Math.max(0, Math.round(window.innerHeight - vv.height - (vv.offsetTop || 0))) + 24;
      app.style.paddingBottom = pad + "px";
      vvPadActive = true;
      try {
        const focus = document.activeElement;
        if (focus && (focus.tagName === "TEXTAREA" || focus.tagName === "INPUT")) {
          focus.scrollIntoView({block: "center", behavior: "smooth"});
        }
      } catch (e) {}
    } else if (vvPadActive) {
      app.style.paddingBottom = "";
      vvPadActive = false;
    }
  };
  window.visualViewport.addEventListener("resize", apply);
  window.visualViewport.addEventListener("scroll", apply);
  window.addEventListener("focusin", apply);
  window.addEventListener("focusout", function() { setTimeout(apply, 80); });
}

function unlockAudioOnce() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  try { audio(); } catch (e) {}
  askPersistOnce();
}

function onVisibility() {
  if (document.visibilityState === "visible") {
    startClock();
    if (state && state.live && state.live.restUntil) {
      if (restRemaining() <= 0) {
        state.live.restUntil = 0;
        saveLive();
      }
      ensureRestTick();
      if (view === "lift") render();
    }
    syncWakeLock();
  } else {
    if (clockHandle) { clearInterval(clockHandle); clockHandle = null; }
    stopRestTick();
    releaseWakeLock();
  }
}

function bootSequence() {
  load();
  ensureCosmetics();
  applyEnvironment();
  watchBattery();
  setupPwaChrome();
  setupVisualViewportPad();
  registerOfflineSW();
  updateAppBadge();
  let skip = false;
  try { skip = sessionStorage.getItem("pftrack_booted") === "1"; } catch (e) {}
  if (skip) {
    booted = true;
    view = state.live ? "lift" : "home";
    render();
    startClock();
    syncWakeLock();
    return;
  }
  view = "boot";
  render();
  setTimeout(function() {
    try { sessionStorage.setItem("pftrack_booted", "1"); } catch (e) {}
    booted = true;
    view = state.live ? "lift" : "home";
    sfxDone();
    render();
    startClock();
    syncWakeLock();
  }, 1600);
}

document.addEventListener("pointerdown", unlockAudioOnce, {once: true, passive: true});
document.addEventListener("visibilitychange", onVisibility);
bootSequence();

</script>
