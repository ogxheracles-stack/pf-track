# XcodeGen spec for the plain WKWebView build (PFTrack app + PFTrackWidget extension).
#   brew install xcodegen && cd ios && xcodegen generate && open PFTrack.xcodeproj
# The Capacitor build lives in ios/cap (generated by the Capacitor CLI); see README_IOS.md.
name: PFTrack
options:
  bundleIdPrefix: com.pjperez
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "4.76"
    CURRENT_PROJECT_VERSION: "476"
    DEVELOPMENT_TEAM: ""   # set your Team ID
targets:
  PFTrack:
    type: application
    platform: iOS
    sources:
      - path: PFTrack
        excludes: ["*.entitlements", "Info.plist"]
      - path: Shared
      - path: ../index.html
        buildPhase: resources     # offline fallback copy of the web app
    entitlements:
      path: PFTrack/PFTrack.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pjperez.pftrack
        INFOPLIST_FILE: PFTrack/Info.plist   # hand-written; XcodeGen does not regenerate it
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: PFTrackWidget
        embed: true
      - sdk: HealthKit.framework
      - sdk: WidgetKit.framework
      - sdk: WebKit.framework
  PFTrackWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PFTrackWidget
        excludes: ["*.entitlements", "Info.plist"]
      - path: Shared
    entitlements:
      path: PFTrackWidget/PFTrackWidget.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pjperez.pftrack.widget
        INFOPLIST_FILE: PFTrackWidget/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
